<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday · JMB Virtuals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ══ BIRTHDAY FILM — party edition (Oct 18 2026) ══
   /birthday/film.html?id=<folder> reads <folder>/config.json (name, dates, photos, music, bpm).
   The music is the clock: every frame is drawn from the song's current time, and the bounce follows its beat
   (config.bpm / beat0), so pause, replay and a late start stay in sync. Embedded in the portal (?embed=1) it tells
   the parent when it ends or is closed. Preview a still: ?at=SECONDS. */
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; overflow:hidden; font-family:'Inter',-apple-system,'Segoe UI',sans-serif; color:#2b1a4a; background:#ffd6e5; }
#wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(60vw 50vh at 15% 10%, rgba(255,255,255,.75), rgba(255,255,255,0) 70%),
             radial-gradient(70vw 60vh at 90% 90%, rgba(168,216,255,.9), rgba(168,216,255,0) 70%),
             linear-gradient(135deg,#ffe29a 0%,#ffb3c7 48%,#b9dcff 100%); }
#stage{ position:relative; flex:none; width:1600px; height:900px; transform-origin:center center; overflow:hidden; }
.fun{ font-family:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',sans-serif; }
.hand{ font-family:'Caveat','Comic Sans MS',cursive; }
.abs{ position:absolute; }
.center{ left:0; right:0; text-align:center; }
.sc{ opacity:0; }
/* balloons */
.bl{ position:absolute; width:96px; height:118px; border-radius:50% 50% 48% 48% / 55% 55% 45% 45%; }
.bl::after{ content:''; position:absolute; left:50%; bottom:-9px; margin-left:-7px; border:7px solid transparent; border-bottom:10px solid; border-bottom-color:inherit; transform:rotate(180deg); }
.bl i{ position:absolute; left:50%; top:126px; width:2px; height:150px; margin-left:-1px; background:rgba(43,26,74,.25); }
.bl b{ position:absolute; left:22%; top:16%; width:22%; height:30%; border-radius:50%; background:rgba(255,255,255,.55); transform:rotate(25deg); }
/* scene 1 — cake */
#s1pill{ top:120px; left:50%; transform:translateX(-50%); background:#fff; color:#ff4d8d; padding:10px 26px; border-radius:999px; font-size:26px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; box-shadow:0 10px 30px rgba(255,77,141,.25); }
#s1line{ top:190px; font-size:62px; font-weight:800; color:#2b1a4a; }
#cake{ left:50%; top:330px; width:520px; margin-left:-260px; height:470px; }
.plate{ position:absolute; left:-30px; right:-30px; bottom:0; height:44px; border-radius:50%; background:#fff; box-shadow:0 14px 30px rgba(43,26,74,.18); }
.tier{ position:absolute; left:50%; border-radius:26px 26px 18px 18px; overflow:hidden; }
.tier.t1{ width:500px; margin-left:-250px; bottom:24px; height:170px; background:linear-gradient(180deg,#ff8fb3,#ff5c93); }
.tier.t2{ width:360px; margin-left:-180px; bottom:186px; height:130px; background:linear-gradient(180deg,#ffe08a,#ffc53d); }
.drip{ position:absolute; left:0; right:0; top:0; height:46px; background:#fff; border-radius:0 0 20px 20px; }
.drip i{ position:absolute; top:30px; width:34px; height:40px; background:#fff; border-radius:0 0 18px 18px; }
.spr{ position:absolute; width:16px; height:6px; border-radius:3px; }
.cd{ position:absolute; bottom:312px; width:22px; height:96px; border-radius:6px 6px 3px 3px; background:repeating-linear-gradient(135deg,#fff 0 9px,#7ad3ff 9px 18px); }
.fl{ position:absolute; left:50%; width:20px; height:34px; margin-left:-10px; top:-40px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%, #fff8dc 0%, #ffd34d 40%, #ff8a3d 75%, rgba(255,107,26,0) 100%); box-shadow:0 0 30px 10px rgba(255,190,80,.6); transform-origin:50% 100%; }
/* scene 2 — title */
#s2t{ top:250px; font-size:200px; font-weight:800; line-height:1; letter-spacing:-.01em; }
#s2t span{ display:inline-block; -webkit-text-stroke:6px #fff; paint-order:stroke fill; text-shadow:0 10px 0 rgba(43,26,74,.12); }
#s2sub{ top:500px; font-size:40px; font-weight:800; color:#2b1a4a; }
#s2sub em{ font-style:normal; background:#fff; padding:4px 18px; border-radius:14px; color:#9b5de5; }
/* scene 3 — the star */
#s3card{ left:170px; top:110px; width:560px; height:680px; border-radius:40px; overflow:hidden; background:#fff; padding:16px; box-shadow:0 30px 70px rgba(43,26,74,.25); }
#s3card .im{ width:100%; height:100%; border-radius:28px; overflow:hidden; }
#s3card img{ width:100%; height:100%; object-fit:cover; object-position:50% 25%; }
#s3badge{ left:610px; top:90px; background:#ffd93d; color:#2b1a4a; padding:14px 26px; border-radius:999px; font-size:30px; font-weight:800; transform:rotate(8deg); box-shadow:0 12px 26px rgba(43,26,74,.2); }
#s3k{ left:820px; top:300px; font-size:30px; font-weight:800; color:#ff4d8d; letter-spacing:.06em; text-transform:uppercase; }
#s3n{ left:816px; top:338px; font-size:118px; line-height:.98; font-weight:800; width:740px; color:#2b1a4a; }
#s3r{ left:820px; top:610px; font-size:30px; font-weight:700; color:#5b3f8f; }
#s3d{ left:820px; top:652px; font-size:24px; color:#7b6a99; }
/* scene 4 — polaroid pile */
.ph{ position:absolute; left:50%; top:50%; background:#fff; padding:16px 16px 70px; border-radius:8px; box-shadow:0 26px 60px rgba(43,26,74,.28); }
.ph .im{ overflow:hidden; background:#f1e9f7; }
.ph img{ width:100%; height:100%; object-fit:cover; display:block; }
.ph .cap{ position:absolute; left:0; right:0; bottom:14px; text-align:center; font-size:40px; color:#2b1a4a; }
.ph .tape{ position:absolute; top:-16px; left:50%; width:130px; height:34px; margin-left:-65px; background:rgba(255,217,61,.75); transform:rotate(-4deg); }
#s4k{ top:44px; font-size:54px; font-weight:800; color:#2b1a4a; }
/* scene 5 — tenure */
#s5k{ top:170px; font-size:34px; font-weight:800; color:#ff4d8d; letter-spacing:.04em; text-transform:uppercase; }
#s5d{ top:220px; font-size:60px; color:#2b1a4a; }
#s5y{ top:300px; font-size:260px; font-weight:800; line-height:1; }
#s5y span{ -webkit-text-stroke:8px #fff; paint-order:stroke fill; background:linear-gradient(90deg,#ff4d8d,#ff8a3d,#ffc53d,#2ec4b6,#00bbf9,#9b5de5); -webkit-background-clip:text; background-clip:text; color:transparent; }
#s5days{ top:590px; font-size:48px; font-weight:800; color:#2b1a4a; }
#s5line{ top:660px; font-size:30px; color:#5b3f8f; font-weight:600; }
/* scene 6 — team */
#s6k{ top:120px; font-size:34px; font-weight:800; color:#ff4d8d; letter-spacing:.04em; text-transform:uppercase; }
#s6t{ top:165px; font-size:96px; font-weight:800; color:#2b1a4a; }
#s6names{ left:120px; right:120px; top:330px; height:470px; }
.nm{ position:absolute; white-space:nowrap; font-weight:800; color:#2b1a4a; padding:12px 26px; border-radius:999px; font-size:32px; box-shadow:0 10px 22px rgba(43,26,74,.14); }
/* scene 7 — finale */
#s7ph{ left:50%; top:90px; width:250px; height:250px; margin-left:-125px; border-radius:50%; overflow:hidden; border:10px solid #fff; box-shadow:0 20px 50px rgba(43,26,74,.25); }
#s7ph img{ width:100%; height:100%; object-fit:cover; object-position:50% 25%; }
#s7t{ top:380px; font-size:132px; font-weight:800; line-height:1; white-space:nowrap; }
#s7t span{ display:inline-block; -webkit-text-stroke:6px #fff; paint-order:stroke fill; }
#s7s{ top:560px; font-size:56px; color:#2b1a4a; }
#s7m{ left:50%; top:680px; margin-left:-160px; width:320px; display:flex; align-items:center; justify-content:center; gap:14px; font-size:24px; font-weight:800; letter-spacing:.08em; color:#2b1a4a; }
#s7m img{ width:52px; height:52px; }
#cf{ position:absolute; inset:0; pointer-events:none; }
/* controls */
#bar{ position:fixed; left:0; right:0; bottom:0; padding:14px 18px 16px; display:flex; align-items:center; gap:12px; background:linear-gradient(0deg,rgba(43,26,74,.35),rgba(43,26,74,0)); opacity:0; transition:opacity .25s; }
body:hover #bar, body.paused #bar, body.ended #bar{ opacity:1; }
.btn{ border:none; background:#fff; color:#2b1a4a; border-radius:999px; padding:10px 18px; font:700 13px/1 'Inter',sans-serif; cursor:pointer; box-shadow:0 6px 16px rgba(43,26,74,.18); }
#prog{ flex:1; height:6px; border-radius:999px; background:rgba(255,255,255,.6); overflow:hidden; cursor:pointer; }
#prog i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#ff4d8d,#ffc53d,#2ec4b6); }
#closeTop{ position:fixed; top:14px; right:16px; display:none; }
body.embed #closeTop{ display:block; }
#gate, #endc{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; background:rgba(255,240,246,.55); backdrop-filter:blur(4px); }
#gate.on, #endc.on{ display:flex; }
.big{ border:none; background:linear-gradient(135deg,#ff4d8d,#ff8a3d); color:#fff; font:800 20px/1 'Inter',sans-serif; padding:20px 34px; border-radius:999px; cursor:pointer; box-shadow:0 18px 40px rgba(255,77,141,.35); }
#gate p, #endc p{ font-size:16px; color:#2b1a4a; font-weight:700; }
#endc .row{ display:flex; gap:12px; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="balloons"></div>
  <div id="s1" class="sc abs" style="inset:0">
    <div id="s1pill" class="abs"></div>
    <div id="s1line" class="abs center fun">Something sweet is coming…</div>
    <div id="cake" class="abs"></div>
  </div>
  <div id="s2" class="sc abs" style="inset:0">
    <div id="s2t" class="abs center fun"></div>
    <div id="s2sub" class="abs center fun">from your <em>JMB Virtuals</em> family</div>
  </div>
  <div id="s3" class="sc abs" style="inset:0">
    <div id="s3card" class="abs"><div class="im"><img id="s3img" alt=""></div></div>
    <div id="s3badge" class="abs fun">Birthday star</div>
    <div id="s3k" class="abs fun">Say hello to</div>
    <div id="s3n" class="abs fun"></div>
    <div id="s3r" class="abs"></div>
    <div id="s3d" class="abs"></div>
  </div>
  <div id="s4" class="sc abs" style="inset:0"><div id="s4k" class="abs center fun"></div></div>
  <div id="s5" class="sc abs" style="inset:0">
    <div id="s5k" class="abs center fun">With JMB Virtuals since</div>
    <div id="s5d" class="abs center hand"></div>
    <div id="s5y" class="abs center fun"><span id="s5yn"></span></div>
    <div id="s5days" class="abs center fun"></div>
    <div id="s5line" class="abs center">of good vibes, hard work and great teamwork</div>
  </div>
  <div id="s6" class="sc abs" style="inset:0">
    <div id="s6k" class="abs center fun">From all of us</div>
    <div id="s6t" class="abs center fun"></div>
    <div id="s6names" class="abs"></div>
  </div>
  <div id="s7" class="sc abs" style="inset:0">
    <div id="s7ph" class="abs"><img id="s7img" alt=""></div>
    <div id="s7t" class="abs center fun"></div>
    <div id="s7s" class="abs center hand"></div>
    <div id="s7m" class="abs"><img src="/birthday/jmb-logo-mark.svg" alt="">JMB VIRTUALS</div>
  </div>
  <canvas id="cf" width="1600" height="900"></canvas>
</div></div>

<button id="closeTop" class="btn" type="button">Close</button>
<div id="bar">
  <button id="pp" class="btn" type="button">Pause</button>
  <button id="mu" class="btn" type="button">Mute</button>
  <div id="prog"><i></i></div>
</div>
<div id="gate"><button class="big" type="button" id="go">Play the birthday video</button><p>Turn your sound on</p></div>
<div id="endc"><div class="row"><button class="big" type="button" id="again">Watch again</button><button class="btn" type="button" id="endClose">Close</button></div><p id="endP"></p></div>
<audio id="au" preload="auto"></audio>

<script>
(function(){
  var Q=new URLSearchParams(location.search), ID=(Q.get('id')||'').replace(/[^a-z0-9\-_]/gi,''), EMBED=Q.get('embed')==='1';
  if(EMBED) document.body.classList.add('embed');
  var T=56, C=null, au=document.getElementById('au'), stage=document.getElementById('stage');
  var t0=0, playing=false, ended=false, useAudio=true, base=0, lastNow=0, BEAT=0.4, BEAT0=0;
  var COLS=['#ff4d8d','#ff8a3d','#ffc53d','#2ec4b6','#00bbf9','#9b5de5','#f15bb5','#06d6a0'];
  var PASTEL=['#ffd6e5','#ffe8b3','#d3f5ef','#d6ecff','#eadcff','#ffe0cc','#e0ffd6','#fff3b0'];
  function $(id){ return document.getElementById(id); }
  function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
  function eo(x){ x=clamp(x,0,1); return 1-Math.pow(1-x,3); }
  function back(x){ x=clamp(x,0,1); var c1=1.9, c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); }   /* overshoot pop */
  function win(t,a,b,fi,fo){ if(t<a||t>b) return 0; return Math.min(fi?clamp((t-a)/fi,0,1):1, fo?clamp((b-t)/fo,0,1):1); }
  function beat(t){ var p=((t-BEAT0)%BEAT+BEAT)%BEAT/BEAT; return Math.exp(-p*7); }   /* 1 on the beat, fades */
  function fit(){ var s=Math.min(innerWidth/1600, innerHeight/900); stage.style.transform='scale('+s+')'; }
  addEventListener('resize', fit); fit();
  function post(m){ if(EMBED){ try{ parent.postMessage(Object.assign({ id:ID }, m), location.origin); }catch(e){} } }

  /* balloons — drawn from the clock so they pause with the film */
  var BL=[];
  (function(){ var box=$('balloons'); for(var i=0;i<16;i++){ var d=document.createElement('div'); d.className='bl'; var c=COLS[i%COLS.length];
      d.style.background='radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), rgba(255,255,255,0) 40%), '+c; d.style.borderBottomColor=c; d.style.color=c; d.innerHTML='<b></b><i></i>';
      var s=0.6+Math.random()*0.7; BL.push({ el:d, x:Math.random()*1600, sp:22+Math.random()*30, ph:Math.random()*6, s:s, off:Math.random()*1100 }); box.appendChild(d); } })();
  function drawBalloons(t, boost){ BL.forEach(function(b){ var y=1000-((b.off+t*b.sp*(1+boost))%1300); var x=b.x+Math.sin(t*0.9+b.ph)*24;
      b.el.style.transform='translate('+x+'px,'+y+'px) scale('+b.s+') rotate('+(Math.sin(t*1.2+b.ph)*6)+'deg)'; }); }

  /* confetti: a gentle drizzle all the time, bursts on the drops */
  var cv=$('cf'), cx=cv.getContext('2d'), P=[];
  function spawn(x,y,vx,vy){ P.push({ x:x, y:y, vx:vx, vy:vy, r:7+Math.random()*8, c:COLS[(Math.random()*COLS.length)|0], rot:Math.random()*6, vr:(Math.random()-.5)*.35, w:Math.random()<.5, life:1 }); }
  function burst(n,x,y){ for(var i=0;i<n;i++){ var a=-Math.PI/2+(Math.random()-.5)*2.4, v=9+Math.random()*13; spawn(x,y,Math.cos(a)*v,Math.sin(a)*v); } }
  function drawConf(dt, drizzle){
    var f=dt*60; if(drizzle && Math.random()<0.55*f) spawn(Math.random()*1600, -20, (Math.random()-.5)*2, 1+Math.random()*2);
    cx.clearRect(0,0,1600,900);
    for(var i=P.length-1;i>=0;i--){ var p=P[i]; p.vy+=0.28*f; p.vy=Math.min(p.vy, 7); p.vx*=Math.pow(0.99,f); p.x+=p.vx*f*0.7+Math.sin(p.rot)*0.6; p.y+=p.vy*f*0.7; p.rot+=p.vr*f; p.life-=dt*0.12;
      if(p.y>940||p.life<=0){ P.splice(i,1); continue; }
      cx.save(); cx.globalAlpha=clamp(p.life*1.6,0,1); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.c;
      if(p.w){ cx.fillRect(-p.r/2,-p.r/5,p.r,p.r/2.5); } else { cx.beginPath(); cx.arc(0,0,p.r/3,0,6.283); cx.fill(); }
      cx.restore(); } }

  function fmtDate(d){ return new Date(d+'T00:00:00').toLocaleDateString('en-US',{ month:'long', day:'numeric', year:'numeric' }); }
  function letters(el, txt){ el.innerHTML=txt.split('').map(function(ch,i){ return ch===' '?'<span>&nbsp;</span>':'<span style="color:'+COLS[i%COLS.length]+'">'+ch.replace(/[<>&]/g,'')+'</span>'; }).join(''); }
  var PH=[];
  function build(){
    var first=C.first||String(C.name||'').split(' ')[0];
    if(C.bpm) BEAT=60/C.bpm; if(C.beat0!=null) BEAT0=+C.beat0;
    $('s1pill').textContent=new Date(C.date+'T00:00:00').toLocaleDateString('en-US',{ month:'long', day:'numeric' });
    /* cake */
    var ck=$('cake'), h='<div class="plate"></div><div class="tier t1"><div class="drip">'+[30,95,170,250,330,410].map(function(x){ return '<i style="left:'+x+'px;height:'+(28+(x%3)*10)+'px"></i>'; }).join('')+'</div>';
    for(var i=0;i<26;i++) h+='<span class="spr" style="left:'+(20+Math.random()*450)+'px;top:'+(70+Math.random()*80)+'px;background:'+COLS[i%COLS.length]+';transform:rotate('+(Math.random()*180)+'deg)"></span>';
    h+='</div><div class="tier t2"><div class="drip" style="background:#fff">'+[20,90,170,250].map(function(x){ return '<i style="left:'+x+'px;height:'+(24+(x%4)*8)+'px"></i>'; }).join('')+'</div>';
    for(var j=0;j<16;j++) h+='<span class="spr" style="left:'+(16+Math.random()*320)+'px;top:'+(56+Math.random()*60)+'px;background:'+COLS[(j+3)%COLS.length]+';transform:rotate('+(Math.random()*180)+'deg)"></span>';
    h+='</div>'; [150,205,260,315,370].forEach(function(x){ h+='<div class="cd" style="left:'+(x-11)+'px"><i class="fl"></i></div>'; }); ck.innerHTML=h;
    letters($('s2t'), 'Happy Birthday!');
    var star=(C.photos&&C.photos[0]&&(C.photos[0].src||C.photos[0]))||C.hero||C.headshot;
    $('s3img').src=star; $('s7img').src=C.hero||star;
    $('s3n').textContent=C.name; $('s3r').textContent=C.role||''; $('s3d').textContent=C.department||'';
    $('s4k').textContent=first+' through the years';
    var list=(C.photos&&C.photos.length)?C.photos:[{ src:C.hero },{ src:C.headshot }];
    var spots=[[-470,-40,-8],[ -20,-70,5],[430,-30,-6],[-250,90,7],[250,110,-4],[0,40,2]];
    list.forEach(function(p,i){ var src=typeof p==='string'?p:p.src, cap=typeof p==='string'?'':(p.cap||''); var el=document.createElement('div'); el.className='ph';
      el.innerHTML='<span class="tape"></span><div class="im"><img alt=""></div>'+(cap?'<div class="cap hand"></div>':'');
      var img=el.querySelector('img'); img.src=src; if(cap) el.querySelector('.cap').textContent=cap;
      var sz=function(){ var land=img.naturalWidth>img.naturalHeight*1.15, port=img.naturalHeight>img.naturalWidth*1.15, w=land?460:(port?320:380), hh=land?320:(port?420:380); el.querySelector('.im').style.cssText='width:'+w+'px;height:'+hh+'px'; };
      el.querySelector('.im').style.cssText='width:380px;height:380px'; img.onload=sz; if(img.complete && img.naturalWidth) sz();
      el._spot=spots[i%spots.length]; $('s4').appendChild(el); PH.push(el); });
    var st=C.start_date, days=Math.round((new Date(C.date+'T00:00:00')-new Date(st+'T00:00:00'))/864e5), years=Math.floor(days/365.25);
    C._days=days; C._years=years; $('s5d').textContent=fmtDate(st);
    $('s6t').textContent='Happy birthday, '+first+'!';
    var names=(C.team||[]).filter(function(n){ return n && n.toLowerCase()!==first.toLowerCase(); }), box=$('s6names');
    names.forEach(function(n,i){ var d=document.createElement('div'); d.className='nm fun'; d.textContent=n; d.style.background=PASTEL[i%PASTEL.length];
      var cols=5, row=Math.floor(i/cols), col=i%cols; d.style.left=(20+col*270+(row%2)*120+((i*37)%30))+'px'; d.style.top=(row*96+((i*53)%18))+'px'; d._i=i; box.appendChild(d); });
    letters($('s7t'), 'Happy birthday, '+first+'!'); $('s7s').textContent=C.message||'Here’s to your best year yet!';
    $('endP').textContent='Happy birthday, '+first+'!';
  }

  var fired={};
  function frame(t, dt){
    var bt=beat(t), drops=(C.drops||[4.8,14.4,33.6,52.8]);
    drawBalloons(t, t>51?1.6:0);
    /* 1 — cake, 0 to 4.8 */
    $('s1').style.opacity=win(t,0,5.0,0.6,0.25);
    $('s1pill').style.transform='translateX(-50%) scale('+(1+0.05*bt)+')';
    $('cake').style.transform='translateY('+((1-back((t-0.2)/1.2))*120)+'px)';
    document.querySelectorAll('.fl').forEach(function(f,i){ var on=clamp((t-0.6-i*0.4)/0.25,0,1); f.style.opacity=on; f.style.transform='scale('+(0.5+0.5*on)+') rotate('+(Math.sin(t*10+i)*4)+'deg) scaleY('+(1+Math.sin(t*14+i*2)*0.08)+')'; });
    /* 2 — title, 4.8 to 10.2 */
    $('s2').style.opacity=win(t,4.75,10.3,0.05,0.5);
    $('s2t').querySelectorAll('span').forEach(function(s,i){ var k=back((t-4.8-i*0.05)/0.45); s.style.opacity=clamp((t-4.8-i*0.05)/0.1,0,1); s.style.transform='translateY('+((1-k)*80-bt*10*(i%2?1:-1))+'px) scale('+(0.6+0.4*k)+') rotate('+(Math.sin(t*3+i)*3)+'deg)'; });
    $('s2sub').style.opacity=eo((t-6.0)/0.6); $('s2sub').style.transform='scale('+(1+0.03*bt)+')';
    /* 3 — the star, 10.2 to 17.2 */
    $('s3').style.opacity=win(t,10.2,17.3,0.4,0.5);
    var k3=back((t-10.2)/0.9); $('s3card').style.transform='translateY('+((1-k3)*90)+'px) rotate('+(-3+Math.sin(t*1.5)*1)+'deg)'; $('s3img').style.transform='scale('+(1.1-0.08*clamp((t-10.2)/7,0,1))+')';
    $('s3badge').style.transform='rotate(8deg) scale('+(back((t-11.0)/0.6)*(1+0.06*bt))+')';
    ['s3k','s3n','s3r','s3d'].forEach(function(id,i){ var k=back((t-10.8-i*0.3)/0.7); $(id).style.opacity=clamp((t-10.8-i*0.3)/0.2,0,1); $(id).style.transform='translateX('+((1-k)*60)+'px)'; });
    /* 4 — polaroid pile, 17.2 to 35 */
    $('s4').style.opacity=win(t,17.2,35.2,0.4,0.6);
    $('s4k').style.transform='scale('+(1+0.03*bt)+')';
    var n=PH.length||1, seg=Math.min(3.4, 15/n);
    PH.forEach(function(el,i){ var s=17.6+i*seg, k=back((t-s)/0.7), sp=el._spot, last=(i===n-1 || t<17.6+(i+1)*seg);
      el.style.opacity=clamp((t-s)/0.15,0,1); el.style.zIndex=10+i;
      el.style.transform='translate(-50%,-50%) translate('+sp[0]+'px,'+(sp[1]+(1-k)*-500)+'px) rotate('+(sp[2]+(1-k)*-20)+'deg) scale('+((last?1.08:0.92)+(last?0.03*bt:0))+')';
      var im=el.querySelector('img'); if(im) im.style.transform='scale('+(1.02+0.06*clamp((t-s)/seg,0,1))+')'; });
    /* 5 — tenure, 35 to 44 */
    $('s5').style.opacity=win(t,35,44.2,0.4,0.5);
    $('s5k').style.opacity=eo((t-35.2)/0.5); $('s5d').style.opacity=eo((t-35.6)/0.6);
    var ky=back((t-36.4)/0.8), yrs=C._years; $('s5y').style.opacity=clamp((t-36.4)/0.15,0,1); $('s5y').style.transform='scale('+(ky*(1+0.04*bt))+')';
    $('s5yn').textContent=yrs+(yrs===1?' year':' years');
    var kd=clamp((t-37.6)/2.6,0,1); $('s5days').style.opacity=eo((t-37.4)/0.5); $('s5days').textContent=Math.round(C._days*eo(kd)).toLocaleString('en-US')+' days';
    $('s5line').style.opacity=eo((t-39.8)/0.8);
    /* 6 — team, 44 to 51.2 */
    $('s6').style.opacity=win(t,44,51.3,0.4,0.5);
    $('s6k').style.opacity=eo((t-44.1)/0.5); $('s6t').style.opacity=eo((t-44.4)/0.6); $('s6t').style.transform='scale('+(1+0.03*bt)+')';
    $('s6names').querySelectorAll('.nm').forEach(function(d){ var k=back((t-45.0-d._i*0.13)/0.5); d.style.opacity=clamp((t-45.0-d._i*0.13)/0.1,0,1); d.style.transform='translateY('+((1-k)*40+Math.sin(t*2+d._i)*5)+'px) scale('+(k*(1+0.04*bt*((d._i%3)===0)))+') rotate('+((d._i%2?2:-2))+'deg)'; });
    /* 7 — finale, 51.2 to end */
    $('s7').style.opacity=win(t,51.2,T+5,0.4,0);
    $('s7ph').style.transform='scale('+(back((t-51.3)/0.7)*(1+0.05*bt))+')';
    $('s7t').querySelectorAll('span').forEach(function(s,i){ var k=back((t-51.6-i*0.035)/0.45); s.style.opacity=clamp((t-51.6-i*0.035)/0.1,0,1); s.style.transform='translateY('+((1-k)*70-bt*8*(i%2?1:-1))+'px) scale('+(0.6+0.4*k)+')'; });
    $('s7s').style.opacity=eo((t-53.0)/0.6); $('s7m').style.opacity=eo((t-53.6)/0.6);
    /* confetti on the drops */
    drops.forEach(function(d,i){ if(t>=d && t<d+0.6 && !fired['d'+i]){ fired['d'+i]=1; burst(150,800,560); burst(70,300,700); burst(70,1300,700); } });
    if(t>=37.0 && t<37.6 && !fired.y){ fired.y=1; burst(90,800,420); }
    drawConf(dt, t>4.8);
    $('prog').firstChild.style.width=(clamp(t/T,0,1)*100)+'%';
  }

  function now(){ return useAudio && au.src && !isNaN(au.currentTime) && au.readyState>=2 ? au.currentTime : (playing ? base+(performance.now()-t0)/1000 : base); }
  function loop(){
    if(!playing) return;
    var t=now(), dt=clamp(t-lastNow,0,0.1); lastNow=t; frame(t, dt);
    if(t>=T){ finish(); return; }
    if(t>=T-2 && useAudio && !au.paused){ au.volume=clamp((T-t)/2,0,1); }
    requestAnimationFrame(loop);
  }
  function start(from){
    from=from||0; ended=false; document.body.classList.remove('ended','paused'); $('endc').classList.remove('on'); $('gate').classList.remove('on');
    if(from===0){ fired={}; P.length=0; }
    base=from; t0=performance.now(); lastNow=from; playing=true; $('pp').textContent='Pause';
    if(useAudio && au.src){ au.volume=1; try{ au.currentTime=from; }catch(e){} var pr=au.play(); if(pr&&pr.catch) pr.catch(function(){ playing=false; $('gate').classList.add('on'); }); }
    requestAnimationFrame(loop);
  }
  function pause(){ if(!playing) return; base=now(); playing=false; try{ au.pause(); }catch(e){} document.body.classList.add('paused'); $('pp').textContent='Play'; }
  function resume(){ if(playing||ended) return; start(base); }
  function finish(){ playing=false; ended=true; try{ au.pause(); }catch(e){} document.body.classList.add('ended'); frame(T,0.016); setTimeout(function(){ $('endc').classList.add('on'); }, 700); post({ type:'bday-film-done' }); }
  $('pp').onclick=function(){ playing?pause():resume(); };
  $('mu').onclick=function(){ au.muted=!au.muted; $('mu').textContent=au.muted?'Unmute':'Mute'; };
  $('prog').onclick=function(e){ var r=this.getBoundingClientRect(), x=clamp((e.clientX-r.left)/r.width,0,1)*T; fired={}; (C.drops||[4.8,14.4,33.6,52.8]).forEach(function(d,i){ if(x>d) fired['d'+i]=1; }); if(x>37) fired.y=1; P.length=0; if(playing){ start(x); } else { base=x; frame(x,0); } };
  $('go').onclick=function(){ start(base||0); };
  $('again').onclick=function(){ start(0); };
  function close(){ pause(); post({ type:'bday-film-close' }); }
  $('closeTop').onclick=close; $('endClose').onclick=function(){ post({ type:'bday-film-close' }); if(!EMBED) $('endc').classList.remove('on'); };
  document.addEventListener('keydown', function(e){ if(e.key===' '){ e.preventDefault(); playing?pause():resume(); } if(e.key==='Escape') close(); });

  fetch(ID+'/config.json?_='+Date.now(), { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(cfg){
    C=cfg; build(); frame(0,0);
    if(C.music){ au.src=C.music+(C.music.indexOf('?')<0?'?v='+(C.v||'1'):''); au.onerror=function(){ useAudio=false; }; } else useAudio=false;
    var at=parseFloat(Q.get('at'));
    if(!isNaN(at)){ base=at; document.body.classList.add('paused'); var q=function(){ fired={}; P.length=0; (C.drops||[4.8,14.4,33.6,52.8]).forEach(function(d,i){ if(at>d+0.6) fired['d'+i]=1; }); frame(at,0); }; setTimeout(q,500); setTimeout(q,1500); return; }
    if(Q.get('autoplay')==='0'){ $('gate').classList.add('on'); } else start(0);
  }).catch(function(){ document.body.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#2b1a4a;font:700 16px Inter,sans-serif">This birthday video could not be loaded.</div>'; });
})();
</script>
