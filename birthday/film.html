<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday · JMB Virtuals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══ BIRTHDAY FILM (Oct 18 2026) ══
   One page for every birthday: /birthday/film.html?id=<folder> reads <folder>/config.json (name, dates, photos, music).
   The music is the clock — every frame is drawn from the current time, so pause, replay and a late start all stay in
   sync. Embedded in the portal (?embed=1) it tells the parent when it ends or is closed. */
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; background:#120a1a; overflow:hidden; font-family:'Inter',-apple-system,'Segoe UI',sans-serif; color:#fff; }
#wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
#stage{ position:relative; width:1600px; height:900px; transform-origin:center center; overflow:hidden; border-radius:0;
  background:radial-gradient(1200px 700px at 50% 120%, #4a1d3f 0%, #241032 45%, #120a1a 100%); }
.serif{ font-family:'Playfair Display',Georgia,'Times New Roman',serif; }
.abs{ position:absolute; }
.center{ left:0; right:0; text-align:center; }
/* ambient bokeh */
.bk{ position:absolute; border-radius:50%; filter:blur(2px); opacity:.0; animation:bk 14s ease-in-out infinite; }
@keyframes bk{ 0%{ transform:translateY(40px) scale(.9); opacity:0; } 20%{ opacity:var(--o); } 80%{ opacity:var(--o); } 100%{ transform:translateY(-120px) scale(1.1); opacity:0; } }
body.paused .bk{ animation-play-state:paused; }
/* scene 1 — date + candles */
#s1date{ top:250px; font-size:22px; letter-spacing:.5em; text-transform:uppercase; color:#f7c873; font-weight:600; }
#s1line{ top:300px; font-size:46px; font-style:italic; color:#fde7c8; }
#candles{ left:50%; top:430px; width:520px; margin-left:-260px; height:260px; display:flex; justify-content:space-between; align-items:flex-end; }
.cd{ position:relative; width:34px; border-radius:6px 6px 3px 3px; background:linear-gradient(90deg,#f9d8e6,#fff 45%,#f3c4d8); }
.cd:nth-child(2n){ background:linear-gradient(90deg,#fce3c4,#fff 45%,#f6cfa0); }
.fl{ position:absolute; left:50%; width:18px; height:34px; margin-left:-9px; top:-40px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%, #fff7d6 0%, #ffd56b 35%, #ff8a3d 70%, rgba(255,107,26,0) 100%); box-shadow:0 0 40px 14px rgba(255,170,80,.45); transform-origin:50% 100%; }
/* scene 2 — title */
#s2t{ top:300px; font-size:180px; font-weight:700; letter-spacing:-.01em; line-height:1; }
#s2t span{ display:inline-block; background:linear-gradient(180deg,#fff6e6 0%,#f7c873 55%,#ff8a3d 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
#s2sub{ top:520px; font-size:26px; letter-spacing:.42em; text-transform:uppercase; color:#f3c9e0; font-weight:600; }
/* scene 3 — portrait */
#s3pic{ left:180px; top:110px; width:560px; height:680px; border-radius:280px 280px 24px 24px; overflow:hidden; box-shadow:0 40px 120px rgba(0,0,0,.5), 0 0 0 10px rgba(247,200,115,.18); background:#2b1636; }
#s3pic img{ width:100%; height:100%; object-fit:cover; object-position:50% 20%; }
#s3k{ left:830px; top:300px; font-size:20px; letter-spacing:.42em; text-transform:uppercase; color:#f7c873; font-weight:600; }
#s3n{ left:826px; top:345px; font-size:96px; line-height:1.02; font-weight:700; width:700px; }
#s3r{ left:830px; top:600px; font-size:24px; color:#f3d9ea; font-weight:500; }
#s3d{ left:830px; top:640px; font-size:20px; color:rgba(255,255,255,.6); }
/* scene 4 — photos */
.ph{ position:absolute; left:50%; top:50%; background:#fff; padding:18px 18px 64px; border-radius:6px; box-shadow:0 40px 90px rgba(0,0,0,.55); }
.ph .im{ overflow:hidden; background:#ddd; }
.ph img{ width:100%; height:100%; object-fit:cover; display:block; }
.ph .cap{ position:absolute; left:0; right:0; bottom:18px; text-align:center; font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:26px; color:#3b2340; }
/* scene 5 — tenure */
#s5k{ top:200px; font-size:22px; letter-spacing:.42em; text-transform:uppercase; color:#f7c873; font-weight:600; }
#s5d{ top:245px; font-size:52px; font-style:italic; color:#fde7c8; }
#s5y{ top:330px; font-size:230px; font-weight:700; line-height:1; }
#s5y span{ background:linear-gradient(180deg,#fff 0%,#f7c873 60%,#ff8a3d 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
#s5days{ top:590px; font-size:30px; color:#f3d9ea; font-weight:600; letter-spacing:.02em; }
#s5line{ top:650px; font-size:24px; color:rgba(255,255,255,.7); }
/* scene 6 — team */
#s6k{ top:150px; font-size:22px; letter-spacing:.42em; text-transform:uppercase; color:#f7c873; font-weight:600; }
#s6t{ top:195px; font-size:76px; font-weight:700; }
#s6names{ left:160px; right:160px; top:340px; height:420px; }
.nm{ position:absolute; white-space:nowrap; font-weight:600; color:#fff; padding:10px 22px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); font-size:26px; }
/* scene 7 — finale */
#s7t{ top:270px; font-size:120px; font-weight:700; line-height:1.05; }
#s7t span{ background:linear-gradient(180deg,#fff6e6 0%,#f7c873 55%,#ff8a3d 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
#s7s{ top:520px; font-size:34px; font-style:italic; color:#fde7c8; }
#s7m{ left:50%; top:640px; margin-left:-150px; width:300px; display:flex; align-items:center; justify-content:center; gap:14px; font-size:20px; font-weight:600; letter-spacing:.06em; color:rgba(255,255,255,.85); }
#s7m img{ width:44px; height:44px; }
#cf{ position:absolute; inset:0; pointer-events:none; }
.sc{ opacity:0; }
/* controls */
#bar{ position:fixed; left:0; right:0; bottom:0; padding:14px 18px 16px; display:flex; align-items:center; gap:12px; background:linear-gradient(0deg,rgba(0,0,0,.55),rgba(0,0,0,0)); opacity:0; transition:opacity .25s; }
body:hover #bar, body.paused #bar, body.ended #bar{ opacity:1; }
.btn{ border:1px solid rgba(255,255,255,.28); background:rgba(0,0,0,.35); color:#fff; border-radius:999px; padding:9px 16px; font:600 13px/1 'Inter',sans-serif; cursor:pointer; backdrop-filter:blur(6px); }
.btn:hover{ background:rgba(255,255,255,.12); }
#prog{ flex:1; height:4px; border-radius:999px; background:rgba(255,255,255,.18); overflow:hidden; cursor:pointer; }
#prog i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#f7c873,#ff8a3d); }
#closeTop{ position:fixed; top:14px; right:16px; display:none; }
body.embed #closeTop{ display:block; }
#gate, #endc{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; background:rgba(18,10,26,.72); backdrop-filter:blur(4px); }
#gate.on, #endc.on{ display:flex; }
#gate .big, #endc .big{ border:none; background:linear-gradient(135deg,#f7c873,#ff8a3d); color:#2a1230; font:700 18px/1 'Inter',sans-serif; padding:18px 30px; border-radius:999px; cursor:pointer; box-shadow:0 20px 50px rgba(255,138,61,.35); }
#gate p, #endc p{ font-size:15px; color:rgba(255,255,255,.75); }
#endc .row{ display:flex; gap:12px; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="bokeh"></div>
  <!-- scene 1 -->
  <div id="s1" class="sc abs" style="inset:0">
    <div id="s1date" class="abs center"></div>
    <div id="s1line" class="abs center serif">Tonight, we celebrate someone special</div>
    <div id="candles" class="abs"></div>
  </div>
  <!-- scene 2 -->
  <div id="s2" class="sc abs" style="inset:0">
    <div id="s2t" class="abs center serif"></div>
    <div id="s2sub" class="abs center">from your JMB Virtuals family</div>
  </div>
  <!-- scene 3 -->
  <div id="s3" class="sc abs" style="inset:0">
    <div id="s3pic" class="abs"><img id="s3img" alt=""></div>
    <div id="s3k" class="abs">The birthday star</div>
    <div id="s3n" class="abs serif"></div>
    <div id="s3r" class="abs"></div>
    <div id="s3d" class="abs"></div>
  </div>
  <!-- scene 4 -->
  <div id="s4" class="sc abs" style="inset:0"></div>
  <!-- scene 5 -->
  <div id="s5" class="sc abs" style="inset:0">
    <div id="s5k" class="abs center">With JMB Virtuals since</div>
    <div id="s5d" class="abs center serif"></div>
    <div id="s5y" class="abs center serif"><span id="s5yn"></span></div>
    <div id="s5days" class="abs center"></div>
    <div id="s5line" class="abs center">of showing up, getting it done, and making the team better</div>
  </div>
  <!-- scene 6 -->
  <div id="s6" class="sc abs" style="inset:0">
    <div id="s6k" class="abs center">From all of us</div>
    <div id="s6t" class="abs center serif"></div>
    <div id="s6names" class="abs"></div>
  </div>
  <!-- scene 7 -->
  <div id="s7" class="sc abs" style="inset:0">
    <div id="s7t" class="abs center serif"><span id="s7tn"></span></div>
    <div id="s7s" class="abs center serif"></div>
    <div id="s7m" class="abs"><img src="/jmb-logo-mark.svg" alt="">JMB VIRTUALS</div>
  </div>
  <canvas id="cf" width="1600" height="900"></canvas>
</div></div>

<button id="closeTop" class="btn" type="button">Close</button>
<div id="bar">
  <button id="pp" class="btn" type="button">Pause</button>
  <button id="mu" class="btn" type="button">Mute</button>
  <div id="prog"><i></i></div>
</div>
<div id="gate"><button class="big" type="button" id="go">Play the birthday video</button><p id="gateP">Sound on</p></div>
<div id="endc"><div class="row"><button class="big" type="button" id="again">Watch again</button><button class="btn" type="button" id="endClose">Close</button></div><p id="endP"></p></div>
<audio id="au" preload="auto"></audio>

<script>
(function(){
  var Q=new URLSearchParams(location.search), ID=(Q.get('id')||'').replace(/[^a-z0-9\-_]/gi,''), EMBED=Q.get('embed')==='1';
  if(EMBED) document.body.classList.add('embed');
  var T=56, C=null, au=document.getElementById('au'), stage=document.getElementById('stage');
  var t0=0, playing=false, ended=false, useAudio=true, base=0, lastNow=0;
  function $(id){ return document.getElementById(id); }
  function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
  function ease(x){ x=clamp(x,0,1); return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
  function eo(x){ x=clamp(x,0,1); return 1-Math.pow(1-x,3); }
  function win(t,a,b,fi,fo){ if(t<a||t>b) return 0; return Math.min(fi?clamp((t-a)/fi,0,1):1, fo?clamp((b-t)/fo,0,1):1); }
  function fit(){ var s=Math.min(innerWidth/1600, innerHeight/900); stage.style.transform='scale('+s+')'; }
  addEventListener('resize', fit); fit();
  function post(m){ if(EMBED){ try{ parent.postMessage(Object.assign({ id:ID }, m), location.origin); }catch(e){} } }

  /* bokeh */
  (function(){ var b=$('bokeh'), cols=['247,200,115','255,138,61','244,114,182','255,255,255']; for(var i=0;i<26;i++){ var d=document.createElement('i'); d.className='bk'; var s=20+Math.random()*90;
    d.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(Math.random()*1600)+'px;top:'+(200+Math.random()*700)+'px;background:radial-gradient(circle,rgba('+cols[i%4]+',.55),rgba('+cols[i%4]+',0) 70%);--o:'+(0.35+Math.random()*0.5)+';animation-delay:-'+(Math.random()*14)+'s;animation-duration:'+(10+Math.random()*10)+'s'; b.appendChild(d); } })();

  /* confetti */
  var cv=$('cf'), cx=cv.getContext('2d'), P=[], bursts=[];
  function burst(n, x, y){ var cols=['#f7c873','#ff8a3d','#f472b6','#ffffff','#a78bfa','#34d399'];
    for(var i=0;i<n;i++){ var a=-Math.PI/2+(Math.random()-.5)*2.2, v=8+Math.random()*12; P.push({ x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, r:5+Math.random()*7, c:cols[i%cols.length], rot:Math.random()*6, vr:(Math.random()-.5)*.3, life:1 }); } }
  function drawConf(dt){ cx.clearRect(0,0,1600,900); for(var i=P.length-1;i>=0;i--){ var p=P[i]; var f=dt*60; p.vy+=0.32*f; p.vx*=Math.pow(0.99,f); p.x+=p.vx*f*0.6; p.y+=p.vy*f*0.6; p.rot+=p.vr; p.life-=dt*0.18;
      if(p.y>960||p.life<=0){ P.splice(i,1); continue; } cx.save(); cx.globalAlpha=clamp(p.life*1.4,0,1); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.c; cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); cx.restore(); } }

  function fmtDate(d){ return new Date(d+'T00:00:00').toLocaleDateString('en-US',{ month:'long', day:'numeric', year:'numeric' }); }
  function build(){
    var first=C.first||String(C.name||'').split(' ')[0];
    $('s1date').textContent=new Date(C.date+'T00:00:00').toLocaleDateString('en-US',{ month:'long', day:'numeric' });
    var cd=$('candles'), hs=[150,190,230,190,150]; hs.forEach(function(h){ var d=document.createElement('div'); d.className='cd'; d.style.height=h+'px'; d.innerHTML='<i class="fl"></i>'; cd.appendChild(d); });
    $('s2t').innerHTML='Happy Birthday'.split('').map(function(ch){ return ch===' '?'<span>&nbsp;</span>':'<span>'+ch+'</span>'; }).join('');
    $('s3img').src=C.hero||C.headshot; $('s3n').textContent=C.name; $('s3r').textContent=C.role||''; $('s3d').textContent=C.department||'';
    /* photos — the ones given, else her portal pictures */
    var ph=(C.photos&&C.photos.length)?C.photos:[{ src:C.hero, cap:'' },{ src:C.headshot, cap:'' }].filter(function(x){ return x.src; });
    var s4=$('s4'); ph.forEach(function(p,i){ var src=typeof p==='string'?p:p.src, cap=typeof p==='string'?'':(p.cap||''); var img=new Image(); img.src=src;
      var el=document.createElement('div'); el.className='ph'; el.innerHTML='<div class="im"></div>'+(cap?'<div class="cap"></div>':''); el.querySelector('.im').appendChild(img); if(cap) el.querySelector('.cap').textContent=cap;
      img.onload=function(){ var land=img.naturalWidth>=img.naturalHeight*1.1, w=land?820:520, h=land?560:640; el.style.width=(w+36)+'px'; el.querySelector('.im').style.cssText='width:'+w+'px;height:'+h+'px'; el._w=w+36; el._h=h+82; };
      el._w=556; el._h=722; el.style.width='556px'; el.querySelector('.im').style.cssText='width:520px;height:640px'; s4.appendChild(el); });
    var st=C.start_date, days=Math.round((new Date(C.date+'T00:00:00')-new Date(st+'T00:00:00'))/864e5), years=Math.floor(days/365.25);
    C._days=days; C._years=years;
    $('s5d').textContent=fmtDate(st);
    $('s6t').textContent='Happy birthday, '+first+'!';
    var names=(C.team||[]).filter(function(n){ return n && n.toLowerCase()!==first.toLowerCase(); }), box=$('s6names');
    names.forEach(function(n,i){ var d=document.createElement('div'); d.className='nm'; d.textContent=n; var cols=4, row=Math.floor(i/cols), col=i%cols, jitter=(row%2)*110;
      d.style.left=(40+col*300+jitter+Math.random()*30)+'px'; d.style.top=(row*88+Math.random()*16)+'px'; d._i=i; box.appendChild(d); });
    $('s7tn').textContent='Happy birthday, '+first+'!'; $('s7s').textContent=C.message||'Here’s to your best year yet.';
    $('endP').textContent='Happy birthday, '+first+'!';
  }

  var fired={};
  function frame(t, dt){
    /* scene 1 — 0 to 4.5 */
    var a1=win(t,0,4.6,1.0,0.6); $('s1').style.opacity=a1;
    document.querySelectorAll('.fl').forEach(function(f,i){ var on=clamp((t-0.8-i*0.35)/0.4,0,1); f.style.opacity=on; f.style.transform='scale('+(0.6+0.4*on)+') rotate('+(Math.sin(t*9+i)*3)+'deg) scaleY('+(1+Math.sin(t*13+i*2)*0.06)+')'; });
    /* scene 2 — 4.5 to 10 */
    var a2=win(t,4.4,10.2,0.4,0.6); $('s2').style.opacity=a2;
    $('s2t').querySelectorAll('span').forEach(function(s,i){ var k=eo((t-4.6-i*0.07)/0.7); s.style.opacity=k; s.style.transform='translateY('+((1-k)*60)+'px)'; });
    $('s2sub').style.opacity=eo((t-6.2)/0.8);
    if(t>=5.1 && !fired.b1){ fired.b1=1; burst(160,800,520); burst(80,400,600); burst(80,1200,600); }
    /* scene 3 — 10 to 17 */
    var a3=win(t,10,17.2,0.6,0.6); $('s3').style.opacity=a3;
    var k3=eo((t-10.1)/1.2); $('s3pic').style.transform='translateY('+((1-k3)*80)+'px)'; $('s3img').style.transform='scale('+(1.12-0.08*clamp((t-10)/7,0,1))+')';
    ['s3k','s3n','s3r','s3d'].forEach(function(id,i){ var k=eo((t-10.8-i*0.35)/0.8); $(id).style.opacity=k; $(id).style.transform='translateX('+((1-k)*40)+'px)'; });
    /* scene 4 — photos, 17 to 35 */
    var a4=win(t,17,35.2,0.5,0.6); $('s4').style.opacity=a4;
    var phs=$('s4').querySelectorAll('.ph'), n=phs.length||1, seg=18/n;
    phs.forEach(function(el,i){ var s=17+i*seg, e=s+seg, lt=(t-s)/seg, vis=win(t,s-0.2,e+0.5,0.6,0.7);
      var rot=(i%2?3:-3)+(i%3-1)*1.5, dx=(i%2?60:-60)*(1-eo(clamp(lt*2,0,1)));
      el.style.opacity=vis; el.style.transform='translate(-50%,-50%) translate('+dx+'px,'+((1-eo(clamp(lt*2,0,1)))*30)+'px) rotate('+rot+'deg)';
      var im=el.querySelector('img'); if(im) im.style.transform='scale('+(1.04+0.1*clamp(lt,0,1))+') translateX('+((i%2?-1:1)*12*clamp(lt,0,1))+'px)'; });
    /* scene 5 — tenure, 35 to 44 */
    var a5=win(t,35,44.2,0.6,0.6); $('s5').style.opacity=a5;
    ['s5k','s5d'].forEach(function(id,i){ $(id).style.opacity=eo((t-35.3-i*0.4)/0.8); });
    var ky=eo((t-36.4)/1.0), yrs=C._years; $('s5y').style.opacity=ky; $('s5y').style.transform='scale('+(0.85+0.15*ky)+')';
    $('s5yn').textContent=yrs+(yrs===1?' year':' years');
    var kd=clamp((t-37.4)/2.4,0,1); $('s5days').style.opacity=eo((t-37.2)/0.6); $('s5days').textContent=Math.round(C._days*eo(kd)).toLocaleString('en-US')+' days';
    $('s5line').style.opacity=eo((t-39.6)/0.9);
    if(t>=37.0 && !fired.b2){ fired.b2=1; burst(70,800,430); }
    /* scene 6 — team, 44 to 51 */
    var a6=win(t,44,51.2,0.6,0.6); $('s6').style.opacity=a6;
    $('s6k').style.opacity=eo((t-44.2)/0.6); $('s6t').style.opacity=eo((t-44.6)/0.8);
    $('s6names').querySelectorAll('.nm').forEach(function(d){ var k=eo((t-45.2-d._i*0.12)/0.6); d.style.opacity=k; d.style.transform='translateY('+((1-k)*24+Math.sin(t*1.4+d._i)*4)+'px)'; });
    /* scene 7 — finale, 51 to 56 */
    var a7=win(t,51,T+5,0.6,0); $('s7').style.opacity=a7;
    var k7=eo((t-51.2)/1.0); $('s7t').style.transform='scale('+(0.9+0.1*k7)+')'; $('s7t').style.opacity=k7;
    $('s7s').style.opacity=eo((t-52.2)/0.8); $('s7m').style.opacity=eo((t-53)/0.8);
    if(t>=51.3 && !fired.b3){ fired.b3=1; burst(200,800,700); burst(90,300,800); burst(90,1300,800); }
    if(t>=54.2 && !fired.b4){ fired.b4=1; burst(120,800,600); }
    drawConf(dt);
    $('prog').firstChild.style.width=(clamp(t/T,0,1)*100)+'%';
  }

  function now(){ return useAudio && au.src && !isNaN(au.currentTime) && au.readyState>=2 ? au.currentTime : (playing ? base+(performance.now()-t0)/1000 : base); }
  function loop(){
    if(!playing) return;
    var t=now(), dt=clamp(t-lastNow,0,0.1); lastNow=t; frame(t, dt);
    if(t>=T){ finish(); return; }
    if(t>=T-3 && useAudio && !au.paused){ au.volume=clamp((T-t)/3,0,1); }
    requestAnimationFrame(loop);
  }
  function start(from){
    from=from||0; ended=false; document.body.classList.remove('ended','paused'); $('endc').classList.remove('on'); $('gate').classList.remove('on');
    if(from===0){ fired={}; P.length=0; }
    base=from; t0=performance.now(); lastNow=from; playing=true; $('pp').textContent='Pause';
    if(useAudio && au.src){ au.volume=1; try{ au.currentTime=from; }catch(e){} var pr=au.play(); if(pr&&pr.catch) pr.catch(function(){ playing=false; $('gate').classList.add('on'); }); }
    requestAnimationFrame(loop);
  }
  function pause(){ if(!playing) return; base=now(); playing=false; try{ au.pause(); }catch(e){} document.body.classList.add('paused'); $('pp').textContent='Play'; }
  function resume(){ if(playing||ended) return; start(base); }
  function finish(){ playing=false; ended=true; try{ au.pause(); }catch(e){} document.body.classList.add('ended'); frame(T, 0.016); setTimeout(function(){ $('endc').classList.add('on'); }, 600); post({ type:'bday-film-done' }); }
  $('pp').onclick=function(){ playing?pause():resume(); };
  $('mu').onclick=function(){ au.muted=!au.muted; $('mu').textContent=au.muted?'Unmute':'Mute'; };
  $('prog').onclick=function(e){ var r=this.getBoundingClientRect(), x=clamp((e.clientX-r.left)/r.width,0,1)*T; fired={}; ['b1','b2','b3','b4'].forEach(function(k,i){ if(x>[5.2,37.1,51.4,54.3][i]) fired[k]=1; }); P.length=0; if(playing){ start(x); } else { base=x; frame(x,0); } };
  $('go').onclick=function(){ start(base||0); };
  $('again').onclick=function(){ start(0); };
  function close(){ pause(); post({ type:'bday-film-close' }); if(!EMBED) start(0); }
  $('closeTop').onclick=close; $('endClose').onclick=function(){ post({ type:'bday-film-close' }); if(!EMBED) $('endc').classList.remove('on'); };
  document.addEventListener('keydown', function(e){ if(e.key===' '){ e.preventDefault(); playing?pause():resume(); } if(e.key==='Escape') close(); });

  fetch(ID+'/config.json?_='+Date.now(), { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(cfg){
    C=cfg; build(); frame(0,0);
    if(C.music){ au.src=C.music; au.onerror=function(){ useAudio=false; }; } else useAudio=false;
    var go=function(){ start(0); };
    var at=parseFloat(Q.get('at'));   // preview a still frame: ?at=30
    if(!isNaN(at)){ base=at; document.body.classList.add('paused'); var q=function(){ frame(at,0); }; setTimeout(q,400); setTimeout(q,1200); return; }
    if(Q.get('autoplay')==='0'){ $('gate').classList.add('on'); } else go();
  }).catch(function(){ document.body.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#fff;font:600 16px Inter,sans-serif">This birthday video could not be loaded.</div>'; });
})();
</script>
