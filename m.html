<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f1560f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/m.webmanifest">
<link rel="apple-touch-icon" href="/icons/chat-apple-180.png">
<title>JMB Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* ══════════════════════════════════════════════════════════════════════════════
   JMB CHAT — mobile PWA. Chat first (the reason this app exists), games and leave
   one tap away. Built to feel like a real messenger: conversation list, bubbles,
   reactions, replies, images — nothing portal-shaped about it.
   ══════════════════════════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
:root{
  --org:#f1560f; --org2:#ff7a29; --orgSoft:#fff1e9;
  --ink:#101418; --t2:#5a6472; --t3:#9aa4b2;
  --bg:#ffffff; --bg2:#f5f6f8; --line:#eceef1;
  --mine:#f1560f; --theirs:#f0f2f5;
  --green:#22b573; --red:#e5484d;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 'Manrope',system-ui,-apple-system,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
img{max-width:100%}
.hide{display:none!important}

/* ── screens ── */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}

/* ── login ── */
#scr-login{justify-content:center;padding:28px;background:
  radial-gradient(600px 380px at 50% -60px, var(--orgSoft), transparent 70%), var(--bg)}
#scr-login .logo{width:76px;height:76px;margin:0 auto 14px;display:block}
#scr-login h1{font-size:24px;font-weight:800;text-align:center;margin:0 0 2px}
#scr-login .sub{color:var(--t2);font-size:13px;text-align:center;margin-bottom:26px}
.fld{background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;width:100%;
  margin-bottom:11px;font-size:15px;outline:none;transition:.15s}
.fld:focus{border-color:var(--org);background:#fff}
.btn{width:100%;background:linear-gradient(135deg,var(--org2),var(--org));color:#fff;border:none;
  border-radius:14px;padding:15px;font-weight:800;font-size:15px;cursor:pointer;
  box-shadow:0 8px 20px -8px rgba(241,86,15,.55)}
.btn:disabled{opacity:.55}
.err{color:var(--red);font-size:12.5px;text-align:center;margin-top:10px;min-height:17px}

/* ── app bar ── */
.abar{padding:calc(10px + var(--sat)) 18px 10px;display:flex;align-items:center;gap:12px;
  background:var(--bg);border-bottom:1px solid var(--line);flex:none}
.abar h2{font-size:21px;font-weight:800;margin:0;flex:1}
.abar .mini{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--orgSoft)}

/* ── conversation list ── */
#convs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.conv{display:flex;align-items:center;gap:13px;padding:11px 16px;cursor:pointer;transition:background .12s}
.conv:active{background:var(--bg2)}
.avwrap{position:relative;flex:none}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#ffd9bd,#ffb98d);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#a24a12}
.dot{position:absolute;right:0;bottom:1px;width:13px;height:13px;border-radius:50%;
  background:var(--green);border:2.5px solid #fff}
.conv .cbody{flex:1;min-width:0}
.conv .cname{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.conv .cprev{color:var(--t2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.conv .cmeta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.conv .ctime{color:var(--t3);font-size:11.5px}
.badge{background:var(--org);color:#fff;font-size:11px;font-weight:800;min-width:19px;height:19px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.sechead{padding:14px 18px 4px;font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--t3);text-transform:uppercase}

/* ── chat thread ── */
#scr-chat .abar{gap:8px}
.backbtn{border:none;background:none;padding:6px;margin-left:-6px;cursor:pointer;display:flex}
.backbtn svg{width:24px;height:24px;stroke:var(--ink)}
#ch-title{font-size:16.5px;font-weight:800;line-height:1.2}
#ch-sub{font-size:11.5px;color:var(--t2)}
#msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px;background:var(--bg2)}
.daysep{display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--t3);font-size:11px;font-weight:700}
.daysep:before,.daysep:after{content:'';flex:1;height:1px;background:var(--line)}
.mrow{display:flex;margin-bottom:2px;align-items:flex-end;gap:8px}
.mrow.mine{justify-content:flex-end}
.mrow .mav{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;background:var(--orgSoft);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#a24a12}
.mrow.mine .mav{display:none}
.mgroup{max-width:78%;display:flex;flex-direction:column}
.mname{font-size:11px;color:var(--t3);font-weight:700;margin:8px 0 2px 12px}
.bub{padding:9px 13px;border-radius:18px;font-size:14.5px;line-height:1.4;word-wrap:break-word;
  white-space:pre-wrap;position:relative;width:fit-content;max-width:100%}
.mrow.mine .bub{background:var(--mine);color:#fff;border-bottom-right-radius:5px;margin-left:auto}
.mrow.theirs .bub{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.bub img.att{border-radius:12px;margin:2px -4px;display:block;max-height:280px;object-fit:cover}
.bub .replyq{border-left:3px solid rgba(255,255,255,.55);padding:2px 8px;margin-bottom:5px;
  font-size:12px;opacity:.85;border-radius:4px}
.mrow.theirs .replyq{border-left-color:var(--org);background:var(--orgSoft);opacity:1;color:#8a4a20}
.mtime{font-size:10px;color:var(--t3);margin:3px 12px 6px}
.mrow.mine + .mtime{text-align:right}
.pills{display:flex;gap:4px;margin:-4px 0 6px 10px}
.mrow.mine ~ .pills{justify-content:flex-end}
.pill{background:#fff;border:1px solid var(--line);border-radius:12px;font-size:11px;padding:2px 7px;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
/* reaction picker */
#rxbar{position:fixed;z-index:60;background:#fff;border-radius:26px;box-shadow:0 10px 34px rgba(0,0,0,.18);
  display:none;padding:7px 10px;gap:4px}
#rxbar button{border:none;background:none;font-size:24px;padding:4px 6px;cursor:pointer;transition:transform .12s}
#rxbar button:active{transform:scale(1.35)}

/* composer */
#composer{flex:none;background:var(--bg);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + var(--sab))}
#replybar{display:none;align-items:center;gap:8px;background:var(--orgSoft);border-radius:10px;
  padding:7px 12px;margin-bottom:7px;font-size:12.5px;color:#8a4a20}
#replybar b{color:var(--org)}
#replybar button{margin-left:auto;border:none;background:none;font-size:16px;color:#8a4a20;cursor:pointer}
#imgprev{display:none;position:relative;width:70px;margin-bottom:7px}
#imgprev img{width:70px;height:70px;object-fit:cover;border-radius:10px}
#imgprev button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;
  border:none;background:var(--ink);color:#fff;font-size:12px;cursor:pointer}
.crow{display:flex;align-items:flex-end;gap:8px}
.cbtn{flex:none;width:40px;height:40px;border-radius:50%;border:none;background:var(--bg2);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.cbtn svg{width:21px;height:21px;stroke:var(--org)}
#inp{flex:1;background:var(--bg2);border:none;border-radius:20px;padding:11px 15px;font-size:15px;
  outline:none;resize:none;max-height:110px;line-height:1.35}
#sendbtn{background:linear-gradient(135deg,var(--org2),var(--org))}
#sendbtn svg{stroke:#fff}

/* ── bottom nav ── */
#nav{flex:none;display:flex;background:var(--bg);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + var(--sab))}
#nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:6px 0;cursor:pointer;color:var(--t3);font-size:10.5px;font-weight:700;position:relative}
#nav button.on{color:var(--org)}
#nav svg{width:23px;height:23px;stroke:currentColor}
#nav .navbadge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--org);color:#fff;
  font-size:9.5px;font-weight:800;min-width:16px;height:16px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ── games ── */
#scr-games .wrap,#scr-leave .wrap{flex:1;overflow-y:auto;padding:16px 18px calc(16px + var(--sab))}
.gcard{border-radius:20px;padding:22px 20px;color:#fff;margin-bottom:14px;position:relative;
  overflow:hidden;cursor:pointer;box-shadow:0 10px 26px -12px rgba(0,0,0,.35);display:block;text-decoration:none}
.gcard h3{margin:0 0 4px;font-size:20px;font-weight:800}
.gcard p{margin:0;font-size:13px;opacity:.85}
.gcard .emj{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:52px;opacity:.9}
.g1{background:linear-gradient(135deg,#ff7a29,#e2560f)}
.g2{background:linear-gradient(135deg,#7c5cff,#4b32d4)}
.g3{background:linear-gradient(135deg,#12b886,#0a8a63)}

/* ── leave ── */
.lcard{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.lcard h4{margin:0 0 10px;font-size:13px;font-weight:800;color:var(--t2);text-transform:uppercase;letter-spacing:.6px}
.ltypes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.ltype{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:700;
  font-size:13.5px;cursor:pointer;text-align:center}
.ltype.on{border-color:var(--org);background:var(--orgSoft);color:var(--org)}
.lrow{display:flex;gap:8px;margin-bottom:11px}
.lrow .fld{margin:0}
.lreq{border-left:4px solid var(--t3);background:var(--bg2);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.lreq.approved{border-left-color:var(--green)}
.lreq.pending{border-left-color:#f0a020}
.lreq.rejected,.lreq.denied{border-left-color:var(--red)}
.lreq b{font-size:14px}
.lreq .lmeta{font-size:12px;color:var(--t2);margin-top:2px}
.lstat{float:right;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.lstat.approved{color:var(--green)}.lstat.pending{color:#f0a020}.lstat.rejected,.lstat.denied{color:var(--red)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* image viewer */
#viewer{position:fixed;inset:0;background:rgba(10,10,12,.95);z-index:70;display:none;
  align-items:center;justify-content:center}
#viewer img{max-width:96vw;max-height:90vh;border-radius:8px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--org);border-radius:50%;
  margin:40px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div class="screen" id="scr-login">
  <svg class="logo" viewBox="76 82 360 360" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gM" x1="0" y1="0.05" x2="0" y2="0.95"><stop offset="0%" stop-color="#FFE0BE"/><stop offset="46%" stop-color="#FF7A29"/><stop offset="100%" stop-color="#C3380A"/></linearGradient><linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF8E45"/><stop offset="55%" stop-color="#E64C10"/><stop offset="100%" stop-color="#A52E08"/></linearGradient></defs><rect x="241" y="110" width="30" height="304" rx="15" fill="url(#gM)"/><path d="M256 226 Q341 264 398 320 Q341 376 256 414 Q171 376 114 320 Q171 264 256 226 Z" fill="none" stroke="url(#gB)" stroke-width="50" stroke-linejoin="round" stroke-linecap="round"/><path d="M256 110 Q341 148 398 204 Q341 260 256 298 Q171 260 114 204 Q171 148 256 110 Z" fill="none" stroke="url(#gM)" stroke-width="50" stroke-linejoin="round" stroke-linecap="round"/></svg>
  <h1>JMB Chat</h1>
  <div class="sub">Messages · Games · Leave</div>
  <input class="fld" id="li-id" placeholder="Employee ID" autocapitalize="characters" autocomplete="username">
  <input class="fld" id="li-pin" type="password" placeholder="PIN" autocomplete="current-password">
  <button class="btn" id="li-btn" onclick="doLogin()">Sign in</button>
  <div class="err" id="li-err"></div>
</div>

<!-- ══ CHATS LIST ══ -->
<div class="screen hide" id="scr-list">
  <div class="abar">
    <h2>Chats</h2>
    <img class="mini" id="me-av" alt="">
  </div>
  <div id="convs"><div class="spin"></div></div>
  <div id="nav"></div>
</div>

<!-- ══ CHAT THREAD ══ -->
<div class="screen hide" id="scr-chat">
  <div class="abar">
    <button class="backbtn" onclick="showList()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="avwrap"><div class="av" id="ch-av" style="width:38px;height:38px;font-size:13px;"></div><span class="dot hide" id="ch-dot"></span></div>
    <div style="flex:1;min-width:0;"><div id="ch-title"></div><div id="ch-sub"></div></div>
  </div>
  <div id="msgs"></div>
  <div id="composer">
    <div id="replybar"><span>Replying to <b id="rb-name"></b>: <span id="rb-text"></span></span><button onclick="cancelReply()">✕</button></div>
    <div id="imgprev"><img id="ip-img"><button onclick="clearImg()">✕</button></div>
    <div class="crow">
      <button class="cbtn" onclick="document.getElementById('file').click()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
      <textarea id="inp" rows="1" placeholder="Message…"></textarea>
      <button class="cbtn" id="sendbtn" onclick="send()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" class="hide" onchange="pickImg(this)">
</div>

<!-- ══ GAMES ══ -->
<div class="screen hide" id="scr-games">
  <div class="abar"><h2>Games</h2></div>
  <div class="wrap">
    <a class="gcard g1" href="/bobo-shot.html" target="_blank" rel="noopener"><span class="emj">⚡</span><h3>Bobo Shot</h3><p>Live team quiz — fastest finger wins</p></a>
    <a class="gcard g2" href="https://internals.jmbvirtuals.com/quizbee-play.html" target="_blank" rel="noopener"><span class="emj">🧠</span><h3>Quiz Bee</h3><p>Trivia showdown across 40 categories</p></a>
    <a class="gcard g3" href="https://internals.jmbvirtuals.com/tetris3v3-play.html" target="_blank" rel="noopener"><span class="emj">🕹️</span><h3>Tetris 3v3</h3><p>Team battle — stack, clear, survive</p></a>
  </div>
  <div id="nav2"></div>
</div>

<!-- ══ LEAVE ══ -->
<div class="screen hide" id="scr-leave">
  <div class="abar"><h2>Leave</h2></div>
  <div class="wrap">
    <div class="lcard">
      <h4>Request time off</h4>
      <div class="ltypes" id="ltypes"></div>
      <div class="lrow">
        <input class="fld" type="date" id="lv-start" style="flex:1;">
        <input class="fld" type="date" id="lv-end" style="flex:1;">
      </div>
      <textarea class="fld" id="lv-reason" rows="2" placeholder="Reason (be honest — it helps approval)"></textarea>
      <button class="btn" id="lv-btn" onclick="submitLeave()">Submit request</button>
    </div>
    <div class="sechead" style="padding-left:2px;">My requests</div>
    <div id="lv-list"><div class="spin"></div></div>
  </div>
  <div id="nav3"></div>
</div>

<div id="rxbar"></div>
<div id="viewer" onclick="this.style.display='none'"><img id="vw-img"></div>
<div id="toast"></div>

<script>
var API='https://script.google.com/macros/s/AKfycbwK8rVJlkv5YLgNLe7cGIz73KJc0hedmZcutoiRviDEowiZPglzBnznswBaZ0TVIV8t/exec';
var SUPA_URL='https://rvyrnkjqxnijxydloujk.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2eXJua2pxeG5panh5ZGxvdWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NzAwODQsImV4cCI6MjA5NzE0NjA4NH0.SwkSkmbeWrhm5PZZDSZ1Z4hbjpQ0L2CRtuKQmpHshBE';

var ME=null, SB=null, EMPS={}, AVA={}, CHANNELS=[], PRESENCE={}, MSGS=[], CUR=null, CURNAME='';
var REPLY=null, IMGDATA='', LASTREAD={}, POLL=null;
try{ LASTREAD=JSON.parse(localStorage.getItem('jmbc_lastread')||'{}'); }catch(e){}

function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); setTimeout(function(){t.classList.remove('on');},2200); }
function initials(n){ return String(n||'?').split(/[\s,]+/).filter(Boolean).slice(0,2).map(function(x){return x[0];}).join('').toUpperCase(); }
function firstName(n){ var p=String(n||'').split(','); return (p[1]||p[0]||'').trim().split(' ')[0]; }

/* ── SESSION ── */
function saveSess(){ try{ localStorage.setItem('jmbc_sess',JSON.stringify({id:ME.employee_id,name:ME.full_name,photo:ME.photo||''})); }catch(e){} }
function loadSess(){ try{ return JSON.parse(localStorage.getItem('jmbc_sess')||'null'); }catch(e){ return null; } }

async function doLogin(){
  var id=($('li-id').value||'').trim(), pin=($('li-pin').value||'').trim();
  if(!id||!pin){ $('li-err').textContent='Enter your ID and PIN.'; return; }
  var b=$('li-btn'); b.disabled=true; b.textContent='Signing in…';
  try{
    /* plain id+pin fetch — same lightweight employee lookup the QA tools use; no clock-in gates */
    var d=await (await fetch(API+'?id='+encodeURIComponent(id)+'&pin='+encodeURIComponent(pin)+'&_='+Date.now())).json();
    b.disabled=false; b.textContent='Sign in';
    if(!d||d.error){ $('li-err').textContent=(d&&d.error==='WRONG_PIN')?'Incorrect PIN.':'Employee not found.'; return; }
    ME={employee_id:d.employee_id,full_name:d.full_name||d.employee_id,photo:d.photo||''};
    saveSess(); boot();
  }catch(e){ b.disabled=false; b.textContent='Sign in'; $('li-err').textContent='Network error — try again.'; }
}

/* ── BOOT ── */
function boot(){
  $('scr-login').classList.add('hide');
  showList();
  $('me-av').src=ME.photo||('data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34"><rect width="34" height="34" rx="17" fill="#ffe3cf"/><text x="17" y="22" font-size="13" font-weight="800" text-anchor="middle" fill="#a24a12">'+initials(ME.full_name)+'</text></svg>'));
  navRender();
  SB=window.supabase.createClient(SUPA_URL,SUPA_KEY);
  Promise.all([loadEmployees(),loadChannels(),refreshPresence()]).then(function(){ loadAllMessages(); });
  subscribeRealtime();
  presenceLoop();
  POLL=setInterval(function(){ loadAllMessages(); refreshPresence(); },20000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ loadAllMessages(); refreshPresence(); } });
}

async function loadEmployees(){
  try{
    var d=await (await fetch(API+'?action=get_all_employees&_='+Date.now())).json();
    ((d&&d.employees)||d||[]).forEach(function(e){ if(e&&e.employee_id) EMPS[String(e.employee_id).toUpperCase()]={id:e.employee_id,name:e.full_name||e.employee_id}; });
  }catch(e){}
  try{
    var a=await (await fetch(API+'?action=get_all_avatars&_='+Date.now())).json();
    var avs=(a&&a.avatars)||a||{};
    Object.keys(avs).forEach(function(k){ AVA[String(k).toUpperCase()]=avs[k]; });
  }catch(e){}
}
async function loadChannels(){
  try{
    var r=await SB.from('channels').select('*');
    CHANNELS=((r&&r.data)||[]).filter(function(c){
      var mem=c.members||[]; if(typeof mem==='string'){ try{ mem=JSON.parse(mem);}catch(e){ mem=[]; } }
      return mem.map(String).map(function(x){return x.toUpperCase();}).indexOf(String(ME.employee_id).toUpperCase())>=0;
    });
  }catch(e){ CHANNELS=[]; }
}
async function refreshPresence(){
  try{
    var r=await SB.from('presence').select('*');
    PRESENCE={};
    ((r&&r.data)||[]).forEach(function(p){
      var fresh=p.last_seen && (Date.now()-new Date(p.last_seen).getTime())<120000;
      PRESENCE[String(p.employee_id).toUpperCase()]={online:!!p.is_online&&fresh,name:p.employee_name,photo:p.photo||''};
    });
    if(CUR) paintChatHead();
    renderConvs();
  }catch(e){}
}
function presenceLoop(){
  var up=function(on){
    try{ SB.from('presence').upsert({employee_id:ME.employee_id,employee_name:ME.full_name,
      last_seen:new Date().toISOString(),is_online:on},{onConflict:'employee_id'}).then(function(){}); }catch(e){}
  };
  up(true); setInterval(function(){ up(true); },30000);
  window.addEventListener('beforeunload',function(){ up(false); });
}

/* ── MESSAGES ── */
async function loadAllMessages(){
  try{
    var r=await SB.from('messages').select('*').order('created_at',{ascending:false}).limit(300);
    if(r&&r.data){ MSGS=r.data.reverse(); renderConvs(); if(CUR) renderThread(); navRender(); }
  }catch(e){}
}
function subscribeRealtime(){
  try{
    SB.channel('m-messages')
      .on('postgres_changes',{event:'*',schema:'public',table:'messages'},function(){ loadAllMessages(); })
      .subscribe();
  }catch(e){}
}
function convKey(m){
  if(m.channel_id) return 'ch:'+m.channel_id;
  if(!m.receiver_id) return 'group';
  var me=String(ME.employee_id).toUpperCase();
  var s=String(m.sender_id).toUpperCase(), rv=String(m.receiver_id).toUpperCase();
  if(s!==me&&rv!==me) return null;               // someone else's DM
  return (s===me)?rv:s;
}
function msgsFor(key){
  return MSGS.filter(function(m){ return convKey(m)===key; });
}
function lastMsg(key){ var l=msgsFor(key); return l[l.length-1]; }
function unread(key){
  var lr=LASTREAD[key]||0, me=String(ME.employee_id).toUpperCase();
  return msgsFor(key).filter(function(m){ return String(m.sender_id).toUpperCase()!==me && new Date(m.created_at).getTime()>lr; }).length;
}
function totalUnread(){
  var t=0, seen={};
  MSGS.forEach(function(m){ var k=convKey(m); if(k&&!seen[k]){ seen[k]=1; t+=unread(k); } });
  return t;
}
function prevText(m){
  if(!m) return 'Say hi 👋';
  var who=(String(m.sender_id).toUpperCase()===String(ME.employee_id).toUpperCase())?'You: ':'';
  if(m.image) return who+'📷 Photo';
  return who+String(m.message||'').slice(0,60);
}
function tShort(iso){
  var d=new Date(iso), now=new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  if((now-d)<6*86400000) return d.toLocaleDateString([],{weekday:'short'});
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}

/* ── CONVERSATION LIST ── */
function avatarHtml(key,name,size){
  var up=String(key).toUpperCase();
  var photo=(PRESENCE[up]&&PRESENCE[up].photo)||AVA[up]||'';
  var on=PRESENCE[up]&&PRESENCE[up].online;
  return '<div class="avwrap">'+(photo
    ? '<img class="av" style="width:'+size+'px;height:'+size+'px;" src="'+esc(photo)+'">'
    : '<div class="av" style="width:'+size+'px;height:'+size+'px;font-size:'+(size*.33)+'px;">'+esc(initials(name))+'</div>')
    +(on?'<span class="dot"></span>':'')+'</div>';
}
function renderConvs(){
  if(!$('scr-list')||$('scr-list').classList.contains('hide')) { /* still update badge */ }
  var h='';
  // pinned: group chat
  var gm=lastMsg('group'), gu=unread('group');
  h+='<div class="conv" onclick="openChat(\'group\',\'Team Group Chat\')">'
    +'<div class="avwrap"><div class="av" style="background:linear-gradient(135deg,#ff9a4d,#e2560f);color:#fff;">👥</div></div>'
    +'<div class="cbody"><div class="cname">Team Group Chat</div><div class="cprev">'+esc(prevText(gm))+'</div></div>'
    +'<div class="cmeta">'+(gm?'<span class="ctime">'+tShort(gm.created_at)+'</span>':'')+(gu?'<span class="badge">'+gu+'</span>':'')+'</div></div>';
  // channels
  CHANNELS.forEach(function(c){
    var k='ch:'+c.id, m=lastMsg(k), u=unread(k);
    h+='<div class="conv" onclick="openChat(\''+esc(k)+'\',\''+esc(c.name)+'\')">'
      +'<div class="avwrap"><div class="av" style="background:linear-gradient(135deg,#8f7bff,#5b3fe0);color:#fff;">#</div></div>'
      +'<div class="cbody"><div class="cname">'+esc(c.name)+'</div><div class="cprev">'+esc(prevText(m))+'</div></div>'
      +'<div class="cmeta">'+(m?'<span class="ctime">'+tShort(m.created_at)+'</span>':'')+(u?'<span class="badge">'+u+'</span>':'')+'</div></div>';
  });
  // DMs — people with history first (by recency), then everyone else alphabetically
  var me=String(ME.employee_id).toUpperCase();
  var hist={}, order=[];
  for(var i=MSGS.length-1;i>=0;i--){
    var k=convKey(MSGS[i]);
    if(k&&k!=='group'&&k.indexOf('ch:')!==0&&!hist[k]){ hist[k]=1; order.push(k); }
  }
  h+='<div class="sechead">Direct messages</div>';
  var listed={};
  order.forEach(function(k){ listed[k]=1;
    var nm=(EMPS[k]&&EMPS[k].name)||(PRESENCE[k]&&PRESENCE[k].name)||k;
    var m=lastMsg(k), u=unread(k);
    h+='<div class="conv" onclick="openChat(\''+esc(k)+'\',\''+esc(nm).replace(/'/g,"\\'")+'\')">'+avatarHtml(k,nm,52)
      +'<div class="cbody"><div class="cname">'+esc(nm)+'</div><div class="cprev">'+esc(prevText(m))+'</div></div>'
      +'<div class="cmeta">'+(m?'<span class="ctime">'+tShort(m.created_at)+'</span>':'')+(u?'<span class="badge">'+u+'</span>':'')+'</div></div>';
  });
  Object.keys(EMPS).sort(function(a,b){ return (EMPS[a].name||'').localeCompare(EMPS[b].name||''); }).forEach(function(k){
    if(k===me||listed[k]) return;
    var nm=EMPS[k].name;
    h+='<div class="conv" onclick="openChat(\''+esc(k)+'\',\''+esc(nm).replace(/'/g,"\\'")+'\')">'+avatarHtml(k,nm,52)
      +'<div class="cbody"><div class="cname">'+esc(nm)+'</div><div class="cprev" style="color:var(--t3);">Say hi 👋</div></div></div>';
  });
  $('convs').innerHTML=h;
}

/* ── NAV ── */
function navRender(){
  var u=totalUnread();
  var mk=function(){
    return '<button '+(_tab==='chats'?'class="on"':'')+' onclick="goTab(\'chats\')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Chats'+(u?'<span class="navbadge">'+(u>99?'99+':u)+'</span>':'')+'</button>'
      +'<button '+(_tab==='games'?'class="on"':'')+' onclick="goTab(\'games\')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></svg>Games</button>'
      +'<button '+(_tab==='leave'?'class="on"':'')+' onclick="goTab(\'leave\')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Leave</button>';
  };
  ['nav','nav2','nav3'].forEach(function(id){ var el=$(id); if(el) el.innerHTML=mk(); });
}
var _tab='chats';
function goTab(t){
  _tab=t;
  $('scr-list').classList.toggle('hide',t!=='chats');
  $('scr-games').classList.toggle('hide',t!=='games');
  $('scr-leave').classList.toggle('hide',t!=='leave');
  $('scr-chat').classList.add('hide');
  if(t==='leave') loadLeave();
  navRender();
}
function showList(){ _tab='chats'; goTab('chats'); }

/* ── CHAT THREAD ── */
function openChat(key,name){
  CUR=key; CURNAME=name;
  $('scr-list').classList.add('hide'); $('scr-chat').classList.remove('hide');
  paintChatHead(); renderThread(); markRead();
  setTimeout(function(){ $('msgs').scrollTop=$('msgs').scrollHeight; },50);
}
function paintChatHead(){
  $('ch-title').textContent=CURNAME;
  var isDm=CUR!=='group'&&CUR.indexOf('ch:')!==0;
  var av=$('ch-av');
  if(CUR==='group'){ av.textContent='👥'; av.style.background='linear-gradient(135deg,#ff9a4d,#e2560f)'; $('ch-sub').textContent='everyone on the team'; $('ch-dot').classList.add('hide'); }
  else if(!isDm){ av.textContent='#'; av.style.background='linear-gradient(135deg,#8f7bff,#5b3fe0)'; $('ch-sub').textContent='group channel'; $('ch-dot').classList.add('hide'); }
  else{
    var p=PRESENCE[String(CUR).toUpperCase()];
    var photo=(p&&p.photo)||AVA[String(CUR).toUpperCase()];
    if(photo){ av.innerHTML='<img src="'+esc(photo)+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">'; }
    else av.textContent=initials(CURNAME);
    $('ch-sub').textContent=(p&&p.online)?'Active now':'Offline';
    $('ch-dot').classList.toggle('hide',!(p&&p.online));
  }
}
function markRead(){
  LASTREAD[CUR]=Date.now();
  try{ localStorage.setItem('jmbc_lastread',JSON.stringify(LASTREAD)); }catch(e){}
  renderConvs(); navRender();
}
function renderThread(){
  var list=msgsFor(CUR), me=String(ME.employee_id).toUpperCase();
  var h='', lastDay='', lastSender='';
  list.forEach(function(m){
    var d=new Date(m.created_at), day=d.toDateString();
    if(day!==lastDay){ h+='<div class="daysep">'+((day===new Date().toDateString())?'Today':d.toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'}))+'</div>'; lastDay=day; lastSender=''; }
    var mine=String(m.sender_id).toUpperCase()===me;
    if(!mine&&String(m.sender_id)!==lastSender&&(CUR==='group'||CUR.indexOf('ch:')===0))
      h+='<div class="mname">'+esc(firstName(m.sender_name))+'</div>';
    lastSender=String(m.sender_id);
    var reply='';
    if(m.reply){ var rp=m.reply; if(typeof rp==='string'){ try{ rp=JSON.parse(rp);}catch(e){ rp=null; } }
      if(rp) reply='<div class="replyq"><b>'+esc(firstName(rp.name||''))+'</b> '+esc(String(rp.text||'').slice(0,80))+'</div>'; }
    var body='';
    if(m.image){
      var isImg=/\.(png|jpe?g|gif|webp)(\?|$)/i.test(m.image)||String(m.image).indexOf('data:image')===0||String(m.image).indexOf('giphy')>=0;
      body+= isImg ? '<img class="att" src="'+esc(m.image)+'" onclick="viewImg(this.src)">'
                   : '<a href="'+esc(m.image)+'" target="_blank" style="color:inherit;">📎 '+esc(m.message||'File')+'</a>';
    }
    if(m.message&&!(m.image&&!/\.(png|jpe?g|gif|webp)/i.test(m.image))) body+=esc(m.message);
    var rx={}; try{ rx=m.reactions?JSON.parse(m.reactions):{}; }catch(e){} delete rx._pin;
    var pills=Object.keys(rx).map(function(e2){ return '<span class="pill">'+e2+' '+(rx[e2]||[]).length+'</span>'; }).join('');
    h+='<div class="mrow '+(mine?'mine':'theirs')+'" data-id="'+esc(m.id)+'">'
      +(!mine?('<div class="mav">'+(AVA[String(m.sender_id).toUpperCase()]?'<img src="'+esc(AVA[String(m.sender_id).toUpperCase()])+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">':esc(initials(m.sender_name)))+'</div>'):'')
      +'<div class="mgroup"><div class="bub" oncontextmenu="return rxOpen(event,\''+esc(m.id)+'\')" ontouchstart="rxTouch(event,\''+esc(m.id)+'\')" ontouchend="rxTouchEnd()" onclick="setReplyFrom(\''+esc(m.id)+'\')">'+reply+body+'</div>'
      +(pills?'<div class="pills">'+pills+'</div>':'')+'</div></div>';
  });
  if(!list.length) h='<div style="text-align:center;color:var(--t3);margin-top:60px;font-size:13.5px;">No messages yet — start the conversation 🧡</div>';
  var el=$('msgs'), atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<120;
  el.innerHTML=h;
  if(atBottom) el.scrollTop=el.scrollHeight;
  if(!$('scr-chat').classList.contains('hide')) markRead();
}
function viewImg(src){ $('vw-img').src=src; $('viewer').style.display='flex'; }

/* dbl-tap a bubble sets reply; long-press opens reactions */
var _lastTap=0,_tapId=null;
function setReplyFrom(id){
  var now=Date.now();
  if(_tapId===id&&now-_lastTap<350){
    var m=MSGS.filter(function(x){return String(x.id)===String(id);})[0]; if(!m) return;
    REPLY={id:m.id,name:m.sender_name,text:m.image?'📷 Photo':(m.message||'')};
    $('rb-name').textContent=firstName(m.sender_name); $('rb-text').textContent=String(REPLY.text).slice(0,60);
    $('replybar').style.display='flex'; $('inp').focus();
  }
  _lastTap=now; _tapId=id;
}
function cancelReply(){ REPLY=null; $('replybar').style.display='none'; }

/* reactions */
var RX=['👍','❤️','😂','😮','😢','🔥'], _rxTimer=null,_rxMsg=null;
function rxOpen(ev,id){ ev.preventDefault(); rxShow(ev.touches?ev.touches[0]:ev,id); return false; }
function rxTouch(ev,id){ _rxTimer=setTimeout(function(){ rxShow(ev.touches[0],id); },450); }
function rxTouchEnd(){ clearTimeout(_rxTimer); }
function rxShow(pt,id){
  _rxMsg=id;
  var bar=$('rxbar');
  bar.innerHTML=RX.map(function(e){ return '<button onclick="react(\''+e+'\')">'+e+'</button>'; }).join('');
  bar.style.display='flex';
  var x=Math.min(Math.max(10,(pt.clientX||60)-130),window.innerWidth-290);
  bar.style.left=x+'px'; bar.style.top=Math.max(60,(pt.clientY||200)-70)+'px';
  setTimeout(function(){ document.addEventListener('click',rxHide,{once:true}); },50);
}
function rxHide(){ $('rxbar').style.display='none'; }
async function react(emoji){
  rxHide();
  var m=MSGS.filter(function(x){return String(x.id)===String(_rxMsg);})[0]; if(!m) return;
  var rx={}; try{ rx=m.reactions?JSON.parse(m.reactions):{}; }catch(e){}
  var me=String(ME.employee_id);
  rx[emoji]=rx[emoji]||[];
  var i=rx[emoji].indexOf(me);
  if(i>=0){ rx[emoji].splice(i,1); if(!rx[emoji].length) delete rx[emoji]; } else rx[emoji].push(me);
  try{ await SB.from('messages').update({reactions:JSON.stringify(rx)}).eq('id',m.id); loadAllMessages(); }catch(e){}
}

/* composer */
$('inp').addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(110,this.scrollHeight)+'px'; });
$('inp').addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
function pickImg(input){
  var f=input.files&&input.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    // downscale to keep the messages table light — same idea as the portal
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'), MAX=1100;
      var sc=Math.min(1,MAX/Math.max(img.width,img.height));
      c.width=img.width*sc; c.height=img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      IMGDATA=c.toDataURL('image/jpeg',.8);
      $('ip-img').src=IMGDATA; $('imgprev').style.display='block';
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
  input.value='';
}
function clearImg(){ IMGDATA=''; $('imgprev').style.display='none'; }
async function send(){
  var txt=($('inp').value||'').trim();
  if(!txt&&!IMGDATA) return;
  var rec={sender_id:ME.employee_id,sender_name:ME.full_name,message:txt,
    receiver_id:(CUR==='group'||CUR.indexOf('ch:')===0)?null:CUR,is_read:false};
  if(CUR.indexOf('ch:')===0) rec.channel_id=CUR.slice(3);
  if(IMGDATA) rec.image=IMGDATA;
  if(REPLY) rec.reply=JSON.stringify(REPLY);
  $('inp').value=''; $('inp').style.height='auto'; clearImg(); cancelReply();
  try{
    var r=await SB.from('messages').insert([rec]);
    if(r&&r.error){ toast('Send failed: '+(r.error.message||'')); return; }
    loadAllMessages();
    fetch(API+'?action=push_chat&from='+encodeURIComponent(ME.employee_id)
      +'&from_name='+encodeURIComponent(ME.full_name)+'&to='+encodeURIComponent(CUR)
      +'&text='+encodeURIComponent(IMGDATA?'📷 Photo':txt)+'&_='+Date.now()).catch(function(){});
  }catch(e){ toast('Could not send.'); }
}

/* ── LEAVE ── */
var LV_TYPES=['Vacation','Sick','Emergency','Bereavement','Maternity / Paternity','Others'];
var _lvType=null;
(function(){
  $('ltypes').innerHTML=LV_TYPES.map(function(t,i){
    return '<div class="ltype" id="lt-'+i+'" onclick="lvPick('+i+')">'+t+'</div>';
  }).join('');
})();
function lvPick(i){
  _lvType=LV_TYPES[i];
  LV_TYPES.forEach(function(_,j){ $('lt-'+j).classList.toggle('on',j===i); });
}
function lvDays(a,b){
  var d1=new Date(a), d2=new Date(b||a);
  return Math.max(1,Math.round((d2-d1)/86400000)+1);
}
async function submitLeave(){
  var s=$('lv-start').value, e=$('lv-end').value||s, rs=($('lv-reason').value||'').trim();
  if(!_lvType){ toast('Pick a leave type.'); return; }
  if(!s){ toast('Pick a start date.'); return; }
  if(!rs){ toast('Add a short reason.'); return; }
  var b=$('lv-btn'); b.disabled=true; b.textContent='Submitting…';
  try{
    await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},mode:'no-cors',
      body:JSON.stringify({action:'submit_leave',employee_id:ME.employee_id,full_name:ME.full_name,
        type:_lvType,start:s,end:e,days:lvDays(s,e),reason:rs,status:'pending',
        submitted:new Date().toISOString()})});
    toast('Leave request sent ✅');
    $('lv-start').value=''; $('lv-end').value=''; $('lv-reason').value='';
    _lvType=null; LV_TYPES.forEach(function(_,j){ $('lt-'+j).classList.remove('on'); });
    setTimeout(loadLeave,1500);
  }catch(err){ toast('Could not submit — try again.'); }
  b.disabled=false; b.textContent='Submit request';
}
async function loadLeave(){
  var el=$('lv-list'); el.innerHTML='<div class="spin"></div>';
  try{
    var d=await (await fetch(API+'?action=get_leave_requests&employee_id='+encodeURIComponent(ME.employee_id)+'&_='+Date.now())).json();
    var rows=(d&&(d.requests||d.leaves))||[];
    rows=rows.filter(function(r){ return String(r.employee_id||'').toUpperCase()===String(ME.employee_id).toUpperCase(); });
    if(!rows.length){ el.innerHTML='<div style="color:var(--t3);font-size:13px;padding:8px 2px;">No requests yet.</div>'; return; }
    rows.sort(function(a,b){ return String(b.submitted||b.start||'').localeCompare(String(a.submitted||a.start||'')); });
    el.innerHTML=rows.map(function(r){
      var st=String(r.status||'pending').toLowerCase();
      return '<div class="lreq '+esc(st)+'"><span class="lstat '+esc(st)+'">'+esc(st)+'</span>'
        +'<b>'+esc(r.type||'Leave')+'</b>'
        +'<div class="lmeta">'+esc(r.start||'')+(r.end&&r.end!==r.start?(' → '+esc(r.end)):'')+' · '+esc(String(r.days||1))+' day(s)</div>'
        +(r.reason?'<div class="lmeta">'+esc(r.reason)+'</div>':'')+'</div>';
    }).join('');
  }catch(e){ el.innerHTML='<div style="color:var(--t3);font-size:13px;">Could not load requests.</div>'; }
}

/* ── STARTUP ── */
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('/sw.js'); }catch(e){} }
(function(){
  var s=loadSess();
  if(s&&s.id){ ME={employee_id:s.id,full_name:s.name,photo:s.photo||''}; boot(); }
})();
</script>
