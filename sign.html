<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Sign Your JMB Virtuals Agreements</title>
<style>
  :root{ --orange:#e83d00; --orange2:#ff6b1a; --ink:#1a1a1a; --muted:#6b7280; --line:#e6e6ea; --bg:#f4f5f7; --card:#fff; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  .wrap{ max-width:720px; margin:0 auto; padding:20px 16px 70px; }
  .brand{ display:flex; align-items:center; gap:10px; padding:16px 0 12px; }
  .brand b{ color:var(--orange); font-size:20px; letter-spacing:.02em; }
  .brand span{ color:var(--muted); font-size:13px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 12px 40px -24px rgba(0,0,0,.4); }
  h1{ font-size:22px; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:13.5px; margin:0 0 16px; }
  .doc{ background:#fbfbfc; border:1px solid var(--line); border-radius:12px; padding:14px 16px; max-height:300px; overflow:auto; font-size:12.5px; color:#333; margin-bottom:8px; }
  .doc h2{ font-size:14px; color:var(--orange); margin:0 0 8px; }
  .doc h3{ font-size:12.5px; margin:12px 0 3px; color:var(--ink); }
  .doc p{ margin:0 0 8px; }
  .doc b{ color:var(--ink); }
  .doc ul{ margin:0 0 8px; padding-left:18px; }
  details{ border:1px solid var(--line); border-radius:12px; padding:0 14px; margin-bottom:8px; background:#fff; }
  details summary{ cursor:pointer; font-weight:700; font-size:14px; padding:13px 0; list-style:none; display:flex; align-items:center; justify-content:space-between; }
  details summary::-webkit-details-marker{ display:none; }
  details summary::after{ content:"⌄"; color:var(--muted); font-size:18px; }
  details[open] summary::after{ content:"⌃"; }
  details .body{ font-size:12.5px; color:#444; padding:0 0 12px; line-height:1.6; }
  .agree{ display:flex; align-items:flex-start; gap:10px; margin:6px 0 14px; padding:11px 13px; background:#fff8f5; border:1px solid #f3d9cd; border-radius:10px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .agree input{ margin-top:2px; width:18px; height:18px; flex:0 0 auto; accent-color:var(--orange); }
  label.fld{ display:block; font-size:12px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); margin:16px 0 6px; }
  input[type=text]{ width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:16px; font-family:inherit; }
  input[type=text]:focus{ outline:none; border-color:var(--orange); box-shadow:0 0 0 3px rgba(232,61,0,.12); }
  .consent{ display:flex; align-items:flex-start; gap:10px; margin:14px 0 4px; font-size:13px; color:#444; cursor:pointer; }
  .consent input{ margin-top:2px; width:18px; height:18px; flex:0 0 auto; accent-color:var(--orange); }
  button.go{ width:100%; margin-top:18px; padding:15px; border:none; border-radius:12px; background:linear-gradient(135deg,var(--orange2),var(--orange)); color:#fff; font-weight:800; font-size:16px; cursor:pointer; }
  button.go:disabled{ opacity:.55; cursor:not-allowed; }
  .msg{ margin-top:12px; font-size:13.5px; min-height:18px; }
  .state{ text-align:center; padding:26px 10px; }
  .state .ic{ font-size:44px; } .state h2{ margin:10px 0 6px; } .state p{ color:var(--muted); font-size:14px; margin:0; }
  .foot{ text-align:center; color:var(--muted); font-size:11.5px; margin-top:18px; line-height:1.5; }
  .sigline{ font-family:"Snell Roundhand","Brush Script MT",cursive; }
  .sigpad-wrap{ position:relative; border:1.5px solid var(--line); border-radius:12px; background:#fff; }
  .sigpad-wrap.drawn{ border-color:var(--orange); }
  #sigpad{ display:block; width:100%; height:180px; border-radius:12px; touch-action:none; cursor:crosshair; }
  .sigpad-base{ position:absolute; left:14px; right:60px; bottom:34px; border-bottom:1px solid #cfd4dd; pointer-events:none; }
  .sigpad-x{ position:absolute; left:14px; bottom:36px; color:#aab; font-size:18px; pointer-events:none; }
  .sigpad-hint{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; color:#b8bec9; font-size:14px; pointer-events:none; }
  .sigclear{ position:absolute; top:8px; right:8px; background:#fff; border:1px solid var(--line); border-radius:8px; font-size:12px; padding:5px 10px; color:var(--muted); cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>JMB VIRTUALS</b><span>· Operations Management</span></div>
  <div class="card" id="card"><div class="state"><div class="ic">⏳</div><h2>Loading…</h2><p>Please wait a moment.</p></div></div>
  <div class="foot">JMB Virtuals is a community of independent freelance virtual assistants. Your electronic signature below is your voluntary agreement to the documents listed. This does not create an employer–employee relationship.</div>
</div>

<script src="jmb_docs.js"></script>
<script>
var APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwK8rVJlkv5YLgNLe7cGIz73KJc0hedmZcutoiRviDEowiZPglzBnznswBaZ0TVIV8t/exec";
var TOKEN=new URLSearchParams(location.search).get('t')||'';
var DATA=null;
var DOCS=[
  "Independent Contractor Agreement",
  "Confidentiality & Non-Disclosure Agreement",
  "Non-Solicitation & Client-Protection Agreement",
  "Code of Conduct & Team Handbook",
  "AWOL & Proper Disengagement Policy"
];
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function card(h){ document.getElementById('card').innerHTML=h; }

function boot(){
  if(!TOKEN){ card('<div class="state"><div class="ic">🔗</div><h2>Invalid link</h2><p>This signing link is missing its code. Please use the exact link sent to you.</p></div>'); return; }
  fetch(APPS_SCRIPT_URL+'?action=contract_sign_get&t='+encodeURIComponent(TOKEN)+'&_='+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){ if(!d||d.error){ card('<div class="state"><div class="ic">🔗</div><h2>Link not found</h2><p>This link is invalid or expired. Please contact JMB Virtuals Operations.</p></div>'); return; }
      DATA=d; if(d.signed){ done(d.full_name,d.signed_at,true); return; } form(d); })
    .catch(function(){ card('<div class="state"><div class="ic">⚠️</div><h2>Connection error</h2><p>Please check your internet and refresh.</p></div>'); });
}
function done(name, when, already){
  card('<div class="state"><div class="ic">✅</div><h2>'+(already?'Already signed':'Signed — thank you')+'</h2><p>'+(already?'Your agreements are already signed and on file'+(when?' ('+esc(String(when).slice(0,16))+')':'')+'.':'Your e-signature and agreement have been recorded. A confirmation has been emailed to you. Welcome aboard!')+'</p></div>');
}

function icaHTML(name, id, eff){
  return '<h2>Independent Contractor Agreement</h2>'+
    '<p><b>Parties:</b> JMB Virtuals (Jethro Bringas, Founder / Operations Manager) and <b>'+esc(name)+'</b>'+(id?(' (Contractor ID '+esc(id)+')'):'')+'.<br><b>Effective Date:</b> '+esc(eff||'[Date]')+'</p>'+
    '<h3>1. Engagement</h3><p>JMB Virtuals engages the Contractor to provide virtual-assistant services in support of one or more of JMB Virtuals’ clients. Specific tasks, committed hours, client assignment, and rate are agreed separately (Schedule A) and may be updated in writing.</p>'+
    '<h3>2. Independent Contractor Status</h3><p>The Contractor is an <b>independent contractor</b>, not an employee, agent, or partner. Nothing here creates an employer–employee relationship. The Contractor is responsible for their own taxes and any voluntary government contributions; is not entitled to employee benefits, 13th-month pay, paid leave, or separation pay from JMB Virtuals; controls how the services are performed within the client’s reasonable requirements; and provides their own equipment and internet unless otherwise agreed.</p>'+
    '<h3>3. Compensation</h3><p>JMB Virtuals pays the Contractor at the agreed rate from fees collected from the client, less any agreed management fee, on the agreed cycle, subject to accurate time records or invoices. The Contractor is paid only for services actually rendered and accepted.</p>'+
    '<h3>4. Availability & Conduct</h3><p>The Contractor will keep agreed availability, track time accurately where required, communicate promptly, and follow JMB Virtuals’ policies including the AWOL & Proper Disengagement Policy and Code of Conduct. Going AWOL or abandoning the engagement is a material breach.</p>'+
    '<h3>5. Confidentiality & Data</h3><p>The Contractor will protect all confidential information and personal data and use it only for the services, as detailed in the Confidentiality & Non-Disclosure Agreement.</p>'+
    '<h3>6. Intellectual Property</h3><p>All work product created for a client belongs to that client (or JMB Virtuals, as applicable) on creation and payment; the Contractor assigns those rights and waives moral rights to the extent permitted by law.</p>'+
    '<h3>7. Non-Solicitation</h3><p>During the engagement and for the agreed restricted period afterward, the Contractor will not solicit, circumvent, or directly contract JMB Virtuals’ clients outside the arrangement, as detailed in the Non-Solicitation & Client-Protection Agreement.</p>'+
    '<h3>8. Term & Termination</h3><p>Either party may end the engagement on the agreed written notice; JMB Virtuals may end it immediately for cause (including going AWOL, breach of confidentiality, or dishonesty). On termination, the Contractor returns all assets and access, turns over work, and JMB Virtuals reconciles fees for completed work.</p>'+
    '<h3>9. Governing Law</h3><p>This Agreement is governed by the laws of the Republic of the Philippines and does not create employment. The full Independent Contractor Agreement, including Schedule A, has been provided to you.</p>';
}

function form(d){
  var eff=d.effective_date||'[Date]';
  var others=[
    ['Confidentiality & Non-Disclosure Agreement','I will keep all JMB Virtuals and client confidential information and personal data secure, use it only for my work, follow good security practices (strong passwords, no account sharing), report any breach promptly, and return or delete all confidential materials when my engagement ends. These obligations continue after the engagement.'],
    ['Non-Solicitation & Client-Protection Agreement','During my engagement and for the agreed restricted period afterward, I will not solicit, accept, circumvent, or directly work for JMB Virtuals’ clients outside the JMB Virtuals arrangement, nor poach other team members, without JMB Virtuals’ written consent.'],
    ['Code of Conduct & Team Handbook','I will act professionally and reliably, keep my committed hours, track time honestly, communicate promptly, care for the client relationship, protect confidentiality and security, avoid conflicts of interest, and treat everyone with respect. I understand harassment, dishonesty, and time theft are not tolerated.'],
    ['AWOL & Proper Disengagement Policy','I understand that going AWOL — being unreachable during committed hours without notice — is not tolerated and is treated as abandonment. If I choose to leave, I will give proper notice, submit my resignation through the link provided, turn over my work, and return all access and assets.']
  ];
  var v={ name:d.full_name, id:d.employee_id, eff:eff };
  var html=
    '<h1>Review & Sign Your Agreements</h1>'+
    '<p class="sub">Hi '+esc(d.full_name)+' — please read each document below, tick that you agree, then sign. Effective date: <b>'+esc(eff)+'</b>.</p>';
  (window.JMBDocs?JMBDocs.DOCS:[]).forEach(function(doc){
    html+='<div class="doc">'+JMBDocs.render(doc.key, v)+'</div>'+
      '<label class="agree"><input type="checkbox" class="ag" data-doc="'+esc(doc.title)+'" /> I have read and agree to the <b>'+esc(doc.title)+'</b>.</label>';
  });
  html+=
    '<label class="fld">Full name (printed)</label>'+
    '<input type="text" id="sig" placeholder="'+esc(d.full_name)+'" autocomplete="name" />'+
    '<label class="fld">Draw your signature</label>'+
    '<div class="sigpad-wrap" id="sigwrap">'+
      '<canvas id="sigpad"></canvas>'+
      '<div class="sigpad-hint" id="sighint">✍ Sign here with your finger or mouse</div>'+
      '<div class="sigpad-base"></div><div class="sigpad-x">✗</div>'+
      '<button type="button" class="sigclear" onclick="clearPad()">Clear</button>'+
    '</div>'+
    '<label class="consent"><input type="checkbox" id="consent" /> I understand that signing above and clicking “Sign” is my electronic signature, that I am signing voluntarily, and that it has the same legal effect as a handwritten signature on paper.</label>'+
    '<button class="go" id="submit" onclick="submitSign()">Sign my agreements</button>'+
    '<div class="msg" id="msg"></div>';
  card(html);
  initPad();
}

var PAD={ cv:null, ctx:null, ratio:1, drawing:false, has:false, pts:[], lastW:2, minX:1e9, minY:1e9, maxX:-1e9, maxY:-1e9 };
function initPad(){
  var cv=document.getElementById('sigpad'); if(!cv) return;
  PAD.cv=cv; var ratio=Math.max(1, window.devicePixelRatio||1); PAD.ratio=ratio;
  var rect=cv.getBoundingClientRect(); var hpx=rect.height||180;
  cv.width=Math.round(rect.width*ratio); cv.height=Math.round(hpx*ratio);
  var ctx=cv.getContext('2d'); ctx.scale(ratio,ratio); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.fillStyle='#0b1220';
  PAD.ctx=ctx;
  var MINW=1.1, MAXW=3.3;
  function pos(e){ var r=cv.getBoundingClientRect(); var p=(e.touches&&e.touches[0])||e; return { x:p.clientX-r.left, y:p.clientY-r.top, t:Date.now() }; }
  function bound(p){ if(p.x<PAD.minX)PAD.minX=p.x; if(p.y<PAD.minY)PAD.minY=p.y; if(p.x>PAD.maxX)PAD.maxX=p.x; if(p.y>PAD.maxY)PAD.maxY=p.y; }
  function mid(a,b){ return { x:(a.x+b.x)/2, y:(a.y+b.y)/2 }; }
  function vel(a,b){ var dt=Math.max(1,b.t-a.t); return Math.hypot(b.x-a.x,b.y-a.y)/dt; }
  function wForV(v){ return Math.max(MINW, MAXW - v*1.7); }
  function dot(p,w){ ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0.6,w/2),0,6.283); ctx.fill(); }
  function seg(s,c,e,w1,w2){ var steps=Math.max(2, Math.ceil(Math.hypot(e.x-s.x,e.y-s.y))); for(var i=0;i<=steps;i++){ var t=i/steps; var x=(1-t)*(1-t)*s.x+2*(1-t)*t*c.x+t*t*e.x; var y=(1-t)*(1-t)*s.y+2*(1-t)*t*c.y+t*t*e.y; var w=w1+(w2-w1)*t; ctx.beginPath(); ctx.arc(x,y,Math.max(0.6,w/2),0,6.283); ctx.fill(); } }
  function markDrawn(){ if(!PAD.has){ PAD.has=true; var h=document.getElementById('sighint'); if(h)h.style.display='none'; var w=document.getElementById('sigwrap'); if(w)w.classList.add('drawn'); } }
  function start(e){ e.preventDefault(); PAD.drawing=true; var p=pos(e); PAD.pts=[p]; PAD.lastW=(MINW+MAXW)/2; bound(p); dot(p,PAD.lastW); markDrawn(); }
  function move(e){ if(!PAD.drawing) return; e.preventDefault(); var p=pos(e); PAD.pts.push(p); bound(p); var n=PAD.pts.length;
    if(n>=3){ var p0=PAD.pts[n-3],p1=PAD.pts[n-2],p2=PAD.pts[n-1]; var s=mid(p0,p1), c=p1, en=mid(p1,p2); var w=wForV(vel(p1,p2)); w=0.35*w+0.65*PAD.lastW; seg(s,c,en,PAD.lastW,w); PAD.lastW=w; }
    else if(n===2){ dot(p,PAD.lastW); } }
  function end(){ PAD.drawing=false; }
  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end); cv.addEventListener('touchcancel',end);
}
function clearPad(){ if(!PAD.ctx||!PAD.cv) return; PAD.ctx.clearRect(0,0,PAD.cv.width,PAD.cv.height); PAD.has=false; PAD.pts=[]; PAD.minX=PAD.minY=1e9; PAD.maxX=PAD.maxY=-1e9; var h=document.getElementById('sighint'); if(h)h.style.display=''; var w=document.getElementById('sigwrap'); if(w)w.classList.remove('drawn'); }
// Export just the drawn area (trimmed), so each signature is clean and centered.
function exportSig(){
  if(!PAD.has||!PAD.cv) return '';
  var r=PAD.ratio, pad=12;
  var sx=Math.max(0,(PAD.minX-pad))*r, sy=Math.max(0,(PAD.minY-pad))*r;
  var ex=Math.min(PAD.cv.width,(PAD.maxX+pad)*r), ey=Math.min(PAD.cv.height,(PAD.maxY+pad)*r);
  var sw=Math.max(1,ex-sx), sh=Math.max(1,ey-sy);
  try{ var tmp=document.createElement('canvas'); tmp.width=sw; tmp.height=sh; tmp.getContext('2d').drawImage(PAD.cv, sx,sy,sw,sh, 0,0, sw,sh); return tmp.toDataURL('image/png'); }
  catch(e){ return PAD.cv.toDataURL('image/png'); }
}
function msg(x,err){ var m=document.getElementById('msg'); if(m){ m.textContent=x; m.style.color=err?'#dc2626':'#16a34a'; } }
function submitSign(){
  var sig=(document.getElementById('sig').value||'').trim();
  var consent=document.getElementById('consent').checked;
  var boxes=[].slice.call(document.querySelectorAll('.ag'));
  var checked=boxes.filter(function(b){return b.checked;});
  if(checked.length!==boxes.length){ msg('Please tick that you agree to all '+boxes.length+' documents.', true); return; }
  if(!sig){ msg('Please type your full printed name.', true); return; }
  if(!PAD.has){ msg('Please draw your signature in the box.', true); return; }
  if(!consent){ msg('Please tick the electronic-signature consent box.', true); return; }
  var agreed=boxes.map(function(b){return b.getAttribute('data-doc');});
  var img=''; try{ var s=exportSig(); var comma=s.indexOf(','); img=comma>=0?s.slice(comma+1):s; }catch(e){}
  if(!img){ msg('Could not capture your signature. Please try again.', true); return; }
  var docHtml=''; [].slice.call(document.querySelectorAll('.doc')).forEach(function(el){ docHtml+='<div class="doc">'+el.innerHTML+'</div>'; });
  var btn=document.getElementById('submit'); btn.disabled=true; btn.textContent='Signing…'; msg('Recording your signature…',false);
  fetch(APPS_SCRIPT_URL,{ method:'POST', body:JSON.stringify({ action:'contract_sign_submit', token:TOKEN, signature:sig, agreed:agreed, sig_image_b64:img, doc_html:docHtml }) })
    .then(function(r){return r.json();})
    .then(function(d){ if(d&&d.ok){ done(sig,null,false); } else if(d&&d.error==='ALREADY_SIGNED'){ done(sig,null,true); } else { msg('Could not sign: '+((d&&d.error)||'please try again')+'.', true); btn.disabled=false; btn.textContent='Sign my agreements'; } })
    .catch(function(){ msg('Connection error. Please try again.', true); btn.disabled=false; btn.textContent='Sign my agreements'; });
}
boot();
</script>
</body>
</html>
