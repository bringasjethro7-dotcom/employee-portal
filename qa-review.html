<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JMB — QA Review</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════════════════════
   QA REVIEW — visual system
   Reviewing is close reading: someone sits with this for half an hour deciding whether a
   colleague's week was done properly. So the interface gets out of the way — the screenshots
   are the brightest thing on the page, everything else recedes. Deep navy chrome, one warm
   accent, and generous space so a 40-item checklist doesn't feel like a spreadsheet.
   ══════════════════════════════════════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
:root{
  --ink:#0b1120; --ink2:#111a2e; --ink3:#1b2540;
  --bg:#eef1f7; --card:#ffffff; --card2:#f7f9fc;
  --line:rgba(15,23,42,.09); --line2:rgba(15,23,42,.16);
  --t1:#0b1120; --t2:#4a5568; --t3:#8b96a8;
  --o1:#ff7a1a; --o2:#ea580c; --o3:#c2410c; --oSoft:#fff2e7;
  --green:#0f8f5f; --greenSoft:#e6f7f0;
  --red:#dc2626; --redSoft:#fdecec;
  --blue:#2563eb; --blueSoft:#eaf1fe;
  --amber:#b45309;
  --r:14px; --r2:11px;
  --sh1:0 1px 2px rgba(11,17,32,.05);
  --sh2:0 4px 14px -6px rgba(11,17,32,.16), 0 1px 3px rgba(11,17,32,.05);
  --sh3:0 24px 60px -28px rgba(11,17,32,.42), 0 6px 20px -12px rgba(11,17,32,.18);
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{margin:0;background:
   radial-gradient(1100px 480px at 12% -8%, #ffffff 0%, rgba(255,255,255,0) 62%),
   radial-gradient(900px 420px at 100% 0%, #f2f6ff 0%, rgba(242,246,255,0) 58%),
   var(--bg);
  color:var(--t1);font:15px/1.6 'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 90px}

/* ── masthead ─────────────────────────────────────────────────────────────────────────── */
.top{background:linear-gradient(135deg,var(--ink) 0%,var(--ink3) 62%,#24304f 100%);
  border-radius:0 0 26px 26px;padding:22px 26px 26px;margin:0 -20px 22px;color:#fff;
  box-shadow:var(--sh3);position:relative;overflow:hidden}
.top:before{content:'';position:absolute;inset:0;
  background:radial-gradient(620px 200px at 88% -30%, rgba(255,122,26,.28), transparent 68%);pointer-events:none}
.top .inner{max-width:1320px;margin:0 auto;position:relative;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.top h1{font-size:25px;font-weight:800;letter-spacing:-.6px;margin:0 0 3px}
.top .sub{color:rgba(255,255,255,.62);font-size:13px;margin:0}
.who{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  padding:7px 8px 7px 12px;border-radius:999px;backdrop-filter:blur(8px)}
.who .nmw{font-size:12.5px;font-weight:700;line-height:1.25}
.who .nmw small{display:block;color:rgba(255,255,255,.55);font-weight:500;font-size:10.5px}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--o1),var(--o3));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;flex:0 0 32px}

/* ── controls ─────────────────────────────────────────────────────────────────────────── */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--sh1)}
.seg button{border:none;background:none;padding:7px 16px;border-radius:999px;font:700 12.5px 'Manrope';color:var(--t2);cursor:pointer;transition:.16s}
.seg button.on{background:var(--ink);color:#fff;box-shadow:var(--sh2)}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--t3)}
input,select,textarea{background:var(--card);border:1px solid var(--line2);color:var(--t1);border-radius:10px;
  padding:9px 11px;font:14px 'Manrope';transition:.16s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--o1);box-shadow:0 0 0 4px rgba(255,122,26,.13)}
.btn{background:var(--card);border:1px solid var(--line2);color:var(--t1);padding:9px 16px;border-radius:10px;
  font:700 12.5px 'Manrope';cursor:pointer;transition:.16s;box-shadow:var(--sh1)}
.btn:hover{border-color:var(--t3);transform:translateY(-1px);box-shadow:var(--sh2)}
.btn:active{transform:none}
.btn.p{background:linear-gradient(135deg,var(--o1),var(--o2));border:none;color:#fff;box-shadow:0 6px 18px -8px rgba(234,88,12,.7)}
.btn.p:hover{box-shadow:0 10px 26px -10px rgba(234,88,12,.75)}
.btn.g{background:linear-gradient(135deg,#12a06b,var(--green));border:none;color:#fff;box-shadow:0 6px 18px -8px rgba(15,143,95,.6)}
.btn.dark{background:var(--ink);border:none;color:#fff}
.btn.sm{padding:6px 11px;font-size:11.5px;border-radius:9px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:var(--sh1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh2)}

/* ── stat tiles ───────────────────────────────────────────────────────────────────────── */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin-bottom:18px}
.st{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;box-shadow:var(--sh2);
  position:relative;overflow:hidden}
.st:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--t3);opacity:.5}
.st.r:before{background:var(--red);opacity:1}
.st.g:before{background:var(--green);opacity:1}
.st.a:before{background:var(--amber);opacity:1}
.st b{display:block;font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.st span{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.9px;font-weight:700}

/* ── board ────────────────────────────────────────────────────────────────────────────── */
.bwrap{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.bwrap{grid-template-columns:1fr}}
.side{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh2);
  overflow:hidden;position:sticky;top:16px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;min-height:0}
.side h3{margin:0;padding:14px 16px 12px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
  color:var(--t3);font-weight:800;border-bottom:1px solid var(--line);background:var(--card2)}
.sidelist{overflow:auto;flex:1 1 auto;min-height:0}
.sidelist::-webkit-scrollbar{width:9px}
.sidelist::-webkit-scrollbar-thumb{background:rgba(15,23,42,.16);border-radius:9px;border:3px solid var(--card)}
.vrow{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid rgba(15,23,42,.05);
  cursor:pointer;border-left:3px solid transparent;transition:.14s}
.vrow:hover{background:var(--card2)}
.vrow.sel{background:linear-gradient(90deg,var(--oSoft),rgba(255,242,231,0));border-left-color:var(--o1)}
.vrow .av{width:34px;height:34px;flex:0 0 34px;font-size:12px}
.vrow.na .av{background:linear-gradient(135deg,#f87171,var(--red))}
.vrow.as .av{background:linear-gradient(135deg,#34d399,var(--green))}
.vrow.sb .av{background:linear-gradient(135deg,#60a5fa,var(--blue))}
.vrow .nm{flex:1;min-width:0}
.vrow .nm b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .nm span{font-size:11px;color:var(--t3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font:800 9px 'Manrope';padding:4px 9px;border-radius:999px;letter-spacing:.7px;white-space:nowrap}
.vrow.na .tag{background:var(--redSoft);color:#991b1b}
.vrow.as .tag{background:var(--greenSoft);color:#075f43}
.vrow.sb .tag{background:var(--blueSoft);color:#1d4ed8}
.legend{display:flex;gap:14px;padding:11px 15px;border-top:1px solid var(--line);background:var(--card2);
  font-size:10.5px;color:var(--t2);flex-wrap:wrap;font-weight:600}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.detail{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh2);padding:22px 24px}
.assigned{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);
  border-radius:var(--r2);padding:12px 14px;margin-top:9px;flex-wrap:wrap;background:var(--card2)}

/* ── the review itself ────────────────────────────────────────────────────────────────── */
.acct{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:16px;
  box-shadow:var(--sh2);overflow:hidden;transition:.18s}
.acct.done{border-color:rgba(15,143,95,.4);box-shadow:0 0 0 3px rgba(15,143,95,.07),var(--sh2)}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;
  background:var(--card2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ahead b{font-size:15px;font-weight:800;letter-spacing:-.2px}
.abody{padding:18px;display:grid;grid-template-columns:1fr 380px;gap:20px}
@media(max-width:1050px){.abody{grid-template-columns:1fr}}
.dayblk{margin-bottom:18px}
.dayblk h4{margin:0 0 9px;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-weight:800;
  display:flex;align-items:center;gap:9px}
.dayblk h4:after{content:'';flex:1;height:1px;background:var(--line)}
.shots{display:flex;gap:9px;flex-wrap:wrap}
.shots img{width:132px;height:132px;object-fit:cover;border-radius:10px;border:1px solid var(--line);
  cursor:zoom-in;background:var(--card2);transition:.16s}
.shots img:hover{transform:scale(1.05);box-shadow:var(--sh3);border-color:var(--o1);z-index:2;position:relative}
.crit{border:1px solid var(--line);border-radius:var(--r2);padding:16px;background:var(--card2);
  max-height:640px;overflow:auto;position:sticky;top:16px}
.crit h4{margin:0 0 12px;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.citem{padding:11px 0;border-bottom:1px solid rgba(15,23,42,.07)}
.citem:last-child{border-bottom:none}
.ctext{font-size:12.5px;line-height:1.5;margin-bottom:8px;font-weight:500;color:var(--t1)}
.ch{display:flex;gap:0;background:var(--card);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.ch button{flex:1;padding:7px 0;border:none;background:none;font:800 10.5px 'Manrope';cursor:pointer;
  color:var(--t3);transition:.14s;letter-spacing:.4px}
.ch button:not(:last-child){border-right:1px solid var(--line)}
.ch button:hover{background:var(--card2);color:var(--t1)}
.ch button.on.pass{background:var(--green);color:#fff}
.ch button.on.fail{background:var(--red);color:#fff}
.ch button.on.na{background:#64748b;color:#fff}
.prog{height:5px;background:rgba(15,23,42,.08);border-radius:99px;overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--o1),var(--green));border-radius:99px;transition:width .3s}

.note{background:linear-gradient(135deg,var(--oSoft),#fff);border:1px solid rgba(234,88,12,.24);
  border-radius:var(--r2);padding:13px 16px;font-size:12.5px;color:#7c2d12;margin-bottom:14px}
.warn{background:linear-gradient(135deg,var(--redSoft),#fff);border:1px solid rgba(220,38,38,.24);
  border-radius:var(--r2);padding:13px 16px;font-size:12.5px;color:#7f1d1d;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:var(--ink);
  color:#fff;padding:12px 22px;border-radius:12px;font:700 13px 'Manrope';opacity:0;pointer-events:none;
  transition:.22s;z-index:60;box-shadow:var(--sh3)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#lb{position:fixed;inset:0;background:rgba(11,17,32,.94);display:none;align-items:center;justify-content:center;
  z-index:80;cursor:zoom-out;backdrop-filter:blur(6px)}
#lb img{max-width:94vw;max-height:92vh;border-radius:12px;box-shadow:var(--sh3)}
.pill{display:inline-block;font:800 10px 'Manrope';padding:3px 10px;border-radius:999px;letter-spacing:.5px}
.pill.done{background:var(--greenSoft);color:#075f43}
.pill.none{background:#eef1f6;color:#475569}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh2)}
th{text-align:left;color:var(--t3);font-size:10px;text-transform:uppercase;letter-spacing:.9px;font-weight:800;
  padding:12px 12px;border-bottom:1px solid var(--line);background:var(--card2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid rgba(15,23,42,.05)}

/* ── entrance, so a long review doesn't slam into place ─────────────────────────────────── */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.acct{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
.st{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.st:nth-child(2){animation-delay:.04s}.st:nth-child(3){animation-delay:.08s}
.st:nth-child(4){animation-delay:.12s}.st:nth-child(5){animation-delay:.16s}

/* ── skeletons: a shape that becomes the content, not the word "Loading" ────────────────── */
@keyframes shimmer{0%{background-position:-460px 0}100%{background-position:460px 0}}
.sk{background:linear-gradient(90deg,#eef1f6 8%,#f7f9fc 18%,#eef1f6 33%);background-size:900px 100%;
  animation:shimmer 1.25s linear infinite;border-radius:9px}
.skrow{display:flex;gap:11px;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(15,23,42,.05)}

/* ── the criterion you are on ──────────────────────────────────────────────────────────── */
.crit.live{border-color:var(--o1);box-shadow:0 0 0 4px rgba(255,122,26,.1)}
.citem.cur{background:var(--oSoft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:9px}
.citem.cur .ctext{font-weight:700}
.kbd{display:inline-block;min-width:19px;text-align:center;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;margin:0 2px}

/* ── sticky footer: progress and the one action that matters ───────────────────────────── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(11,17,32,.93);backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.09);padding:11px 20px;display:none}
.dock .in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:#fff}
.dock .ring{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;
  font:800 12px 'Manrope';color:#fff;background:conic-gradient(var(--o1) var(--pct,0%), rgba(255,255,255,.14) 0)}
.dock .ring i{width:34px;height:34px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font-style:normal}
.dock .lbl{font-size:13px;font-weight:700}
.dock .lbl small{display:block;color:rgba(255,255,255,.55);font-weight:500;font-size:11px}

/* ── lightbox with navigation ──────────────────────────────────────────────────────────── */
#lb .lbbar{position:fixed;top:0;left:0;right:0;padding:14px 20px;display:flex;justify-content:space-between;
  align-items:center;color:#fff;font:700 12.5px 'Manrope';background:linear-gradient(180deg,rgba(11,17,32,.85),transparent)}
#lb .nav{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:22px;
  display:grid;place-items:center;cursor:pointer;transition:.15s}
#lb .nav:hover{background:rgba(255,255,255,.2)}
#lb .prev{left:22px}#lb .next{right:22px}

/* ── a reviewer may hold several VAs; these are the tabs between them ──────────────────── */
.vtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.vtab{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px 6px 7px;cursor:pointer;box-shadow:var(--sh1);transition:.15s}
.vtab:hover{border-color:var(--t3)}
.vtab.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:var(--sh2)}
.vtab .av{width:26px;height:26px;flex:0 0 26px;font-size:10px}
.vtab b{font-size:12.5px;font-weight:700}
.vtab small{font-size:10.5px;opacity:.65;font-weight:600}
.vtab.fin .av{background:linear-gradient(135deg,#60a5fa,var(--blue))}

/* ── ASSIGNMENT: ONE SCREEN, NO DRILL-DOWN ─────────────────────────────────────────────────
   The side-list-plus-detail layout meant choosing a reviewer, then assigning, on a page that was
   two-thirds empty. Every reviewer is now a card with its own control: you see the whole team at
   once and assign in place. Unassigned cards sort first, so the work to do is at the top. */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh2);
  padding:16px 17px;display:flex;flex-direction:column;gap:12px;transition:.18s;position:relative;overflow:hidden}
.rcard:hover{box-shadow:var(--sh3);transform:translateY(-2px)}
.rcard:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.rcard.na:before{background:linear-gradient(180deg,#f87171,var(--red))}
.rcard.as:before{background:linear-gradient(180deg,#34d399,var(--green))}
.rcard.sb:before{background:linear-gradient(180deg,#60a5fa,var(--blue))}
.rcard.na{border-color:rgba(220,38,38,.28)}
.rhead{display:flex;align-items:center;gap:11px}
.rhead .av{width:40px;height:40px;flex:0 0 40px;font-size:13.5px}
.rcard.na .av{background:linear-gradient(135deg,#f87171,var(--red))}
.rcard.as .av{background:linear-gradient(135deg,#34d399,var(--green))}
.rcard.sb .av{background:linear-gradient(135deg,#60a5fa,var(--blue))}
.rhead .nm{flex:1;min-width:0}
.rhead .nm b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead .nm span{font-size:11px;color:var(--t3);font-weight:600}
.chip{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px}
.chip .nm{flex:1;min-width:0}
.chip .nm b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .nm span{font-size:10.5px;color:var(--t3);font-weight:600}
.chip .mini{height:4px;background:rgba(15,23,42,.09);border-radius:99px;margin-top:5px;overflow:hidden}
.chip .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--o1),var(--green));border-radius:99px}
.assignrow{display:flex;gap:7px;margin-top:auto}
.assignrow select{flex:1;min-width:0;font-size:12.5px;padding:8px 9px}
.empty{text-align:center;padding:52px 20px;background:var(--card);border:1px dashed var(--line2);border-radius:var(--r)}


/* ── start gate and locked accounts ────────────────────────────────────────────────────── */
.gate{background:linear-gradient(135deg,var(--ink),var(--ink3));color:#fff;border-radius:var(--r);
  padding:34px 30px;text-align:center;box-shadow:var(--sh3);margin-bottom:16px;position:relative;overflow:hidden}
.gate:before{content:'';position:absolute;inset:0;background:radial-gradient(600px 200px at 50% -30%,rgba(255,122,26,.3),transparent 70%)}
.gate .in{position:relative}
.gate h2{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.5px}
.gate p{margin:0 auto 18px;color:rgba(255,255,255,.68);font-size:13.5px;max-width:520px;line-height:1.6}
.gate .facts{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin:18px 0 22px}
.gate .facts div b{display:block;font-size:24px;font-weight:800;letter-spacing:-.6px}
.gate .facts div span{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:rgba(255,255,255,.5);font-weight:700}
.acct.locked{opacity:.72}
.acct.locked .ch button{cursor:not-allowed}
.lockbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 16px;
  background:var(--greenSoft);border-top:1px solid rgba(15,143,95,.25);flex-wrap:wrap}

</style>
</head>
<body>
<div class="wrap">

  <!-- ── SIGN IN ── -->
  <div id="signin" class="card" style="max-width:400px;margin:12vh auto;padding:30px 30px 26px;">
    <div class="av" style="width:44px;height:44px;font-size:15px;margin-bottom:14px;">QA</div>
    <h1 style="font-size:23px;font-weight:800;letter-spacing:-.6px;margin:0 0 3px;">QA Review</h1>
    <div id="si-sub" style="color:var(--t2);font-size:13px;margin-bottom:18px;">Sign in with your Employee ID and PIN.</div>
    <div style="display:grid;gap:9px;">

      <input id="si-pin" type="password" placeholder="PIN / password">

  <!-- ── APP ── -->
  <div id="app" style="display:none;">
    <div class="top"><div class="inner">
      <div>
        <h1>QA Review</h1>
        <p class="sub">Human review of the screenshots your team actually submitted — the full checklist, account by account.</p>
      </div>
      <div class="who">
        <span class="av" id="who-av"></span>
        <span class="nmw" id="who"></span>
        <button class="btn sm" onclick="signOut()" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff;box-shadow:none;">Sign out</button>
      </div>
    </div></div>

    <div class="bar">
      <div class="fld"><label>Month</label><input type="month" id="f-month" onchange="reload()"></div>
      <div class="fld"><label>Week</label><select id="f-week" onchange="reload()"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
      <div class="seg" style="margin-left:auto;">
        <button id="tab-mine" onclick="setTab('mine')">My review</button>
        <button id="tab-board" onclick="setTab('board')" style="display:none;">Assignment board</button>
        <button id="tab-results" onclick="setTab('results')" style="display:none;">Results</button>
        <button id="tab-disputes" onclick="setTab('disputes')" style="display:none;">Disputes</button>
        <button id="tab-panel" onclick="setTab('panel')" style="display:none;">🎲 Panel</button>
      </div>
    </div>

    <div id="pane-board" style="display:none;"></div>
    <div id="pane-results" style="display:none;"></div>
    <div id="pane-disputes" style="display:none;"></div>

<div id="lb">
  <div class="lbbar"><span id="lb-cap"></span><span style="opacity:.6;">← → to move · Esc to close</span></div>

  <div class="ring" id="dk-ring"><i id="dk-pct">0%</i></div>
  <div class="lbl" id="dk-lbl"></div>

    <span style="font-size:11px;color:rgba(255,255,255,.5);"><span class="kbd">P</span><span class="kbd">F</span><span class="kbd">N</span> mark · <span class="kbd">↑</span><span class="kbd">↓</span> move</span>
    <button class="btn g" id="dk-submit" onclick="submitAll()">Submit review</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script>
var PORTAL_URL = "https://script.google.com/macros/s/AKfycbwK8rVJlkv5YLgNLe7cGIz73KJc0hedmZcutoiRviDEowiZPglzBnznswBaZ0TVIV8t/exec";
/* Same admin password as the QA Computer — taken from there rather than set
   separately, so there is only ever one thing to change. */
/* ── ADMIN SIGN-IN — verified SERVER-SIDE, no password in this file ──
   These pages live in a public repo and anyone can view-source the live site, so the
   admin password must never appear here. The portal Apps Script checks it against a
   Script Property (ADMIN_PASS) and answers yes/no. */
async function verifyAdminPass(p){
  try{ var r=await fetch('https://script.google.com/macros/s/AKfycbwK8rVJlkv5YLgNLe7cGIz73KJc0hedmZcutoiRviDEowiZPglzBnznswBaZ0TVIV8t/exec?action=verify_admin&pass='+encodeURIComponent(p)+'&_='+Date.now()); var d=await r.json(); return !!(d&&d.ok); }
  catch(e){ return false; }
}
var USER=null, ISADMIN=false, ISPANEL=false, TAB='mine', UNITS=[], BOARD=null, ADMIN_PIN='';
/* Reviewer access gate. The admin opens/closes the tool from the admin console; this
   dashboard reads that live state from the backend. Default is CLOSED, so VAs are
   refused at sign-in until the admin opens the cycle. Admins can always sign in. */
var QA_REVIEW_OPEN = false;   // cached; refreshed from the backend on load and at sign-in
function _applyQaSub(){
  var s=document.getElementById('si-sub'); if(!s) return;
  s.textContent = QA_REVIEW_OPEN
    ? 'Sign in with your Employee ID and PIN.'
    : 'Reviewing is closed right now — admin access only.';
}
async function fetchQaOpen(){
  try{ var r=await fetch(PORTAL_URL+'?action=qa_review_open_get&_='+Date.now());
       var d=await r.json(); QA_REVIEW_OPEN=!!(d&&d.open); }catch(e){}
  _applyQaSub(); return QA_REVIEW_OPEN;
}
document.addEventListener('DOMContentLoaded', fetchQaOpen);
function $(id){ return document.getElementById(id); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); setTimeout(function(){ t.classList.remove('on'); },2200); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function curMonth(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
function _monLabel(m){ var a=String(m||'').split('-'); if(a.length<2) return m||''; var N=['','January','February','March','April','May','June','July','August','September','October','November','December']; return (N[+a[1]]||a[1])+' '+a[0]; }
function _prevMon(m){ var a=String(m||'').split('-'); if(a.length<2) return ''; var y=+a[0], mo=+a[1]-1; if(mo<1){ mo=12; y--; } return y+'-'+('0'+mo).slice(-2); }
function switchDispMonth(pm){ var f=$('f-month'); if(f) f.value=pm; loadAllDisputes(); }

/* Proof arrives either as a Supabase URL (current) or a Drive file id (older rows). Both have to
   render, or a reviewer looking at an older week sees empty boxes and marks work as missing. */
function imgSrc(u){
  u=String(u||'');
  if(/^https?:\/\//i.test(u)) return u;
  return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(u)+'&sz=w1000';
}
function zoom(u){ $('lb-img').src=imgSrc(u); $('lb').style.display='flex'; }

/* ── SIGN IN ─────────────────────────────────────────────────────────────────────────────── */
async function signIn(){
  var id=($('si-id').value||'').trim(), pin=($('si-pin').value||'').trim();
  var err=$('si-err'); err.style.display='none';
  if(!id||!pin){ err.style.display='block'; err.textContent='Enter your ID and PIN.'; return; }
  if(id.toUpperCase()==='ADMIN'){
    if(await verifyAdminPass(pin)){ ADMIN_PIN=pin; USER={id:'ADMIN',name:'Admin'}; ISADMIN=true; start(); }
    else { err.style.display='block'; err.textContent='Incorrect admin password.'; }
    return;
  }
  /* BLIND PANEL seat sign-in: ID = PANEL, PIN = the seat password (typed by the admin
     at the panelist's desk). The seat identity comes back from the server. */
  if(id.toUpperCase()==='PANEL'){
    var openNowP = await fetchQaOpen();
    if(!openNowP){ err.style.display='block'; err.textContent='QA reviewing is closed right now.'; return; }
    try{
      var pd=await (await fetch(PORTAL_URL+'?action=qa2_panel_login&pass='+encodeURIComponent(pin)+'&_='+Date.now())).json();
      if(pd&&pd.ok){ USER={ id:pd.seat, name:pd.label||('Blind Panel '+String(pd.seat).slice(-1)) }; ISADMIN=false; ISPANEL=true; start(); }
      else { err.style.display='block'; err.textContent='Incorrect panel password.'; }
    }catch(e2){ err.style.display='block'; err.textContent='Network error — try again.'; }
    return;
  }
  // Reviewing closed → only admin may open the dashboard. Check the LIVE state.
  var openNow = await fetchQaOpen();
  if(!openNow){
    err.style.display='block';
    err.textContent='QA reviewing is closed right now. The dashboard is available to admins only.';
    return;
  }
  var b=$('si-btn'); b.disabled=true; b.textContent='Checking…';
  try{
    var d=await (await fetch(PORTAL_URL+'?id='+encodeURIComponent(id)+'&pin='+encodeURIComponent(pin)+'&_='+Date.now())).json();
    b.disabled=false; b.textContent='Sign in';
    if(!d||d.error){ err.style.display='block'; err.textContent=(d&&d.error==='WRONG_PIN')?'Incorrect PIN.':'Employee not found.'; return; }
    USER={ id:d.employee_id, name:d.full_name||d.employee_id }; ISADMIN=false;
    start();
  }catch(e){ b.disabled=false; b.textContent='Sign in'; err.style.display='block'; err.textContent='Network error — try again.'; }
}
function signOut(){ location.reload(); }
function initials(n){ return String(n||'?').split(/[\s,]+/).filter(Boolean).slice(0,2).map(function(x){ return x[0]; }).join('').toUpperCase(); }
/* A notification links straight here with the period attached, so tapping it lands on the right
   week rather than defaulting to today — a review assigned near a month boundary would otherwise
   open on an empty period and look broken. */
function applyUrlParams(){
  try{
    var q=new URLSearchParams(location.search);
    var m=q.get('month'), w=q.get('week'), va=q.get('va');
    if(m && /^\d{4}-\d{2}$/.test(m)) $('f-month').value=m;
    if(w && /^[1-4]$/.test(w)) $('f-week').value=w;
    if(va && ISADMIN) VIEW_EMP=va;
  }catch(e){}
}
function start(){
  $('signin').style.display='none'; $('app').style.display='block';
  $('who').innerHTML=esc(USER.name)+'<small>'+esc(USER.id)+'</small>';
  $('who-av').textContent=initials(USER.name);
  $('f-month').value=curMonth();
  applyUrlParams();
  if(ISADMIN){ $('tab-board').style.display=''; $('tab-results').style.display=''; $('tab-disputes').style.display=''; $('tab-panel').style.display=''; setTab('board'); }
  else { setTab('mine'); }
}
function setTab(t){ TAB=t;
  $('pane-board').style.display=(t==='board')?'block':'none';
  $('pane-mine').style.display=(t==='mine')?'block':'none';
  $('pane-results').style.display=(t==='results')?'block':'none';
  $('pane-disputes').style.display=(t==='disputes')?'block':'none';
  $('pane-panel').style.display=(t==='panel')?'block':'none';
  $('tab-mine').className=(t==='mine')?'on':'';
  $('tab-board').className=(t==='board')?'on':'';
  $('tab-results').className=(t==='results')?'on':'';
  $('tab-disputes').className=(t==='disputes')?'on':'';
  if($('tab-panel')) $('tab-panel').className=(t==='panel')?'on':'';
  reload();
}
function reload(){
  VIEW_EMP='';
  if(TAB==='panel'){ loadPanel(); return; }
  if(TAB==='board') loadBoard();
  else if(TAB==='results') loadResults();
  else if(TAB==='disputes') loadAllDisputes();
  else loadMine();
}

/* ── ALL DISPUTES (every week) ──────────────────────────────────────────────────────────────
   The Results tab shows disputes for the selected WEEK only. This tab drops the week filter so
   every open dispute a VA has filed this month — week 1 through 4 — is in one list to clear. */
async function loadAllDisputes(){
  var p=$('pane-disputes'); p.innerHTML='<div class="card">Loading disputes…</div>';
  var m=$('f-month').value||curMonth();
  try{
    // No week param → qa2_disputes returns EVERY week for the month.
    var D=await (await fetch(PORTAL_URL+'?action=qa2_disputes&month='+encodeURIComponent(m)+'&pass='+encodeURIComponent(ADMIN_PIN)+'&_='+Date.now())).json();
    if(!D||!D.ok){ p.innerHTML='<div class="warn">'+esc((D&&D.error)||'Could not load disputes')+'</div>'; return; }
    var rows=(D.rows||[]).slice().sort(function(a,b){
      if((a.status==='open')!==(b.status==='open')) return a.status==='open'?-1:1;
      return String(b.created_at||'').localeCompare(String(a.created_at||''));
    });
    var open=rows.filter(function(x){ return x.status==='open'; });
    var h='<div class="card"><h3 style="margin:0 0 4px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--t3);font-weight:800;">Disputes · '+esc(m)+' · all weeks</h3>'
      +'<div style="font-size:12.5px;color:var(--t2);margin-bottom:10px;">'
      +'<b style="color:var(--red)">'+open.length+' open</b> · '+(rows.length-open.length)+' resolved · '+rows.length+' total</div>'
      +((rows.length-open.length)>0?'<button class="btn p sm" onclick="emailDisputeResults()" style="margin-bottom:10px;margin-right:6px;">✉ Email results to VAs</button>':'')
      +(open.length>0?'<button class="btn sm" onclick="viewOpenEvidence()" style="margin-bottom:10px;">🔍 View evidence (open cases)</button>':'');
    if(!rows.length){ var pm=_prevMon(m);
      h+='<div style="color:var(--t3);font-size:13.5px;padding:14px 0;">No disputes filed for <b>'+_monLabel(m)+'</b>.'
        +(pm?(' <span style="color:var(--t2)">Finalizing a previous cutoff?</span> <button class="btn sm" style="margin-left:4px;" onclick="switchDispMonth(\''+pm+'\')">View '+_monLabel(pm)+' instead</button>'):'')
        +'</div></div>'; p.innerHTML=h; return; }
    rows.forEach(function(d){
      var st=d.status||'open', isOpen=st==='open';
      h+='<div style="border:1px solid '+(isOpen?'rgba(220,38,38,.35)':'var(--line)')+';border-radius:11px;padding:12px 14px;margin-bottom:9px;'+(isOpen?'background:rgba(220,38,38,.03);':'')+'">'
        +'<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;"><div>'
        +'<b style="font-size:13.5px;">'+esc(d.name||d.employee_id)+'</b>'
        +(d.week?' <span class="tag" style="background:var(--orange,#f26623);color:#fff;">Week '+esc(d.week)+'</span>':'')
        +' disputes <b>'+esc(d.criterion)+'</b>'
        +'<div style="font-size:11.5px;color:var(--t3);margin-top:2px;">'+esc(d.task||'')+(d.account?' · '+esc(d.account):'')+' · reviewed by '+esc(d.reviewer||'—')+(d.created_at?' · '+esc(d.created_at):'')+'</div>'
        +(d.reason?'<div style="font-size:12.5px;color:var(--t2);margin-top:6px;">"'+esc(d.reason)+'"</div>':'')
        +'</div><div style="display:flex;gap:7px;align-items:flex-start;flex-wrap:wrap;">'
        +(isOpen
          ? '<button class="btn g sm" onclick="resolveDispute(\''+esc(d.id)+'\',\'upheld\')">Uphold — VA is right</button>'
            +'<button class="btn sm" onclick="resolveDispute(\''+esc(d.id)+'\',\'rejected\')">Reject — finding stands</button>'
          : '<span class="pill '+(st==='upheld'?'done':'none')+'">'+esc(st)+'</span>')
        +'</div></div></div>';
    });
    h+='<div style="font-size:11.5px;color:var(--t3);margin-top:4px;">Upholding flips that criterion to a pass, rewrites the week score, and docks the reviewer 10%. The VA is told either way.</div></div>';
    p.innerHTML=h;
  }catch(e){ p.innerHTML='<div class="warn">Network error loading disputes.</div>'; }
}

/* ── ADMIN: PLAN AND ASSIGN ──────────────────────────────────────────────────────────────── */
var SEL_VA='', SEL_REV='';
/* ── RESULTS ─────────────────────────────────────────────────────────────────────────────────
   The admin's answer to three questions in one screen: what did everyone score, can the
   reviewers themselves be trusted, and is anything disputed. Scores here are already on the
   scorecard — this is where they get inspected, challenged, and explained. */
async function loadResults(){
  var p=$('pane-results'); p.innerHTML='<div class="card">Loading results…</div>';
  var m=$('f-month').value||curMonth(), w=$('f-week').value||'1';
  try{
    var _ap='&pass='+encodeURIComponent(ADMIN_PIN);   // admin-only endpoints: send the verified pass
    var qs='month='+encodeURIComponent(m)+'&week='+encodeURIComponent(w)+'&_='+Date.now();
    var rs=await Promise.all([
      fetch(PORTAL_URL+'?action=qa2_results&'+qs+_ap).then(function(r){return r.json();}),
      fetch(PORTAL_URL+'?action=qa2_disputes&'+qs+_ap).then(function(r){return r.json();})
    ]);
    var R=rs[0], D=rs[1];
    if(!R||!R.ok){ p.innerHTML='<div class="warn">'+esc((R&&R.error)||'Could not load results')+'</div>'; return; }
    var h='';

    // ── disputes first: they are the thing waiting on the admin ──
    var open=(D&&D.rows||[]).filter(function(x){ return x.status==='open'; });
    if(open.length){
      h+='<div class="card" style="border-color:rgba(220,38,38,.35);">'
        +'<h3 style="margin:0 0 10px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--red);font-weight:800;">'
        +open.length+' dispute'+(open.length>1?'s':'')+' waiting on you</h3>';
      open.forEach(function(d){
        h+='<div style="border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;">'
          +'<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">'
          +'<div><b style="font-size:13.5px;">'+esc(d.name)+'</b> disputes <b>'+esc(d.criterion)+'</b>'
          +'<div style="font-size:11.5px;color:var(--t3);margin-top:2px;">'+esc(d.task)+' · '+esc(d.account||'')+' · reviewed by '+esc(d.reviewer||'—')+'</div>'
          +'<div style="font-size:12.5px;color:var(--t2);margin-top:6px;">“'+esc(d.reason)+'”</div></div>'
          +'<div style="display:flex;gap:7px;align-items:flex-start;flex-wrap:wrap;">'
          +'<button class="btn g sm" onclick="resolveDispute(\''+esc(d.id)+'\',\'upheld\')">Uphold — VA is right</button>'
          +'<button class="btn sm" onclick="resolveDispute(\''+esc(d.id)+'\',\'rejected\')">Reject — finding stands</button>'
          +'</div></div></div>';
      });
      h+='<div style="font-size:11.5px;color:var(--t3);">Upholding flips that criterion to pass and rewrites the week score. Either way the VA is told.</div></div>';
    }

    // ── per-VA scores ──
    h+='<div class="card"><h3 style="margin:0 0 10px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--t3);font-weight:800;">Scores — week '+esc(w)+'</h3>'
      +'<table><tr><th>VA</th><th>Score</th><th>Checks</th><th>Findings</th><th>Reviewer</th><th>Status</th><th></th></tr>';
    (R.rows||[]).forEach(function(r){
      var sc=(r.score===''||r.score==null)?'—':r.score;
      h+='<tr><td><b>'+esc(r.name)+'</b><br><span style="color:var(--t3);font-size:11px;">'+esc(r.employee_id)+'</span></td>'
        +'<td><b style="font-size:15px;color:'+(sc==='—'?'var(--t3)':(sc>=85?'var(--green)':(sc>=70?'var(--amber)':'var(--red)')))+';">'+sc+'</b></td>'
        +'<td style="font-size:12px;">'+r.passed+' / '+r.total+'</td>'
        +'<td>'+((r.fails||[]).length||'—')+(r.open_disputes?(' <span class="tag" style="background:var(--redSoft);color:#991b1b;">'+r.open_disputes+' disputed</span>'):'')+'</td>'
        +'<td style="font-size:12px;">'+esc(r.reviewer||'—')+'</td>'
        +'<td>'+(r.complete?'<span class="pill done">submitted</span>':'<span class="pill none">'+r.submitted+'/'+r.units+'</span>')+'</td>'
        +'<td>'+(r.complete?('<button class="btn sm" onclick="emailFindings(\''+esc(r.employee_id)+'\',\''+esc(r.name)+'\','+((r.fails||[]).length)+')">Email findings</button>'):'')+'</td></tr>';
    });
    h+='</table>'
      +'<div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;">'
      +'<button class="btn p" onclick="emailAll()">Email all findings</button>'
      +'<span style="font-size:11.5px;color:var(--t3);">One email per submitted review — only what failed, with a dispute link on every item. Shows you the list before sending.</span>'
      +'</div></div>';

    p.innerHTML=h;
  }catch(e){ p.innerHTML='<div class="warn">'+esc(e.message)+'</div>'; }
}
/* Everyone at once. Dry first — the exact list of who gets what, and who is skipped and why —
   then send on confirmation. A batch that quietly drops people is how someone never learns
   their score, so skips are shown, not swallowed. */
/* ── VIEW SCREENSHOT EVIDENCE FOR OPEN DISPUTES ──
   For each open dispute, pull that VA's reviewed units for the disputed week (qa2_list) and show
   the exact screenshots the reviewer saw, grouped by account — so a ruling can rest on the evidence. */
function _evdCollect(b,acc){ if(!b)return; if(typeof b==='string'){ if(/^https?:\/\//.test(b))acc.push(b); return;} if(Array.isArray(b)){b.forEach(function(x){_evdCollect(x,acc);});return;} if(typeof b==='object'){Object.keys(b).forEach(function(k){_evdCollect(b[k],acc);});return;} }
async function viewOpenEvidence(){
  var m=$('f-month').value||curMonth();
  var ov=document.getElementById('evd-ov'); if(ov) ov.remove();
  ov=document.createElement('div'); ov.id='evd-ov';
  ov.style.cssText='position:fixed;inset:0;background:#0b1020;z-index:100000;overflow:auto;color:#e8ecf4;font-family:system-ui,sans-serif;';
  ov.innerHTML='<div style="padding:40px;text-align:center;">Loading evidence…</div>';
  document.body.appendChild(ov);
  try{
    var dd=await (await fetch(PORTAL_URL+'?action=qa2_disputes&month='+encodeURIComponent(m)+'&pass='+encodeURIComponent(ADMIN_PIN)+'&_='+Date.now())).json();
    var gg=await (await fetch(PORTAL_URL+'?action=get_all_qa_disputes&status=all&_='+Date.now())).json();
    var wk={}; ((gg&&gg.disputes)||[]).forEach(function(x){ wk[x.id]=x.week; });
    var open=((dd&&dd.rows)||[]).filter(function(x){return x.status==='open';})
      .map(function(x){ return { emp:x.employee_id, name:String(x.name||x.employee_id).split(',')[0], acct:x.account||x.task||'', crit:x.criterion, week:wk[x.id]||'' }; });
    if(!open.length){ ov.innerHTML='<div style="padding:40px;text-align:center;">No open disputes. <button onclick="document.getElementById(\'evd-ov\').remove()" style="margin-left:10px;">Close</button></div>'; return; }

async function resolveDispute(id, outcome){
  var word=(outcome==='upheld')?'UPHOLD this dispute? The finding flips to pass and the week score is rewritten.':'REJECT this dispute? The original finding stands.';
  var note='';
  if(outcome==='rejected'){ note=prompt(word+'\n\nOptional: a sentence for the VA on why.')||''; if(note===null) return; }
  else if(!confirm(word)) return;
  try{
    var d=await (await fetch(PORTAL_URL+'?action=qa2_resolve&id='+encodeURIComponent(id)+'&outcome='+encodeURIComponent(outcome)
      +'&by='+encodeURIComponent(USER.name)+'&note='+encodeURIComponent(note)+'&_='+Date.now())).json();
    if(d&&d.ok) toast(outcome==='upheld'?('Upheld'+(d.score!==''?(' — score now '+d.score):'')):'Rejected — finding stands');
    else toast('Failed: '+((d&&d.error)||'unknown'));
    reload();   // refresh whichever tab you're on (Results or Disputes)
  }catch(e){ toast('Failed: '+e.message); }
}

/* WHO IS REVIEWING WHOM.
   The board is organised around the REVIEWER, because that is the decision being made: you are
   handing people out to reviewers, not the other way round. A reviewer is red until they have
   somebody to review, green once they do, blue when they have finished. */
function reviewerLoad(){
  var load={};
  (BOARD.rows||[]).forEach(function(r){
    if(!r.reviewer_id) return;
    (load[r.reviewer_id]=load[r.reviewer_id]||[]).push({ name:r.name, id:r.employee_id, done:r.complete, units:r.units, doneN:r.done });
  });
  return load;
}
function revState(a){ if(!a || !a.length) return 'na'; return a.every(function(x){ return x.done; })?'sb':'as'; }
function revTag(a){ if(!a || !a.length) return 'NO ONE ASSIGNED'; return a.every(function(x){ return x.done; })?'FINISHED':'REVIEWING'; }
function vaState(r){ return r.complete?'sb':(r.reviewer_id?'as':'na'); }
function vaTag(r){ return r.complete?'REVIEWED':(r.reviewer_id?'COVERED':'NOT COVERED'); }

function renderBoard(){
  var d=BOARD, p=$('pane-board'), load=reviewerLoad();
  var revs=(d.reviewers||[]).slice();
  var withWork=revs.filter(function(x){ return (load[x.employee_id]||[]).length; }).length;
  var idle=revs.length-withWork;
  var uncovered=d.rows.filter(function(r){ return !r.reviewer_id; });

  var h='<div class="stat">'+
    '<div class="st r"><b>'+idle+'</b><span>reviewers free</span></div>'+
    '<div class="st g"><b>'+withWork+'</b><span>reviewers assigned</span></div>'+
    '<div class="st'+(uncovered.length?' a':'')+'"><b>'+uncovered.length+'</b><span>VAs not covered</span></div>'+
    '<div class="st"><b>'+d.rows.reduce(function(n,r){return n+r.units;},0)+'</b><span>accounts</span></div>'+
    '<div class="st"><b>'+d.rows.reduce(function(n,r){return n+r.shots;},0)+'</b><span>screenshots</span></div></div>';

  h+='<div class="bar"><button class="btn" onclick="planWeek(1)">Preview plan</button>'+
     '<button class="btn" onclick="planWeek(0)">Rebuild plan</button>'+
     '<button class="btn p" onclick="shuffleReviewers()" title="Auto-assign every unassigned VA a peer reviewer — never the same reviewer they had in an earlier week this month">🎲 Auto-shuffle reviewers</button>'+
     '<button class="btn" onclick="notifyAll()" title="Send each reviewer a message with a direct link to their review">Notify reviewers</button>';
  if(uncovered.length) h+='<span class="tag" style="background:var(--redSoft);color:#991b1b;">'+
     uncovered.length+' VA'+(uncovered.length>1?'s':'')+' still need a reviewer: '+
     esc(uncovered.slice(0,3).map(function(r){ return r.name; }).join(', '))+(uncovered.length>3?' …':'')+'</span>';
  else h+='<span class="tag" style="background:var(--greenSoft);color:#075f43;">Everyone is covered</span>';
  h+='</div>';

  /* Free reviewers first — the cards that need you are the ones at the top. */
  revs.sort(function(a,b){
    var A=(load[a.employee_id]||[]).length?1:0, B=(load[b.employee_id]||[]).length?1:0;
    return A-B || String(a.name).localeCompare(String(b.name));
  });

  h+='<div class="rgrid">';
  revs.forEach(function(x){
    var mine=load[x.employee_id]||[], st=revState(mine);
    var opts=d.rows.filter(function(r){ return r.employee_id!==x.employee_id && !r.complete && r.reviewer_id!==x.employee_id; })
      .map(function(r){
        return '<option value="'+esc(r.employee_id)+'">'+esc(r.name)+' · '+r.units+' accounts'+
               (r.reviewer_id?('  (with '+esc(r.reviewer)+')'):'  (free)')+'</option>';
      }).join('');
    h+='<div class="rcard '+st+'">'+
       '<div class="rhead"><span class="av">'+esc(initials(x.name))+'</span>'+
       '<span class="nm"><b>'+esc(x.name)+'</b><span>'+esc(x.employee_id)+'</span></span>'+
       '<span class="tag '+(st==='na'?'':'')+'" style="background:'+
         (st==='na'?'var(--redSoft);color:#991b1b':(st==='sb'?'var(--blueSoft);color:#1d4ed8':'var(--greenSoft);color:#075f43'))+';">'+
         revTag(mine)+'</span></div>';
    if(mine.length){
      mine.forEach(function(y){
        var pct=y.units?Math.round((y.doneN||0)/y.units*100):0;
        h+='<div class="chip"><span class="av" style="width:28px;height:28px;flex:0 0 28px;font-size:10px;">'+esc(initials(y.name))+'</span>'+
           '<span class="nm"><b>'+esc(y.name)+'</b><span>'+(y.doneN||0)+' of '+y.units+' accounts checked</span>'+
           '<span class="mini"><i style="width:'+pct+'%"></i></span></span>'+
           (y.done?'<span class="tag" style="background:var(--blueSoft);color:#1d4ed8;">DONE</span>'
                  :'<button class="btn sm" onclick="assign(\''+esc(y.id)+'\',\'\')">Remove</button>')+
           '<button class="btn sm" onclick="openReview(\''+esc(y.id)+'\')">Open</button></div>';
      });
    } else {
      h+='<div style="font-size:12.5px;color:var(--t3);padding:2px 0;">No one assigned yet.</div>';
    }
    h+='<div class="assignrow"><select id="s-'+esc(x.employee_id)+'">'+
       (opts||'<option value="">— no one left to assign —</option>')+'</select>'+
       '<button class="btn p" '+(opts?'':'disabled')+' onclick="assign($(\'s-'+esc(x.employee_id)+'\').value,\''+esc(x.employee_id)+'\')">Assign</button></div>';
    h+='</div>';
  });
  h+='</div>';
  p.innerHTML=h;
}

/* 🎲 One click assigns everyone: peer reviewers, balanced load, no self-review, and nobody
   gets the reviewer they already had in an earlier week of the month. Existing/submitted
   assignments are kept — this only fills the gaps. */
async function shuffleReviewers(){
  var m=$('f-month').value||curMonth(), w=$('f-week').value||'1';
  if(!confirm('Auto-shuffle reviewers for week '+w+'?\n\n· fills every UNASSIGNED VA (existing assignments are kept)\n· never the same reviewer as their earlier weeks this month\n· load balanced across the team\n\nEach reviewer is notified with their link.')) return;
  toast('Shuffling…');
  try{
    var d=await (await fetch(PORTAL_URL+'?action=qa2_shuffle&month='+encodeURIComponent(m)+'&week='+encodeURIComponent(w)+'&_='+Date.now())).json();
    if(d&&d.ok){
      toast('🎲 '+d.assigned+' reviewer'+(d.assigned===1?'':'s')+' assigned'+(d.kept?(' · '+d.kept+' kept'):'')+
        ((d.repeats&&d.repeats.length)?(' · '+d.repeats.length+' repeat(s) unavoidable'):''));
      if(d.repeats&&d.repeats.length) console.log('Unavoidable repeats:', d.repeats);
      loadBoard();
    } else toast('Shuffle failed: '+((d&&(d.message||d.error))||'unknown'));
  }catch(e){ toast('Shuffle failed: '+e.message); }
}
/* A VA has exactly one reviewer, so assigning someone who already has one MOVES them. That is a
   real change to another person's workload, so it is confirmed rather than silent. */
async function assign(emp, rev){
  try{
    var cur=(BOARD&&BOARD.rows||[]).filter(function(r){ return r.employee_id===emp; })[0];
    if(rev && cur && cur.reviewer_id && cur.reviewer_id!==rev){
      if(!confirm(cur.name+' is currently reviewed by '+cur.reviewer+'.\n\nMove them to the new reviewer? '+
                  'Any accounts already checked are kept.')) { loadBoard(); return; }
    }
  }catch(_e){}
  var m=$('f-month').value||curMonth(), w=$('f-week').value||'1';
  try{
    var d=await (await fetch(PORTAL_URL+'?action=qa2_assign&month='+encodeURIComponent(m)+'&week='+encodeURIComponent(w)+
      '&employee_id='+encodeURIComponent(emp)+'&reviewer_id='+encodeURIComponent(rev)+'&_='+Date.now())).json();
    if(d&&d.ok) toast(rev?(d.reviewer+' assigned to '+emp+' ('+d.units+' accounts)'):('Unassigned '+emp));
    else toast('Failed: '+((d&&d.message)||(d&&d.error)||'unknown'));
    loadBoard();
  }catch(e){ toast('Failed: '+e.message); }
}

async function loadMine(){

     the request went out with a blank employee id and simply failed. */

    p.innerHTML='<div class="card">Loading…</div>';

      var b=await (await fetch(PORTAL_URL+'?action=qa2_board&month='+encodeURIComponent(m)+'&week='+encodeURIComponent(w)+'&_='+Date.now())).json();
      var rows=(b&&b.rows)||[];
      if(!rows.length){ p.innerHTML='<div class="card">No plan for this week yet — build one on the assignment board.</div>'; return; }
      p.innerHTML='<div class="card"><b>Open a review</b><div class="sub" style="margin:4px 0 9px;">Admins can read any review. Reviewers see only their own.</div>'+
        '<select id="adm-va" style="min-width:260px;">'+rows.map(function(r){
          return '<option value="'+esc(r.employee_id)+'">'+esc(r.name)+' ('+esc(r.employee_id)+') — '+r.units+' accounts'+(r.reviewer?(' · reviewer: '+esc(r.reviewer)):' · unassigned')+'</option>';
        }).join('')+'</select> <button class="btn p" onclick="VIEW_EMP=$(\'adm-va\').value; loadMine();">Open</button></div>';
      return;
    }catch(e){ p.innerHTML='<div class="warn">'+esc(e.message)+'</div>'; return; }
  }
  p.innerHTML='<div class="card">Loading review…</div>';
  var q=ISADMIN ? ('&employee_id='+encodeURIComponent(VIEW_EMP)) : ('&reviewer_id='+encodeURIComponent(USER.id));
  try{
    var d=await (await fetch(PORTAL_URL+'?action=qa2_list&month='+encodeURIComponent(m)+'&week='+encodeURIComponent(w)+q+'&_='+Date.now())).json();
    if(!d||!d.ok){ p.innerHTML='<div class="warn">'+esc((d&&d.error)||'Could not load')+'</div>'; return; }
    ALL_UNITS=d.rows||[];
    /* DOUBLE-BLIND: a panel seat never sees whose work this is — names become Case 1..N. */
    if(ISPANEL){ var _cm={}, _ci=0; ALL_UNITS.forEach(function(u){ var k=String(u.employee_id||'').toUpperCase(); if(!_cm[k]) _cm[k]='Case '+(++_ci); u.full_name=_cm[k]; }); }
    if(!ALL_UNITS.length){ p.innerHTML='<div class="card" style="text-align:center;padding:44px 20px;">'+
      '<div class="av" style="width:46px;height:46px;font-size:16px;margin:0 auto 12px;">QA</div>'+
      '<b style="font-size:16px;">Nothing assigned to you</b>'+
      '<div style="color:var(--t2);font-size:13px;margin-top:4px;">for '+esc(m)+' week '+esc(w)+'</div></div>'; 
      $('dock').style.display='none'; return; }
    renderMine();
  }catch(e){ p.innerHTML='<div class="warn">'+esc(e.message)+'</div>'; }
}
var VIEW_EMP='';   // admin only: whose review is open
var ALL_UNITS=[];  // everything assigned to this reviewer, across every VA they hold
var MY_VA='';      // the VA currently open
var LBSETS={};     // account id -> every screenshot in it, for arrow-key navigation

function checksDone(u){
  /* An account whose task has no checklist mapped cannot be answered at all. Treating it as
     unfinished blocked the whole review on something the reviewer has no way to fix — it is
     flagged in red on the card instead, for the admin to map. */
  var c=(u.criteria||[]).length; if(!c) return true;
  var n=0; (u.criteria||[]).forEach(function(cr){ if(u.verdicts && u.verdicts[cr]) n++; });
  return n>=c;
}
function unitDone(u){ return checksDone(u); }
/* One VA is reviewed by exactly one reviewer, but a reviewer may hold several VAs. So the
   reviewer's queue is grouped by person and reviewed one person at a time — mixing two VAs into
   one list would also have meant Submit finishing only the first of them. */
function myVAs(){
  var seen=[], by={};
  ALL_UNITS.forEach(function(u){
    if(!by[u.employee_id]){ by[u.employee_id]={ id:u.employee_id, name:u.full_name, units:[] }; seen.push(by[u.employee_id]); }
    by[u.employee_id].units.push(u);
  });
  return seen;
}
function renderMine(){
  var p=$('pane-mine');
  var vas=myVAs();
  if(!MY_VA || !vas.filter(function(v){ return v.id===MY_VA; }).length) MY_VA=vas[0].id;
  UNITS=vas.filter(function(v){ return v.id===MY_VA; })[0].units;
  var va=UNITS[0];
  var doneN=UNITS.filter(unitDone).length;
  var submitted=UNITS.every(function(u){ return u.status==='submitted'; });
  var totalShots=UNITS.reduce(function(n,u){ return n+(u.shots||0); },0);
  var started=UNITS.some(function(u){ return u.started_at; });
  var h='';
  if(!started && !submitted){
    var shots=UNITS.reduce(function(n,u){ return n+(u.shots||0); },0);
    p.innerHTML='<div class="gate"><div class="in">'+
      '<div class="av" style="width:52px;height:52px;font-size:18px;margin:0 auto 14px;">'+esc(initials(va.full_name))+'</div>'+
      '<h2>Review '+esc(va.full_name)+'</h2>'+
      '<p>You will see every screenshot they submitted for the accounts below, grouped by day, with the full checklist beside them.</p>'+
      '<div class="facts">'+
        '<div><b>'+UNITS.length+'</b><span>accounts</span></div>'+
        '<div><b>'+shots+'</b><span>screenshots</span></div>'+
      '</div>'+
      '<p style="color:rgba(255,255,255,.8);font-size:12.5px;">Once you mark an account reviewed it <b>locks</b> and cannot be changed. '+
      'Take the time to look properly — the score goes on this person\'s record.</p>'+
      '<button class="btn p" style="padding:12px 34px;font-size:14px;" onclick="startReview()">Start review</button>'+
      '</div></div>';
    $('dock').style.display='none';
    return;
  }
  if(vas.length>1){
    h+='<div class="vtabs">'+vas.map(function(v){
      var d=v.units.filter(unitDone).length, fin=v.units.every(function(u){ return u.status==='submitted'; });
      return '<div class="vtab'+(v.id===MY_VA?' on':'')+(fin?' fin':'')+'" onclick="MY_VA=\''+esc(v.id)+'\';CUR_UNIT=\'\';renderMine();">'+
             '<span class="av">'+esc(initials(v.name))+'</span>'+
             '<span><b>'+esc(v.name)+'</b> <small>'+(fin?'submitted':(d+'/'+v.units.length))+'</small></span></div>';
    }).join('')+'</div>';
  }
  h+='<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;">'+
     '<div><b style="font-size:15px;">Reviewing '+esc(va.full_name)+'</b> <span style="color:var(--t3);">'+(ISPANEL?'🎭 blind case':esc(va.employee_id))+'</span>'+
     '<div style="font-size:12px;color:var(--t2);margin-top:2px;">'+UNITS.length+' day samples · '+totalShots+' screenshots · '+doneN+' of '+UNITS.length+' checked</div></div>'+
     '<div>'+(ISADMIN?'<button class="btn sm" onclick="VIEW_EMP=\'\'; loadMine();" style="margin-right:6px;">Change VA</button>':'')+
     (submitted?'<span class="pill done">submitted</span>':
       '<button class="btn g" onclick="submitAll()" '+(doneN<UNITS.length?'disabled':'')+'>Submit review</button>')+'</div></div></div>';
  if(!submitted && doneN<UNITS.length){
    h+='<div class="note">Every sample has to be checked before you can submit — a part-finished review would score this person on whichever days happened to be opened.</div>';
  }

  var lastTask='';
  UNITS.forEach(function(u,i){
    if(u.task!==lastTask){ h+='<h3 style="margin:16px 0 8px;font-size:14px;">'+esc(u.project)+' · '+esc(u.task)+'</h3>'; lastTask=u.task; }
    var isDone=unitDone(u), locked=(u.status==='locked'||u.status==='submitted');
    h+='<div class="acct'+(isDone?' done':'')+'" id="u-'+esc(u.id)+'">'+
       '<div class="ahead"><b>'+esc(u.account)+'</b>'+
       '<span class="dstamp">📅 '+esc((u.days||[]).join(' · '))+'</span>'+
       '<span style="font-size:11.5px;color:var(--t2);">'+u.shots+' screenshot(s)</span>'+
       '<span class="pill '+(isDone?'done':'none')+'" id="p-'+esc(u.id)+'">'+(isDone?'checked':'not checked')+'</span></div>'+
       '<div class="abody"><div>';
    /* One flat list per account so the arrows can walk the whole account, not just one day. */
    var flat=[]; (u.blocks||[]).forEach(function(b){ (b.urls||[]).forEach(function(x){ flat.push({u:x,cap:u.account+' · '+b.day+(b.task?(' · '+b.task):'')}); }); });
    var fi=0;
    (u.blocks||[]).forEach(function(b){
      h+='<div class="dayblk"><h4>📅 '+esc(b.day)+(b.task?(' · '+esc(b.task)):'')+' — '+(b.urls||[]).length+' screenshot(s)</h4><div class="shots">'+
         (b.urls||[]).map(function(x){ var k=fi++;
           return '<img loading="lazy" src="'+esc(imgSrc(x))+'" onclick="zoom(null,LBSETS[\''+esc(u.id)+'\'],'+k+')">'; }).join('')+
         '</div></div>';
    });
    LBSETS[u.id]=flat;
    h+='</div><div class="crit"><h4>Checklist — '+(u.criteria||[]).length+' criteria</h4>';
    if(!(u.criteria||[]).length)
      h+='<div style="font-size:12px;color:var(--red);">No checklist is mapped for this task. Tell the admin — this account cannot be scored.</div>';
    (u.criteria||[]).forEach(function(cr,ci){
      var v=(u.verdicts||{})[cr]||'';
      h+='<div class="citem"><div class="ctext">'+esc(cr)+'</div><div class="ch">'+
        ['pass','fail','na'].map(function(k){
          return '<button class="'+k+(v===k?' on':'')+'"'+(locked?' disabled':'')+' onclick="focusUnit(\''+esc(u.id)+'\','+ci+');setV(\''+esc(u.id)+'\','+ci+',\''+k+'\')">'+(k==='na'?'N/A':k.toUpperCase())+'</button>';
        }).join('')+'</div></div>';
    });
    h+='<div style="margin-top:9px;"><label>Notes</label><textarea id="n-'+esc(u.id)+'" rows="2" style="width:100%;margin-top:3px;" placeholder="Anything the checklist does not cover"'+
       (locked?' disabled':'')+' onchange="saveUnit(\''+esc(u.id)+'\')">'+esc(u.notes||'')+'</textarea></div>';
    h+='</div></div>';
    h+= locked
      ? '<div class="lockbar"><b style="font-size:12.5px;color:#075f43;">Reviewed and locked</b>'+
        '<span style="font-size:11.5px;color:var(--t2);">'+(u.verdicts?Object.keys(u.verdicts).length:0)+' criteria answered</span>'+
        (ISADMIN?'<button class="btn sm" onclick="unlockUnit(\''+esc(u.id)+'\')">Reopen (admin)</button>':'')+'</div>'
      : '<div class="lockbar" style="background:var(--card2);border-top-color:var(--line);">'+
        '<span style="font-size:11.5px;color:var(--t2);">Locks when marked — check before you do.</span>'+
        '<button class="btn g" '+(checksDone(u)?'':'disabled')+' onclick="lockUnit(\''+esc(u.id)+'\')">Mark reviewed</button></div>';
    h+='</div>';
  });
  p.innerHTML=h;
  paintDock();
  if(!CUR_UNIT){ var f=UNITS.filter(function(u){ return !unitDone(u); })[0]; if(f) focusUnit(f.id,0); }
}

function setV(id, ci, val){
  var u=UNITS.filter(function(x){ return x.id===id; })[0]; if(!u) return;
  if(u.status==='locked'||u.status==='submitted'){ toast('This account is locked'); return; }
  var cr=(u.criteria||[])[ci]; if(!cr) return;
  u.verdicts=u.verdicts||{};
  u.verdicts[cr]=(u.verdicts[cr]===val)?'':val;      // click again to clear
  if(!u.verdicts[cr]) delete u.verdicts[cr];
  // repaint just this account's buttons and pill, so the page doesn't jump while reviewing
  var card=$('u-'+id); if(card){
    var items=card.querySelectorAll('.citem');
    if(items[ci]) items[ci].querySelectorAll('button').forEach(function(b){
      var k=b.className.replace(/ on/,'').trim();
      b.className=k+((u.verdicts[cr]===k)?' on':'');
    });
    var pill=$('p-'+id), d=unitDone(u);
    if(pill){ pill.className='pill '+(d?'done':'none'); pill.textContent=d?'checked':'not checked'; }
    card.className='acct'+(d?' done':'');
  }
  saveUnit(id);
  refreshHeader();
  paintDock();
}
function refreshHeader(){
  var doneN=UNITS.filter(unitDone).length;
  var hdr=document.querySelector('#pane-mine .card b'); if(!hdr) return;
  var line=hdr.parentNode.querySelector('div'); if(line)
    line.textContent=UNITS.length+' samples · '+UNITS.reduce(function(n,u){return n+(u.shots||0);},0)+' screenshots · '+doneN+' of '+UNITS.length+' checked';
  var btn=document.querySelector('#pane-mine .btn.g'); if(btn) btn.disabled=(doneN<UNITS.length);
}


/* ── LIGHTBOX WITH NAVIGATION ──────────────────────────────────────────────────────────────
   A reviewer comparing four screenshots from one session was closing and reopening the viewer
   each time. Arrow keys move through every screenshot in the account, captioned with its day. */
var LB=[], LBI=0;
function zoom(u, list, i, cap){
  LB=list||[u]; LBI=(i==null?0:i);
  $('lb').style.display='flex'; lbPaint(cap);
}
function lbPaint(cap){
  var it=LB[LBI]; if(!it) return;
  $('lb-img').src=imgSrc(typeof it==='string'?it:it.u);
  $('lb-cap').textContent=(cap||(typeof it==='object'?it.cap:''))+'  ·  '+(LBI+1)+' of '+LB.length;
}
function lbStep(d){ if(!LB.length) return; LBI=(LBI+d+LB.length)%LB.length; lbPaint(); }
document.addEventListener('keydown', function(e){
  if($('lb').style.display==='flex'){
    if(e.key==='Escape'){ $('lb').style.display='none'; e.preventDefault(); }
    else if(e.key==='ArrowRight'){ lbStep(1); e.preventDefault(); }
    else if(e.key==='ArrowLeft'){ lbStep(-1); e.preventDefault(); }
    return;
  }
  kbd(e);
});
$('lb').onclick=function(){ this.style.display='none'; };

/* ── KEYBOARD REVIEWING ────────────────────────────────────────────────────────────────────
   Thirty minutes of clicking three tiny buttons is the difference between a review that gets
   done properly and one that gets rushed. P / F / N mark the criterion you are on and move to
   the next; arrows move without marking. The active account is whichever one you last touched. */
var CUR_UNIT='', CUR_IDX=0;
function focusUnit(id, idx){
  CUR_UNIT=id; CUR_IDX=idx||0; paintCursor();
}
function paintCursor(){
  document.querySelectorAll('.crit').forEach(function(c){ c.classList.remove('live'); });
  document.querySelectorAll('.citem').forEach(function(c){ c.classList.remove('cur'); });
  var card=$('u-'+CUR_UNIT); if(!card) return;
  var cr=card.querySelector('.crit'); if(cr) cr.classList.add('live');
  var items=card.querySelectorAll('.citem');
  if(items[CUR_IDX]){ items[CUR_IDX].classList.add('cur');
    items[CUR_IDX].scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function kbd(e){
  if(/input|textarea|select/i.test((e.target.tagName||''))) return;
  if(!CUR_UNIT){
    var first=UNITS.filter(function(u){ return !unitDone(u); })[0]||UNITS[0];
    if(!first) return; CUR_UNIT=first.id; CUR_IDX=0;
  }
  var u=UNITS.filter(function(x){ return x.id===CUR_UNIT; })[0]; if(!u) return;
  var n=(u.criteria||[]).length; if(!n) return;
  var k=e.key.toLowerCase(), map={p:'pass',f:'fail',n:'na'};
  if(map[k]){
    setV(CUR_UNIT, CUR_IDX, map[k]);
    if(CUR_IDX<n-1){ CUR_IDX++; } else { nextUnit(); }
    paintCursor(); e.preventDefault();
  } else if(e.key==='ArrowDown'){ CUR_IDX=Math.min(n-1,CUR_IDX+1); paintCursor(); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ CUR_IDX=Math.max(0,CUR_IDX-1); paintCursor(); e.preventDefault(); }
}
function nextUnit(){
  var i=UNITS.map(function(x){ return x.id; }).indexOf(CUR_UNIT);
  for(var j=i+1;j<UNITS.length;j++){ if(!unitDone(UNITS[j])){ CUR_UNIT=UNITS[j].id; CUR_IDX=0;
    var c=$('u-'+CUR_UNIT); if(c) c.scrollIntoView({block:'start',behavior:'smooth'}); return; } }
}

/* ── PROGRESS DOCK ─────────────────────────────────────────────────────────────────────── */
function paintDock(){
  var dock=$('dock'); if(!UNITS.length){ dock.style.display='none'; return; }
  var submitted=UNITS.every(function(u){ return u.status==='submitted'; });
  if(submitted){ dock.style.display='none'; return; }
  var done=UNITS.filter(unitDone).length, tot=UNITS.length;
  var pct=tot?Math.round(done/tot*100):0;
  dock.style.display='block';
  $('dk-ring').style.setProperty('--pct', pct+'%');
  $('dk-pct').textContent=pct+'%';
  $('dk-lbl').innerHTML=esc(UNITS[0].full_name)+'<small>'+done+' of '+tot+' samples checked</small>';
  $('dk-submit').disabled=(done<tot);
}



/* Start is an explicit act: it stamps the clock server-side, so a reviewer cannot answer the
   checklist first and start the timer afterwards. */
async function startReview(){
  var va=UNITS[0]; if(!va) return;
  try{
    var d=await (await fetch(PORTAL_URL+'?action=qa2_start&month='+encodeURIComponent($('f-month').value)+
      '&week='+encodeURIComponent($('f-week').value)+'&employee_id='+encodeURIComponent(va.employee_id)+
      (ISADMIN?'':('&reviewer_id='+encodeURIComponent(USER.id)))+'&_='+Date.now())).json();
    if(d&&d.ok){ ALL_UNITS.forEach(function(u){ if(u.employee_id===va.employee_id && !u.started_at) u.started_at=d.at; });
      CUR_UNIT=''; renderMine(); }
    else toast('Could not start: '+((d&&d.error)||'unknown'));
  }catch(e){ toast('Could not start: '+e.message); }
}

/* Marking an account reviewed locks it. Deliberate, and only once the checks are complete and the
   minimum time is met — both are re-checked on the server. */
async function lockUnit(id){
  var u=UNITS.filter(function(x){ return x.id===id; })[0]; if(!u) return;
  if(!checksDone(u)){ toast('Answer every criterion first'); return; }
  if(!confirm('Mark '+u.account+' as reviewed?\n\nIt locks and cannot be changed afterwards.')) return;
  try{
    var d=await (await fetch(PORTAL_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({ action:'qa2_save', id:id, lock:'1', verdicts:u.verdicts||{},
                            notes:($('n-'+id)||{}).value||'' })})).json();
    if(d&&d.ok){ u.status='locked'; toast('Locked — '+u.account); renderMine(); }
    else toast('Not locked: '+((d&&d.message)||(d&&d.error)||'unknown'));
  }catch(e){
    toast('Not locked — the server did not respond properly. Nothing was lost; try again in a moment.');
  }
}

var SAVET={};
function saveUnit(id){
  clearTimeout(SAVET[id]);
  SAVET[id]=setTimeout(async function(){
    var u=UNITS.filter(function(x){ return x.id===id; })[0]; if(!u) return;
    var nEl=$('n-'+id);
    try{
      var d=await (await fetch(PORTAL_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({ action:'qa2_save', id:id, verdicts:u.verdicts||{},
                              notes:nEl?nEl.value:'' })})).json();
      if(!d||!d.ok) toast('Not saved: '+((d&&d.error)||'unknown'));
    }catch(e){
      /* A server that answers with an HTML error page fails at .json(), which is not a
         connectivity problem — telling the reviewer to check their internet sent them looking in
         the wrong place. Retry once, then say what it actually was. */
      try{
        await new Promise(function(r){ setTimeout(r,1200); });
        var d2=await (await fetch(PORTAL_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({ action:'qa2_save', id:id, verdicts:u.verdicts||{},
            notes:nEl?nEl.value:'' })})).json();
        if(d2&&d2.ok) return;
      }catch(_e2){}
      toast('Not saved — the server did not respond properly. Your answers are still on screen; try again in a moment.');
    }
  }, 700);
}

async function unlockUnit(id){
  if(!ISADMIN) return;
  if(!confirm('Reopen this account for editing?')) return;
  try{
    var u=UNITS.filter(function(x){ return x.id===id; })[0];
    var d=await (await fetch(PORTAL_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({ action:'qa2_save', id:id, unlock:'1', verdicts:(u&&u.verdicts)||{} })})).json();
    if(d&&d.ok){ if(u) u.status='in_progress'; toast('Reopened'); renderMine(); }
    else toast('Failed: '+((d&&d.error)||'unknown'));
  }catch(e){ toast('Failed: '+e.message); }
}

async function submitAll(){
  var va=UNITS[0]; if(!va) return;   // UNITS is already narrowed to the open VA
  if(!confirm('Submit the review for '+va.full_name+'?\n\nThis writes their week QA score and cannot be edited afterwards.')) return;
  var btn=document.querySelector('#pane-mine .btn.g'); if(btn){ btn.disabled=true; btn.textContent='Submitting…'; }
  try{
    var d=await (await fetch(PORTAL_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({ action:'qa2_submit', month:$('f-month').value, week:$('f-week').value,
                            employee_id:va.employee_id, by:USER.name })})).json();
    if(d&&d.ok){
      var msg='Submitted — '+va.full_name+' scored '+d.score;
      if(d.capped) msg+=' (raw '+d.raw+', capped: only '+d.coverage+'% of their recorded outputs had screenshots)';
      toast(msg);
      if(d.tasks && d.tasks.length>1){
        alert('Score breakdown for '+va.full_name+' — '+d.score+'/100'+
          (d.capped?('\n⚠ Raw checklist score was '+d.raw+', capped because proof coverage is '+d.coverage+'%. Unproven work cannot be graded perfect.'):'')+
          '\n\n'+d.tasks.map(function(t){ return '· '+t.task+' — '+(t.pct==null?'n/a':t.pct+'%')+' ('+t.answered+' criteria)'; }).join('\n'));
      }
      CUR_UNIT=''; loadMine(); }
    else if(d&&d.error==='INCOMPLETE'){
      toast((d.examples&&d.examples[0]) ? ('Still unchecked — '+d.examples[0]) : (d.remaining+' account(s) still unchecked'));
      if(btn){ btn.disabled=false; btn.textContent='Submit review'; } }
    else if(d&&d.error==='NOTHING_SCOREABLE'){ alert(d.message); if(btn){ btn.disabled=false; btn.textContent='Submit review'; } }
    else { toast('Failed: '+((d&&d.error)||'unknown')); if(btn){ btn.disabled=false; btn.textContent='Submit review'; } }
  }catch(e){ toast('Failed: '+e.message); if(btn){ btn.disabled=false; btn.textContent='Submit review'; } }
}

/* ══ 🎲 BLIND PANEL (admin) — weekly seeded panel of five anonymous seats ══ */

        '<div style="font-size:12.5px;color:var(--t2);margin-top:5px;">reviews ('+sx.reviewees.length+'): '+sx.reviewees.map(function(r){ return esc(r.name); }).join(' · ')+'</div></div>';
    }).join('');
    h+='<div style="border:1px solid rgba(226,86,15,.4);border-radius:12px;padding:12px 14px;margin-bottom:12px;">'+
       '<b>👑 You review the leads:</b> <span style="color:var(--t2);">'+((d.leads&&d.leads.length)?d.leads.map(function(l){ return esc(l.name); }).join(' · '):'(no leads configured yet)')+'</span></div>';
    h+='<button class="btn p" onclick="applyPanel()">✅ Apply panel for this week</button>'+
       '<div class="sub" style="margin-top:8px;">Apply samples the week\'s proof and assigns every case to its seat (submitted reviews are never touched). Reviews land recorded as “Blind Panel N”.</div></div>';
    h+='<div class="card"><b>🔑 Seat passwords</b><div class="sub" style="margin:4px 0 9px;">Only you ever see these. On review day, type each one at its desk yourself.</div>'+
       [1,2,3,4,5].map(function(i){ return '<input type="password" id="pp'+i+'" placeholder="PANEL'+i+' password" style="margin:0 6px 8px 0;">'; }).join('')+
       '<div><button class="btn" onclick="savePanelPass()">Save passwords</button> <span id="pp-msg" style="font-size:12px;color:var(--t3);"></span></div></div>';
    p.innerHTML=h;
  }catch(e){ p.innerHTML='<div class="warn">'+esc(e.message)+'</div>'; }
}
async function applyPanel(){
  var m=$('f-month').value||curMonth(), w=$('f-week').value||'1';
  if(!confirm('Apply the blind panel for '+m+' week '+w+'?\n\nThis samples the week and assigns every case to the PANEL seats (leads to you). Already-submitted reviews are never touched.')) return;
  try{
    var d=await (await fetch(PORTAL_URL+'?action=qa2_panel&month='+encodeURIComponent(m)+'&week='+encodeURIComponent(w)+'&confirm=RUN&pass='+encodeURIComponent(ADMIN_PIN)+'&_='+Date.now())).json();
    if(d&&d.ok&&d.applied){ alert('✅ Panel applied.\nUnits per seat: '+JSON.stringify(d.applied.perSeat)+'\nYour lead units: '+d.applied.adminUnits); }
    else alert('Failed: '+((d&&d.error)||'unknown'));
  }catch(e){ alert('Network error — try again.'); }
}
async function savePanelPass(){
  var qs=[1,2,3,4,5].map(function(i){ var v=($('pp'+i).value||'').trim(); return v?('p'+i+'='+encodeURIComponent(v)):''; }).filter(String).join('&');
  if(!qs){ $('pp-msg').textContent='Nothing to save.'; return; }
  try{
    var d=await (await fetch(PORTAL_URL+'?action=qa2_panel_setpass&'+qs+'&pass='+encodeURIComponent(ADMIN_PIN)+'&_='+Date.now())).json();
    $('pp-msg').textContent=(d&&d.ok)?('Saved '+d.updated+' password(s) ✅'):('Failed: '+((d&&d.error)||''));
    [1,2,3,4,5].forEach(function(i){ $('pp'+i).value=''; });
  }catch(e){ $('pp-msg').textContent='Network error.'; }
}

</script>
