<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Resignation & Policy Agreement — JMB Virtuals</title>
<style>
  :root{ --orange:#e83d00; --orange2:#ff6b1a; --ink:#1a1a1a; --muted:#6b7280; --line:#e6e6ea; --bg:#f4f5f7; --card:#ffffff; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  .wrap{ max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  .brand{ display:flex; align-items:center; gap:10px; padding:18px 0 14px; }
  .brand b{ color:var(--orange); font-size:20px; letter-spacing:.02em; }
  .brand span{ color:var(--muted); font-size:13px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 12px 40px -24px rgba(0,0,0,.4); }
  h1{ font-size:22px; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:13.5px; margin:0 0 18px; }
  .policy{ background:#fbf3ef; border:1px solid #f3d9cd; border-radius:12px; padding:14px 16px; max-height:230px; overflow:auto; font-size:13px; color:#3a3a3a; }
  .policy h3{ margin:0 0 6px; font-size:13px; color:var(--orange); text-transform:uppercase; letter-spacing:.04em; }
  .policy p{ margin:0 0 9px; }
  .policy b{ color:var(--ink); }
  label.fld{ display:block; font-size:12px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); margin:18px 0 6px; }
  input[type=text], input[type=date]{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; font-family:inherit; background:#fff; }
  input[type=text]:focus, input[type=date]:focus{ outline:none; border-color:var(--orange); box-shadow:0 0 0 3px rgba(232,61,0,.12); }
  .file{ display:block; width:100%; border:1.5px dashed #d8b5a6; border-radius:12px; padding:20px 16px; text-align:center; background:#fffaf7; cursor:pointer; }
  .file input{ display:none; }
  .file .big{ font-size:15px; font-weight:600; }
  .file .hint{ color:var(--muted); font-size:12.5px; margin-top:4px; }
  .file .chosen{ color:var(--orange); font-weight:700; font-size:13.5px; margin-top:6px; word-break:break-all; }
  .chk{ display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer; }
  .chk:last-child{ border-bottom:none; }
  .chk input{ margin-top:2px; width:18px; height:18px; flex:0 0 auto; accent-color:var(--orange); }
  .agree{ display:flex; align-items:flex-start; gap:10px; margin:18px 0 4px; padding:12px 14px; background:#fff8f5; border:1px solid #f3d9cd; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer; }
  .agree input{ margin-top:2px; width:18px; height:18px; flex:0 0 auto; accent-color:var(--orange); }
  button.go{ width:100%; margin-top:20px; padding:14px; border:none; border-radius:12px; background:linear-gradient(135deg,var(--orange2),var(--orange)); color:#fff; font-weight:800; font-size:15px; cursor:pointer; }
  button.go:disabled{ opacity:.55; cursor:not-allowed; }
  .msg{ margin-top:12px; font-size:13.5px; min-height:18px; }
  .state{ text-align:center; padding:26px 10px; }
  .state .ic{ font-size:44px; }
  .state h2{ margin:10px 0 6px; }
  .state p{ color:var(--muted); font-size:14px; margin:0; }
  .foot{ text-align:center; color:var(--muted); font-size:11.5px; margin-top:20px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>JMB VIRTUALS</b><span>· Operations Management</span></div>
  <div class="card" id="card">
    <div class="state"><div class="ic">⏳</div><h2>Loading…</h2><p>Please wait a moment.</p></div>
  </div>
  <div class="foot">JMB Virtuals is a community of independent freelance virtual assistants. This form records your voluntary resignation and your agreement to our conduct policy. It does not create an employer–employee relationship.</div>
</div>

<script>
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxbOUn-0xO4r8H4bw4nA7YMfVb0yByOLL4TuRPKvtPh2rjY-b3rOJ5aBoIc8sOmO9kP/exec";
var TOKEN = new URLSearchParams(location.search).get('t') || '';
var FILE_DATA = null;
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function card(html){ document.getElementById('card').innerHTML = html; }

function boot(){
  if(!TOKEN){ card('<div class="state"><div class="ic">🔗</div><h2>Invalid link</h2><p>This resignation link is missing its code. Please use the exact link sent to you.</p></div>'); return; }
  fetch(APPS_SCRIPT_URL + '?action=offb_link_get&t=' + encodeURIComponent(TOKEN) + '&_=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || d.error){ card('<div class="state"><div class="ic">🔗</div><h2>Link not found</h2><p>This link is invalid or has expired. Please contact JMB Virtuals Operations.</p></div>'); return; }
      if(d.submitted){ received(d.va_name, true); return; }
      form(d.va_name || 'there');
    })
    .catch(function(){ card('<div class="state"><div class="ic">⚠️</div><h2>Connection error</h2><p>Please check your internet and refresh this page.</p></div>'); });
}

function received(name, already){
  card('<div class="state"><div class="ic">✅</div><h2>'+(already?'Already submitted':'Received — thank you')+'</h2>'+
    '<p>'+(already?'Your resignation and policy agreement are already on file. JMB Virtuals Operations will coordinate the next steps with you.':'Your resignation and policy agreement have been recorded. JMB Virtuals Operations will coordinate the next steps and reconcile any fees for completed work.')+'</p></div>');
}

function form(name){
  card(
    '<h1>Resignation & Policy Agreement</h1>'+
    '<p class="sub">Hi '+esc(name)+' — please read the policy, attach your resignation letter, confirm the details below, and submit.</p>'+
    '<div class="policy">'+
      '<h3>AWOL &amp; Proper Disengagement — summary</h3>'+
      '<p><b>Who we are.</b> JMB Virtuals is a community of independent freelance virtual assistants coordinated by Founder / Operations Manager Jethro Bringas. You are an <b>independent contractor</b> serving your own client — this is not employment, and there are no statutory or government-mandated benefits.</p>'+
      '<p><b>AWOL is not tolerated.</b> Becoming unreachable during committed hours without notice, or abandoning your engagement, harms your client and the community. Please always give proper notice instead of going silent.</p>'+
      '<p><b>The right way to leave.</b> Give advance notice, submit this resignation, turn over your work, and return all client &amp; JMB access, files, and credentials.</p>'+
      '<p><b>If you go AWOL.</b> JMB Virtuals may inform your client, arrange replacement support, end the engagement and revoke access, decline future engagements, and withhold a favorable reference.</p>'+
      '<p><b>Fees.</b> Only fees for work already completed are reconciled, in line with your arrangement with your client and/or JMB Virtuals.</p>'+
    '</div>'+

    '<label class="fld">Attach your resignation letter (PDF or image)</label>'+
    '<label class="file" id="filebox"><input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.webp,image/*,application/pdf" />'+
      '<div class="big">📎 Tap to choose a file</div><div class="hint">PDF, PNG or JPG · up to 7 MB</div><div class="chosen" id="chosen"></div></label>'+

    '<label class="fld">Intended last working day</label>'+
    '<input type="date" id="lastday" />'+

    '<label class="fld">Confirm before you submit</label>'+
    '<label class="chk"><input type="checkbox" class="ret" /> I have returned / will return all client &amp; JMB accounts, tools, and files.</label>'+
    '<label class="chk"><input type="checkbox" class="ret" /> I have handed over / will hand over my passwords and credentials.</label>'+
    '<label class="chk"><input type="checkbox" class="ret" /> I have completed / will complete turnover of my pending tasks.</label>'+

    '<label class="fld">Type your full name as your e-signature</label>'+
    '<input type="text" id="sig" placeholder="Juan D. Dela Cruz" autocomplete="name" />'+

    '<label class="agree"><input type="checkbox" id="agree" /> I have read and agree to the JMB Virtuals AWOL &amp; Proper Disengagement Policy, and I confirm this resignation is voluntary.</label>'+

    '<button class="go" id="submit" onclick="submit()">Submit resignation</button>'+
    '<div class="msg" id="msg"></div>'
  );
  document.getElementById('file').addEventListener('change', onFile);
}

function onFile(e){
  var f = e.target.files && e.target.files[0]; var chosen = document.getElementById('chosen');
  if(!f){ FILE_DATA=null; chosen.textContent=''; return; }
  if(f.size > 7*1024*1024){ FILE_DATA=null; chosen.textContent=''; msg('That file is over 7 MB. Please attach a smaller file.', true); e.target.value=''; return; }
  var reader = new FileReader();
  reader.onload = function(){ var s=String(reader.result||''); var comma=s.indexOf(','); FILE_DATA={ b64:(comma>=0?s.slice(comma+1):s), name:f.name, mime:f.type||'application/octet-stream' }; chosen.textContent='✓ '+f.name; msg('',false); };
  reader.readAsDataURL(f);
}

function msg(t, err){ var m=document.getElementById('msg'); if(m){ m.textContent=t; m.style.color = err ? '#dc2626' : '#16a34a'; } }

function submit(){
  var sig=(document.getElementById('sig').value||'').trim();
  var lastday=(document.getElementById('lastday').value||'').trim();
  var agree=document.getElementById('agree').checked;
  var rets=[].slice.call(document.querySelectorAll('.ret'));
  var allRet=rets.every(function(c){ return c.checked; });
  if(!FILE_DATA){ msg('Please attach your resignation letter.', true); return; }
  if(!lastday){ msg('Please choose your intended last working day.', true); return; }
  if(!allRet){ msg('Please confirm all three asset/turnover items.', true); return; }
  if(!sig){ msg('Please type your full name as your e-signature.', true); return; }
  if(!agree){ msg('Please tick the box to agree to the policy.', true); return; }
  var assets = rets.map(function(c){ return c.parentNode.textContent.trim(); });
  var btn=document.getElementById('submit'); btn.disabled=true; btn.textContent='Submitting…'; msg('Uploading your resignation…', false);
  fetch(APPS_SCRIPT_URL, {
    method:'POST',
    body: JSON.stringify({ action:'offb_link_submit', token:TOKEN, agreed:true, signature:sig, last_day:lastday, assets:assets,
      file_b64:FILE_DATA.b64, file_name:FILE_DATA.name, mime:FILE_DATA.mime })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d && d.ok){ received(sig, false); }
    else if(d && d.error==='ALREADY_SUBMITTED'){ received(sig, true); }
    else { msg('Could not submit: '+((d&&d.error)||'please try again')+'.', true); btn.disabled=false; btn.textContent='Submit resignation'; }
  })
  .catch(function(){ msg('Connection error. Please try again.', true); btn.disabled=false; btn.textContent='Submit resignation'; });
}

boot();
</script>
</body>
</html>
