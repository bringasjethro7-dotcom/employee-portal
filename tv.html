<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>JMB Huddle TV</title>
<link rel="icon" href="jmb-logo-mark.svg">
<style>
/* JMB HUDDLE TV (Nov 3, 2026) — open this page in the TV's own web browser. It shows a code; the presenter types it
   in the Huddle show (button "Show on TV") and this screen follows every slide live. No sign-in, nothing stored. */
html,body{margin:0;height:100%;background:#05070f;color:#fff;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
#wait{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 15% -10%,#312e81 0,transparent 60%),radial-gradient(900px 600px at 110% 110%,#7c2d12 0,transparent 60%),#05070f}
#wait .card{text-align:center;padding:5vh 6vw;transform-origin:center center}
#wait img{width:9vh;height:9vh;border-radius:2.2vh}
#wait .k{margin-top:3vh;font-size:2.2vh;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:#fdba74}
#wait .h{font-size:5vh;font-weight:900;letter-spacing:-.02em;margin-top:1vh}
#wait .code{margin:4vh auto 0;display:flex;justify-content:center}
#wait .code span{margin:0 .8vh;display:flex;align-items:center;justify-content:center;width:13vh;height:17vh;border-radius:2.4vh;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);font-size:11vh;font-weight:900;font-variant-numeric:tabular-nums}
#wait .how{margin-top:4.5vh;font-size:2.8vh;line-height:1.5;color:rgba(255,255,255,.78)}
#wait .how b{color:#fff}
#wait .st{margin-top:3vh;font-size:2.1vh;color:rgba(255,255,255,.5)}
#wait .st i{display:inline-block;width:1.2vh;height:1.2vh;border-radius:50%;background:#f59e0b;margin-right:1vh;vertical-align:.1vh}
#wait .st.ok i{background:#10b981}
#show{display:none;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%}
#show .hds{position:absolute!important;top:0!important;left:0!important;right:0!important;bottom:0!important;width:100%;height:100%}
#tvsz{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;font-size:2.4vh;font-weight:800;padding:1.2vh 2.4vh;border-radius:1.4vh;z-index:2147483647;opacity:0;transition:opacity .25s;pointer-events:none}
#wait .keys{margin-top:2vh;font-size:1.9vh;color:rgba(255,255,255,.42)}
.tv-still *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div id="wait"><div class="card">
  <img src="logo-aura.svg" alt="">
  <div class="k">JMB Virtuals</div>
  <div class="h">Huddle TV</div>
  <div class="code" id="code"></div>
  <div class="how">On the laptop: open the <b>Huddle</b> → <b>Start the huddle</b> → press <b>Show on TV</b> and type this code.<br>This screen follows the huddle from then on.</div>
  <div class="st" id="st"><i></i>Connecting…</div>
  <div class="keys">Not filling the screen? Remote: <b>Up</b> / <b>Down</b> changes the size · <b>OK</b> = full screen</div>
</div></div>
<div id="show"></div>
<div id="tvsz"></div>
<script src="huddle.js"></script>
<script>
(function(){
  var SUPA_URL='https://rvyrnkjqxnijxydloujk.supabase.co', SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2eXJua2pxeG5panh5ZGxvdWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NzAwODQsImV4cCI6MjA5NzE0NjA4NH0.SwkSkmbeWrhm5PZZDSZ1Z4hbjpQ0L2CRtuKQmpHshBE';
  var AL='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function qs(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
  var code=String(qs('code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6){ try{ code=localStorage.getItem('hudtv_code')||''; }catch(e){ code=''; } }
  if(code.length!==6){ code=''; for(var i=0;i<6;i++) code+=AL.charAt(Math.floor(Math.random()*AL.length)); }
  try{ localStorage.setItem('hudtv_code', code); }catch(e){}
  document.getElementById('code').innerHTML=code.split('').map(function(c){ return '<span>'+c+'</span>'; }).join('');
  var TOPIC='realtime:hudtv-'+code, WS=null, REF=0, HB=null, HELLO=null, JOINED=false, LIVE=false, CUR='', LAST=0, SAID=0;
  try{ if(window.JMBHuddle && JMBHuddle.tvCss) JMBHuddle.tvCss(); }catch(e){}
  var wait=document.getElementById('wait'), show=document.getElementById('show'), st=document.getElementById('st');
  show.innerHTML='<div class="hds"><div class="hds-st"><div class="hds-bl a"></div><div class="hds-bl b"></div><div class="hds-grid"></div><div class="hds-ghost"></div><div class="hds-top"></div><div class="hds-body"></div><div class="hds-foot"></div></div></div>';
  var stage=show.querySelector('.hds-st'), card=wait.querySelector('.card');
  /* size: fits the screen by itself; the remote's Up / Down make it bigger or smaller (remembered on this TV) */
  var Z=1; try{ Z=parseFloat(localStorage.getItem('hudtv_zoom'))||1; }catch(e){}
  var qz=parseFloat(qs('z')); if(qz>0.3 && qz<3) Z=qz;
  function vw(){ var a=[window.innerWidth||0, document.documentElement.clientWidth||0, document.body.clientWidth||0]; if(window.visualViewport) a.push(window.visualViewport.width||0); return Math.max.apply(null, a)||1920; }
  function vh(){ var a=[window.innerHeight||0, document.documentElement.clientHeight||0]; if(window.visualViewport) a.push(window.visualViewport.height||0); return Math.max.apply(null, a)||1080; }
  function fit(){ var k=Math.min(vw()/1920, vh()/1080)*Z; stage.style.transform='translate(-50%,-50%) scale('+k+')'; stage.style.webkitTransform=stage.style.transform; card.style.transform='scale('+Z+')'; card.style.webkitTransform=card.style.transform; }
  fit(); window.addEventListener('resize', fit); setInterval(fit, 2000);
  var szT=null; function sizeNote(){ var n=document.getElementById('tvsz'); n.textContent='Size '+Math.round(Z*100)+'%'; n.style.opacity='1'; clearTimeout(szT); szT=setTimeout(function(){ n.style.opacity='0'; }, 1600); }
  function setZ(z){ Z=Math.max(0.5, Math.min(2.5, Math.round(z*100)/100)); try{ localStorage.setItem('hudtv_zoom', String(Z)); }catch(e){} fit(); sizeNote(); }
  function goFull(){ var d=document.documentElement; try{ if(!(document.fullscreenElement||document.webkitFullscreenElement)){ if(d.requestFullscreen) d.requestFullscreen(); else if(d.webkitRequestFullscreen) d.webkitRequestFullscreen(); } }catch(e){} setTimeout(fit, 700); setTimeout(fit, 1600); }
  document.addEventListener('keydown', function(e){ var c=e.keyCode||e.which;
    if(c===38||c===39||c===33){ setZ(Z+0.05); e.preventDefault(); }
    else if(c===40||c===37||c===34){ setZ(Z-0.05); e.preventDefault(); }
    else if(c===13){ goFull(); }
    else if(c===48){ setZ(1); } });
  document.addEventListener('click', goFull);
  function q(s){ return stage.querySelector(s); }
  function status(t, ok){ st.className='st'+(ok?' ok':''); st.innerHTML='<i></i>'+t; }
  function setLive(on){ LIVE=on; wait.style.display=on?'none':'flex'; show.style.display=on?'block':'none'; if(on) fit(); }
  function onMsg(ev, p){
    LAST=Date.now();
    if(ev==='snap'){
      var same=(p.k===CUR); CUR=p.k;
      if(same) stage.classList.add('tv-still'); else stage.classList.remove('tv-still');
      q('.hds-top').innerHTML=p.top||''; q('.hds-body').innerHTML=p.body||''; q('.hds-foot').innerHTML=p.foot||''; q('.hds-ghost').textContent=p.ghost||'';
      if(p.a) q('.hds-bl.a').style.background=p.a; if(p.b) q('.hds-bl.b').style.background=p.b;
      if(same) setTimeout(function(){ stage.classList.remove('tv-still'); }, 60);
      var was=LIVE; setLive(true); if(!was) hello();   /* tell the laptop the TV is showing it */
    } else if(ev==='tick'){
      if(!LIVE || p.k!==CUR) { if(!LIVE) hello(); return; }
      var c=q('.hds-clock'); if(c && p.c!=null) c.innerHTML=p.c;
      var on=q('.hds-rail .on i'); if(on && p.w) on.style.width=p.w;
    } else if(ev==='end'){ CUR=''; setLive(false); status('The huddle ended. Waiting for the next one…', true); }
  }
  function send(o){ try{ if(WS && WS.readyState===1) WS.send(JSON.stringify(o)); }catch(e){} }
  function hello(){ SAID=Date.now(); if(JOINED) send({ topic:TOPIC, event:'broadcast', payload:{ type:'broadcast', event:'hello', payload:{ t:Date.now() } }, ref:String(++REF) }); }
  function connect(){
    status('Connecting…', false);
    try{ WS=new WebSocket(SUPA_URL.replace(/^http/,'ws')+'/realtime/v1/websocket?apikey='+encodeURIComponent(SUPA_KEY)+'&vsn=1.0.0'); }catch(e){ setTimeout(connect, 4000); return; }
    WS.onopen=function(){
      REF++; send({ topic:TOPIC, event:'phx_join', payload:{ config:{ broadcast:{ ack:false, self:false }, presence:{ key:'' }, postgres_changes:[], private:false }, access_token:SUPA_KEY }, ref:String(REF), join_ref:String(REF) });
      clearInterval(HB); HB=setInterval(function(){ send({ topic:'phoenix', event:'heartbeat', payload:{}, ref:String(++REF) }); }, 25000);
    };
    WS.onmessage=function(e){ var m; try{ m=JSON.parse(e.data); }catch(x){ return; }
      if(m.topic===TOPIC && m.event==='phx_reply' && m.payload && m.payload.status==='ok' && !JOINED){ JOINED=true; status('Ready — waiting for the huddle to start…', true); hello(); }
      else if(m.topic===TOPIC && m.event==='phx_reply' && m.payload && m.payload.status==='error'){ status('Could not join — retrying…', false); }
      else if(m.topic===TOPIC && m.event==='broadcast' && m.payload){ onMsg(m.payload.event, m.payload.payload||{}); }
    };
    WS.onclose=function(){ JOINED=false; clearInterval(HB); status('Reconnecting…', false); setTimeout(connect, 3000); };
    WS.onerror=function(){ try{ WS.close(); }catch(x){} };
  }
  /* say hello now and then, so a laptop that opens the show later finds this TV at once */
  HELLO=setInterval(function(){ if(!LIVE || Date.now()-SAID>25000) hello(); }, 8000);   /* waiting: every 8 s · showing: every 25 s (keeps the laptop's "On TV") */
  setInterval(function(){ if(LIVE && Date.now()-LAST>90000){ CUR=''; setLive(false); status('Lost the huddle — waiting for it to come back…', false); } }, 10000);
  connect();
})();
</script>
</body>
</html>
